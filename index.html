button><\/div>`);":">Save Avatar<\/button><\/div>`);",">保存（重建转盘）<\/button>":">Save (Rebuild Roulette)<\/button>",">关闭<\/button><\/div>`;":">Close<\/button><\/div>`;",">分类<\/label>":">Category<\/label>",">删除所有记录（不可恢复，请先导出备份）<\/div>":">Delete all records (irreversible, please export a backup first)<\/div>",">勾选不想吃的菜（可多选），或输入食材/关键词（如：猪肝、香菜）——保存后转盘永远不会再转到它们<\/p>":">Check the dishes you don't want to eat (multiple selections allowed), or enter ingredients/keywords (e.g., pig liver, cilantro) — after saving, the spinner will never land on them again<\/p>",">取消达成<\/button>":">Cancel Achievement<\/button>",">奖状墙还空着，点亮第一颗星星吧 ⭐<\/div>`;":">The wall of awards is still empty, let's light up the first star ⭐<\/div>`;",">家里现成就能玩的游戏，按能力分类；完成记录可在「奖状墙」点亮对应技能<\/p>":">Games that can be played at home, classified by ability; completion records can illuminate the corresponding skills on the 'Certificate Wall'<\/p>",">成长记录 ›<\/div><\/div>":">Growth Record ›<\/div><\/div>",">技能清单（点五角星完成/取消）<\/span>":">Skill List (Click the star to complete/cancel)<\/span>",">把小红书、抖音等实用的视频存进来，随时打开或复制给家人<\/p>":">Save practical videos from Xiaohongshu, Douyin, etc., so you can open them anytime or share them with your family<\/p>",">把英语揉进日常生活，点 🔊 跟读，常用句点 ❤️ 收藏<\/p>":">Incorporate English into your daily life, tap 🔊 to follow along, and tap ❤️ to save commonly used phrases<\/p>",">换一张宝宝照片当头像吧<\/p>":">Change to a baby photo as your profile picture<\/p>",">收藏夹还空着，遇到常用句点 ❤️ 收进来吧<\/div>';":">The favorites are still empty. When you encounter commonly used sentences ❤️ add them in.<\/div>';",">每天 10 分钟，点 ▶ 听歌词跟读，边听边做动作效果最好<\/p>":">10 minutes a day, click ▶ to listen and follow the lyrics, doing the actions while listening works best<\/p>",">每天 3 个生活中可能遇到的小场景，看看家长可以怎么做<\/p>":">Three small everyday scenarios you might encounter each day, and see what parents can do<\/p>",">每天一个好故事，陪宝宝一起读；点 🔊 讲给宝宝听<\/p>":">A good story every day, read together with your baby; click 🔊 to listen to it for your baby<\/p>",">每天浇水、晒太阳，苗苗和宝宝一起长大；点一点苗苗，它会回应你哦<\/p>":">Water every day and let it bask in the sun, the seedlings grow up together with the baby; tap the seedlings a little, and it will respond to you<\/p>",">每天自动按日期排一个「用家里现成东西就能玩」的游戏，完成就点「完成打卡」<\/p>":">Automatically arrange a \"game that can be played with things already at home\" by date every day, and click \"Complete Check-in\" when finished<\/p>",">没有找到匹配的故事<\/div>`;":">No matching story found<\/div>`;",">没有找到匹配的游戏<\/div>`;":">No matching games found<\/div>`;",">添加<\/button>":">Add<\/button>",">添加<\/button><\/div>":">Add<\/button><\/div>",">添加<\/button><\/div>`);":">Add<\/button><\/div>`);",">添加家里的拿手菜，加入转盘后备选项：每次旋转约一半几率上场、顶替盘上 2 格，被转到的概率和普通菜差不多<\/p>":">Add your signature home dish, and after adding it to the roulette backup options: each spin has about a 50% chance of appearing, replacing 2 slots on the roulette. The probability of being selected is similar to ordinary dishes.<\/p>",">清空全部<\/button><\/div>`);":">Clear All<\/button><\/div>`);",">清空示例<\/button><\/div>":">Clear Example<\/button><\/div>",">点「开始旋转」再点「停止」——停到哪道就做哪道；🚫 不想吃和 ⚠️ 过敏的自动避开，❤️ 爱吃的概率翻倍，📝 自定义食谱有机会上场<\/p>":">Click 'Start Spin' and then click 'Stop' — do the dish it stops on; 🚫 Automatically avoid dishes you don't want to eat and ⚠️ are allergic to, ❤️ double the probability for dishes you love, 📝 custom recipes have a chance to appear<\/p>",">点一颗星星，查看 / 编辑技能达成时间<\/p>":">Click on a star to view/edit skill completion time<\/p>",">点亮一个技能，五角星就上奖状墙并记录完成日期；点亮的可再点取消<\/p>":">When you light up a skill, the pentagram goes on the award wall and the completion date is recorded; lit skills can be clicked again to cancel<\/p>",">点击切换状态：待排敏 → ✅ 已排敏（吃过没问题）→ ⚠️ 过敏（红色）→ 待排敏；标了过敏的食物永远不会出现在转盘和三餐推荐里<\/p>":">Click to toggle status: Pending Allergy Test → ✅ Tested Safe (no issues after eating) → ⚠️ Allergic (red) → Pending Allergy Test; Foods marked as allergic will never appear in the roulette or meal recommendations<\/p>",">点卡片听发音，先读字母再读单词，跟着 ABC 歌一起唱<\/p>":">Click the card to hear the pronunciation, first read the letters, then read the word, sing along with the ABC song<\/p>",">点卡片听发音，学会的点右上角 ✓，攒满一本超有成就感<\/p>":">Click the card to listen to the pronunciation, tap the ✓ in the top right corner when you’ve learned it, filling up a whole book feels extremely rewarding<\/p>",">移除预置的示例记录，保留你自己的数据<\/div>":">Remove the preset example records and keep your own data<\/div>",">类别<\/label>":">Category<\/label>",">自定义食材 / 关键词（可一次输入多个，用、或空格分隔）<\/label>":">Custom ingredients / keywords (you can enter multiple at a time, separated by commas or spaces)<\/label>",">记录 ≥2 条显示曲线<\/div><\/div>`;":">Record ≥2 display curves<\/div><\/div>`;",">记录今日辅食<\/button><\/div>`);":">Record today's complementary food<\/button><\/div>`);",">记录新购（累加库存）<\/button><\/div>`);":">Record New Purchase (Add to Inventory)<\/button><\/div>`);",">记录购买时间与可用天数，自动计算剩余时间，快用完时提醒补货<\/p>":"Record the purchase time and available days, automatically calculate the remaining time, and remind to restock when it's about to run out.<\/p>",">该分类还没有技能<\/div>`;":">This category does not have any skills<\/div>`;",">还没有攻略，点上面「添加攻略」把链接存进来吧 ⭐<\/div>`;":">There is no guide yet. Click 'Add Guide' above to save the link ⭐<\/div>`;",">还没有用品记录，点上面「记录一件用品」<\/div>`;":">There is no item record yet, click on \"Record an item\" above<\/div>`;",">还没有自定义食谱<\/div>';":">No custom recipes yet<\/div>';",">还没添加自定义项<\/span>';":">No custom items added yet<\/span>';",">重置为推荐30个<\/button>":">Reset to recommend 30<\/button>",">陪宝宝读的好故事，按名字搜索；点一个看详情、听故事<\/p>":">Good stories to read with your baby, search by name; click one to see details and listen to the story<\/p>",">＋ 添加到转盘后备<\/button><\/div>":">＋ Add to roulette backup<\/button><\/div>",">＋ 添加攻略<\/button>":">＋ Add Strategy<\/button>",">＋ 记录身高 / 体重 / 头围<\/button>":">＋ Record height / weight / head circumference<\/button>",">💡 不要求一次说很多，固定场景反复说同一句，宝宝自然就懂了":">💡 You don't need to say a lot at once; repeating the same sentence in the same situation will help the baby naturally understand.",">💡 先听几遍熟悉旋律，再跟着做动作，最后留白让宝宝接词（比如唱到 “round and ____” 停一下）":">💡 Listen to the melody a few times to get familiar with it, then follow along with the actions, and finally leave a pause for the baby to fill in the word (for example, sing up to “round and ____” and pause)",">💡 排敏原则：新食物一次只加一种，连吃 3 天观察反应；蛋白、虾、芒果、花生等易过敏食物建议 1 岁后逐步尝试，每次少量":">💡 Allergy Avoidance Principle: Introduce new foods one at a time, observe reactions for 3 consecutive days; foods prone to allergies like protein, shrimp, mango, peanuts, etc., are recommended to be gradually tried after 1 year old, with a small amount each time.",">💡 教育没有标准答案，情绪稳定 + 共情 + 示范，是通用的底层方法":">💡 There is no standard answer in education; emotional stability + empathy + demonstration are universal fundamental methods",">💬 亲子口语<\/button><\/div>":">💬 Parent-child Speaking<\/button><\/div>",">📊 1-2 岁宝宝每日摄入量参考（中国居民膳食指南）<\/div>":">📊 Daily intake reference for 1-2 year old infants (Chinese Dietary Guidelines)<\/div>",">📋 复制<\/button>":">📋 Copy<\/button>",">📚 去故事库<\/button>":">📚 Go to Story Library<\/button>",">🔄 换一个<\/button>":">🔄 Change one<\/button>",">🔄 换一套<\/button><\/div>":">🔄 Change a set<\/button><\/div>",">🔊 听故事<\/button>":">🔊 Listen to the story<\/button>",">🔊 点击卡片朗读英文单词，让宝宝看着 emoji 指认":">🔊 Click the card to read the English word aloud, and let the baby look at the emoji to point it out",">🔊 点击字母卡片，先读字母、再读 “A is for Apple” 整句，跟着 ABC 歌一起唱":">🔊 Click the letter card, first read the letter, then read the whole sentence 'A is for Apple,' and sing along with the ABC song","[\"三文鱼土豆饼+玉米浓汤+清炒小青菜\",\"荤：三文鱼40g｜素：土豆半个、甜玉米粒30g、小青菜3棵｜主食：面粉30g\",\"三文鱼蒸熟去刺压碎，土豆蒸熟压泥，与面粉混合成团，压成小饼，平底锅少油小火煎两面金黄":"[Salmon Potato Pancakes + Corn Cream Soup + Stir-fried Baby Bok Choy, Meat: 40g salmon | Vegetables: half a potato, 30g sweet corn kernels, 3 baby bok choy | Staple: 30g flour, Steam the salmon until cooked, remove the bones and mash it, steam the potato and mash it, mix with flour to form a dough, shape into small pancakes, pan-fry both sides with a little oil over low heat until golden brown]","[\"三文鱼蒸蛋+清炒豌豆苗+杂粮饭\",\"荤：三文鱼30g、鸡蛋1个｜素：豌豆苗一小把、燕麦米少许｜主食：大米50g\",\"三文鱼切丁，鸡蛋打散加温水，鱼丁铺碗底淋蛋液蒸12分钟":"[\"Steamed Egg with Salmon + Stir-fried Pea Shoots + Mixed Grain Rice\",\"Meat: 30g salmon, 1 egg | Vegetarian: a small handful of pea shoots, a little oat rice | Staple: 50g rice\",\"Dice the salmon, beat the egg and mix with warm water, place the salmon at the bottom of the bowl, pour the egg mixture over, and steam for 12 minutes\"]","[\"三鲜菌菇面+清炒荷兰豆\",\"荤：鲜虾仁20g、肉末20g｜素：香菇2朵、荷兰豆8个｜主食：宝宝面条50g\",\"虾仁切丁、香菇切片，热油下肉末和虾仁炒香，加香菇和开水煮成汤底":"[Three-Delicacy Mushroom Noodles + Stir-Fried Snow Peas, Meat: 20g fresh shrimp, 20g minced meat | Vegetables: 2 shiitake mushrooms, 8 snow peas | Staple: 50g baby noodles, Dice the shrimp, slice the shiitake mushrooms, stir-fry the minced meat and shrimp in hot oil until fragrant, then add the shiitake mushrooms and boiling water to make the soup base]","[\"冬瓜瑶柱汤+清炒豆苗+软米饭\",\"荤：干瑶柱2粒｜素：冬瓜1段、豆苗一小把｜主食：米饭50g\",\"瑶柱泡软撕碎，与冬瓜片同煮15分钟":"[Winter Melon and Dried Scallop Soup + Stir-Fried Pea Shoots + Soft Rice, Meat: 2 dried scallops | Vegetables: 1 section of winter melon, a small handful of pea shoots | Staple: 50g of rice, Soak the dried scallops until soft, shred them, and cook together with the winter melon slices for 15 minutes]","[\"冬瓜肉丸汤+蒜蓉油麦菜+小米饭\",\"荤：猪肉末50g｜素：冬瓜1段、油麦菜2棵｜主食：大米40g+小米20g\",\"肉末加少许蛋清淀粉搅上劲，搓小丸子":"[Winter Melon Meatball Soup + Garlic Oil Lettuce + Millet Rice, Meat: 50g minced pork | Vegetables: 1 section of winter melon, 2 heads of lettuce | Staple: 40g rice + 20g millet, Mix minced pork with a little egg white and starch until firm, roll into small meatballs]","[\"南瓜鸡肉浓汤面+白灼小青菜\",\"荤：鸡腿肉30g｜素：南瓜80g、小青菜3棵｜主食：宝宝面条50g\",\"南瓜去皮蒸熟压成泥":"[Pumpkin Chicken Thick Soup Noodles + Blanched Baby Bok Choy, Meat: 30g Chicken Thigh | Vegetables: 80g Pumpkin, 3 Baby Bok Choy | Staple: 50g Baby Noodles, Peel the pumpkin, steam until cooked, and mash into puree]","[\"南瓜鸡肉焖饭+清炒小青菜+番茄块\",\"荤：鸡腿肉40g｜素：南瓜80g、小青菜3棵、番茄半个｜主食：大米50g\",\"鸡腿肉去骨切丁，南瓜去皮切丁":"[Pumpkin Chicken Stew Rice + Stir-fried Baby Bok Choy + Tomato Chunks, Meat: 40g chicken thigh | Vegetables: 80g pumpkin, 3 baby bok choy, half a tomato | Staple: 50g rice, Debone and dice the chicken thigh, peel and dice the pumpkin]","[\"土豆肉末拌饭+清炒菠菜+黄瓜条\",\"荤：猪肉末40g｜素：土豆1个、菠菜3棵、黄瓜1/4根｜主食：大米50g\",\"土豆去皮蒸熟压泥":"[\"Potato minced pork rice + stir-fried spinach + cucumber strips\", \"Meat: minced pork 40g | Vegetarian: 1 potato, 3 spinach stalks, 1/4 cucumber | Staple: 50g rice\", \"Peel, steam, mash potatoes","[\"宝宝罗宋汤+软米饭\",\"荤：牛肉末40g｜素：番茄1个、土豆半个、洋葱1/8个、卷心菜2片｜主食：米饭50g\",\"番茄去皮切丁炒出汁，加开水、土豆丁、洋葱碎煮15分钟，下牛肉末搅散再煮8分钟，最后下卷心菜丝煮3分钟":"[\"Baby Borscht + Soft Rice\", \"Meat: Minced beef 40g | Vegetarian: 1 tomato, half a potato, 1/8 onion, 2 cabbage slices | Staple: Rice 50g\", \"Peel and dice tomatoes, stir-fry until juiced, add water, diced potatoes, and chopped onion, cook for 15 minutes, add minced beef and stir until broken apart, cook for 8 minutes, finally add shredded cabbage and cook for 3 minutes.\"","[\"山药肉末面+清炒豆芽\",\"荤：猪肉末30g｜素：山药50g、黄豆芽一小把｜主食：宝宝面条50g\",\"山药去皮切小段蒸软压泥":"[Yam and Minced Pork Noodles + Stir-Fried Bean Sprouts, Meat: 30g minced pork | Vegetables: 50g yam, a small handful of soybean sprouts | Staple: 50g baby noodles, Peel and cut the yam into small pieces, steam until soft, and mash]","[\"山药蒸肉丸+炒胡萝卜丝+菠菜饭\",\"荤：猪肉末50g｜素：山药50g、胡萝卜1/4根、菠菜2棵｜主食：大米50g\",\"山药去皮蒸熟压泥，与肉末拌匀搓小丸，蒸12分钟":"[Steamed Yam Meatballs + Stir-fried Carrot Shreds + Spinach Rice, Meat: 50g minced pork | Vegetables: 50g yam, 1/4 carrot, 2 spinach leaves | Staple: 50g rice, Peel the yam, steam until soft, mash it, mix with minced pork and form small balls, steam for 12 minutes]","[\"山药鸡汤+白灼芦笋+软米饭\",\"荤：鸡腿1个｜素：山药80g、芦笋2根｜主食：米饭50g\",\"鸡腿去皮焯水，加山药块小火炖40分钟，取鸡腿肉切碎拌回汤里":"[\"Yam chicken soup + boiled asparagus + soft rice\", \"Meat: 1 chicken leg | Vegetarian: 80g yam, 2 asparagus stalks | Staple: 50g rice\", \"Peel and blanch the chicken thighs, add yam chunks and simmer over low heat for 40 minutes, then chop the chicken thigh meat and mix it back into the soup.\"","[\"排骨莲藕汤+清炒西兰花+软米饭\",\"荤：排骨2小块｜素：莲藕1段、西兰花3朵｜主食：米饭50g\",\"排骨焯水，加姜片和莲藕块，小火炖1小时，取莲藕压泥、排骨肉切碎拌入汤":"[Pork Rib and Lotus Root Soup + Stir-Fried Broccoli + Soft Rice, 'Meat: 2 small pieces of pork ribs | Vegetables: 1 section of lotus root, 3 broccoli florets | Staple: 50g of rice', Blanch the pork ribs, add ginger slices and lotus root pieces, simmer on low heat for 1 hour, mash the lotus root, chop the pork ribs finely and mix them into the soup]","[\"时蔬肉末炒饭+紫菜蛋花汤+拌黄瓜\",\"荤：猪肉末40g、鸡蛋1个｜素：胡萝卜1/4根、豌豆粒20g、黄瓜1/4根、紫菜少许｜主食：米饭80g\",\"米饭压散":"[Stir-fried rice with seasonal vegetables and minced meat + Seaweed egg drop soup + Cucumber salad, Meat: 40g minced pork, 1 egg | Vegetables: 1/4 carrot, 20g peas, 1/4 cucumber, a small amount of seaweed | Staple: 80g rice, Fluff the rice]","[\"时蔬鸡蛋卷饼+小米粥+清炒豆芽\",\"荤：鸡蛋1个｜素：生菜1片、胡萝卜1/4根、豆芽一小把、黄瓜1/4根｜主食：面粉40g、小米30g\",\"面粉加水和蛋液调成糊，摊成薄饼，卷入炒软的胡萝卜丝、生菜叶和黄瓜条，切段":"[Seasonal vegetable and egg wrap + millet porridge + stir-fried bean sprouts, Meat: 1 egg | Vegetables: 1 lettuce leaf, 1/4 carrot, a small handful of bean sprouts, 1/4 cucumber | Staple: 40g flour, 30g millet, Mix flour with water and egg to make a batter, spread into a thin pancake, roll in sautéed carrot strips, lettuce leaves, and cucumber strips, then cut into sections]","[\"清蒸鳕鱼+菠菜泥+土豆泥\",\"荤：鳕鱼50g｜素：菠菜3棵、土豆半个｜主食：土豆泥\",\"鳕鱼抹少许柠檬汁，铺姜片蒸8分钟，取出去皮去刺":"[\"Steamed Cod + Spinach Puree + Mashed Potatoes\", \"Meat: 50g cod | Vegetarian: 3 spinach leaves, half a potato | Staple: mashed potatoes\", \"Spread a little lemon juice on the cod, place ginger slices and steam for 8 minutes, then remove the skin and bones.\"]","[\"牛肉滑蛋粥+清炒西葫芦+蒸南瓜\",\"荤：牛肉末30g、鸡蛋1个｜素：西葫芦1/4根、南瓜50g｜主食：大米40g\",\"大米煮粥":"[Beef and Egg Congee + Stir-fried Zucchini + Steamed Pumpkin, Meat: 30g minced beef, 1 egg | Vegetarian: 1/4 zucchini, 50g pumpkin | Staple: 40g rice, Cook rice into congee]","[\"猪肉白菜饺+冬瓜汤+清炒胡萝卜丝\",\"荤：猪肉末50g｜素：白菜叶2片、冬瓜1段、胡萝卜1/4根｜主食：饺子皮10张\",\"肉末加白菜碎、少许香油和一点点盐拌匀成馅":"[Pork and Cabbage Dumplings + Winter Melon Soup + Stir-Fried Shredded Carrots, Meat: 50g minced pork | Vegetables: 2 cabbage leaves, 1 section of winter melon, 1/4 carrot | Staple: 10 dumpling skins, Mix the minced pork with chopped cabbage, a little sesame oil, and a pinch of salt to make the filling]","[\"猪肉荠菜馄饨+冬瓜汤+清炒卷心菜\",\"荤：猪肉末40g｜素：荠菜一小把、冬瓜1段、卷心菜2片｜主食：馄饨皮10张\",\"荠菜焯水挤干切碎，和肉末拌匀成馅，包小馄饨煮熟":"[Pork and Shepherd's Purse Wontons + Winter Melon Soup + Stir-Fried Cabbage, Meat: 40g minced pork | Vegetables: a small handful of shepherd's purse, 1 piece of winter melon, 2 cabbage leaves | Staple: 10 wonton wrappers, Blanch the shepherd's purse, squeeze out water and chop finely, mix with minced pork to make the filling, wrap into small wontons and cook until done]","[\"猪肉豆腐煲+清炒小白菜+软米饭\",\"荤：猪肉末40g｜素：嫩豆腐50g、小白菜2棵、香菇1朵｜主食：米饭50g\",\"肉末炒散，加香菇片和半碗水，下豆腐块小火焖8分钟，出锅淋一点水淀粉":"[\"Pork and Tofu Casserole + Stir-fried Bok Choy + Soft Rice\", \"Meat: Minced Pork 40g | Vegetarian: Tender Tofu 50g, 2 Baby Bok Cabbage, 1 Shiitake Mushroom | Main Dish: Rice 50g\", \"Stir-fry minced meat until separated, add shiitake slices and half a bowl of water, add tofu cubes and simmer on low heat for 8 minutes, then drizzle a little water starch slurry before serving","[\"猪肝枸杞叶汤+清炒油麦菜+软米饭\",\"荤：猪肝30g｜素：枸杞叶一小把、油麦菜2棵｜主食：米饭50g\",\"猪肝泡水去腥切薄片，水烧开焯1分钟":"[Pork Liver and Goji Leaf Soup + Stir-Fried Oil Lettuce + Soft Rice, Meat: 30g pork liver | Vegetables: a small handful of goji leaves, 2 stalks of oil lettuce | Staple: 50g rice, Soak pork liver in water to remove the odor, slice thinly, boil water and blanch for 1 minute]","[\"猪肝瘦肉粥+烫拌生菜+南瓜块\",\"荤：猪肝20g、瘦肉20g｜素：生菜2片、南瓜50g｜主食：大米40g\",\"大米熬粥":"[Pork liver and lean meat porridge + blanched lettuce + pumpkin pieces, Meat: 20g pork liver, 20g lean meat | Vegetables: 2 leaves of lettuce, 50g pumpkin | Staple: 40g rice, Rice cooked into porridge]","[\"猪肝菠菜面+清炒土豆丝\",\"荤：猪肝30g｜素：菠菜3棵、土豆半个｜主食：宝宝面条50g\",\"猪肝切薄片泡水30分钟去腥，沸水焯1分钟":"[\"Pork Liver and Spinach Noodles + Stir-fried Shredded Potatoes\", \"Meat: 30g pork liver | Vegetables: 3 spinach leaves, half a potato | Staple: 50g baby noodles\", \"Slice the pork liver thinly and soak in water for 30 minutes to remove the odor, then blanch in boiling water for 1 minute\"]","[\"玉米排骨粥+清炒莴笋+山药条\",\"荤：排骨2小块｜素：玉米粒30g、莴笋1段、山药50g｜主食：大米40g\",\"排骨焯水后加水小火炖40分钟，取排骨肉切碎":"[\"Corn and Pork Rib Porridge + Stir-fried Lettuce + Yam Strips\", \"Meat: 2 small pieces of pork ribs | Vegetarian: 30g corn kernels, 1 section of celtuce, 50g yam | Main food: 40g rice\", \"Blanch the ribs, add water, simmer over low heat for 40 minutes, then chop the pork rib meat","[\"番茄牛肉汤+清炒卷心菜+土豆饭\",\"荤：牛肉末40g｜素：番茄1个、土豆半个、卷心菜2片｜主食：大米50g\",\"番茄去皮切丁炒出汁，加开水烧开，下牛肉末搅散煮8分钟":"[Tomato Beef Soup + Stir-fried Cabbage + Potato Rice, Meat: 40g minced beef | Vegetables: 1 tomato, half a potato, 2 cabbage leaves | Staple: 50g rice, Peel and dice the tomato, stir-fry to release juice, add boiling water and bring to a boil, then add minced beef and stir to break up, cook for 8 minutes]","[\"番茄牛肉粥+清炒油麦菜+土豆泥\",\"荤：牛肉末30g｜素：番茄1个、油麦菜2棵、土豆半个｜主食：大米40g\",\"大米煮粥":"[Tomato Beef Congee + Stir-Fried Romaine Lettuce + Mashed Potato, Meat: 30g minced beef | Vegetables: 1 tomato, 2 heads of romaine lettuce, half a potato | Staple: 40g rice, Cook rice to make congee]","[\"番茄肉酱面+清炒小青菜\",\"荤：猪里脊肉末50g｜素：番茄1个、小青菜3棵｜主食：宝宝面条50g\",\"番茄划十字用开水烫后去皮切丁，热锅少油炒出沙":"[Tomato Meat Sauce Noodles + Stir-Fried Baby Bok Choy, Meat: 50g minced pork loin | Vegetables: 1 tomato, 3 baby bok choy | Staple: 50g baby noodles, Cut a cross on the tomato, scald with boiling water, peel and dice, stir-fry in a hot pan with a little oil until it becomes juicy]","[\"番茄菌菇鸡肉汤+蒸南瓜+软米饭\",\"荤：鸡胸肉30g｜素：番茄1个、香菇2朵、金针菇一小把、南瓜50g｜主食：米饭50g\",\"鸡胸肉切丁，番茄去皮切丁炒出汁加水烧开，下鸡肉丁、香菇片、金针菇段煮10分钟":"[Tomato Mushroom Chicken Soup + Steamed Pumpkin + Soft Rice, Meat: 30g Chicken Breast | Vegetables: 1 Tomato, 2 Shiitake Mushrooms, a small handful of Enoki Mushrooms, 50g Pumpkin | Staple: 50g Rice, Cut the chicken breast into cubes, peel and dice the tomato, stir-fry to release juice, add water and bring to a boil, then add chicken cubes, sliced shiitake mushrooms, and enoki mushroom segments and cook for 10 minutes]","[\"番茄蛋花汤面+清炒胡萝卜丝\",\"荤：鸡蛋1个｜素：番茄1个、胡萝卜半根｜主食：宝宝面条50g\",\"番茄去皮切丁炒出沙，加一碗开水烧开":"[Tomato and Egg Drop Noodle Soup + Stir-Fried Shredded Carrots, Meat: 1 egg｜Vegetables: 1 tomato, half a carrot｜Staple: 50g baby noodles, Peel the tomato and dice it, fry until it releases juice, then add a bowl of boiling water and bring to a boil]","[\"番茄鳕鱼豆腐+清炒西葫芦+软米饭\",\"荤：鳕鱼40g｜素：番茄1个、嫩豆腐40g、西葫芦1/4根｜主食：米饭50g\",\"番茄去皮切丁炒出汁，加半碗水烧开，下鳕鱼丁和豆腐块焖5分钟":"[Tomato Cod Tofu + Stir-Fried Zucchini + Soft Rice, Meat: Cod 40g | Vegetarian: Tomato 1, Silken Tofu 40g, Zucchini 1/4 | Staple: Rice 50g, Peel and dice the tomato, stir-fry to release juice, add half a bowl of water and bring to a boil, then add cod cubes and tofu cubes and simmer for 5 minutes]","[\"紫菜蛋花汤+肉末豆腐+软米饭\",\"荤：猪肉末30g、鸡蛋1个｜素：紫菜少许、嫩豆腐50g、小青菜2棵｜主食：米饭50g\",\"肉末炒散，加豆腐块和半碗水焖5分钟":"[Seaweed and Egg Drop Soup + Minced Meat Tofu + Soft Rice, Meat: 30g minced pork, 1 egg | Vegetables: a little seaweed, 50g soft tofu, 2 small bok choy | Staple: 50g rice, Stir-fry the minced meat until crumbly, then add tofu cubes and half a bowl of water and simmer for 5 minutes]","[\"肉末四季豆焖面+白灼西兰花\",\"荤：猪肉末40g｜素：四季豆6根、西兰花3朵、胡萝卜1/4根｜主食：宝宝面条50g\",\"四季豆撕筋切碎，焯水5分钟（四季豆必须彻底煮熟）":"[\"Minced Meat and Green Beans Braised Noodles + Poached Broccoli\", \"Meat: Minced Pork 40g | Vegetarian: 6 green beans, 3 broccoli flowers, 1/4 carrot | Main food: Baby noodles 50g\", \"Green beans, shredded and minced, blanched for 5 minutes (green beans must be thoroughly cooked)\"","[\"肉末茄子面+烫拌菠菜\",\"荤：猪肉末40g｜素：茄子半根、菠菜3棵｜主食：宝宝面条50g\",\"茄子去皮切丁，用盐水泡10分钟挤干":"[\"Minced Meat Eggplant Noodles + Blanched Spinach\", \"Meat: Minced pork 40g | Vegetarian: half an eggplant, 3 spinach stalks | Staple: Baby noodles 50g\", \"Peel and dice eggplant, soak in salt water for 10 minutes and squeeze dry","[\"肉末蒸蛋+清炒小青菜+南瓜块\",\"荤：猪肉末20g、鸡蛋1个｜素：小青菜3棵、南瓜50g｜主食：米饭50g\",\"鸡蛋打散加1.5倍温水，肉末铺底，盖保鲜膜蒸10分钟":"[Steamed Egg with Minced Meat + Stir-fried Baby Bok Choy + Pumpkin Chunks, Meat: 20g minced pork, Egg: 1 | Vegetables: 3 baby bok choy, 50g pumpkin | Staple: 50g rice, Beat the egg and add 1.5 times warm water, spread minced meat at the bottom, cover with plastic wrap and steam for 10 minutes]","[\"肉末蔬菜饼+小米粥+清炒豆芽\",\"荤：猪肉末40g｜素：西葫芦1/4根、胡萝卜1/4根、豆芽一小把｜主食：面粉30g、小米30g\",\"肉末加擦细的西葫芦丝胡萝卜丝和面粉拌成糊，小火煎成小饼":"[Minced Meat and Vegetable Pancakes + Millet Porridge + Stir-Fried Bean Sprouts, Meat: 40g minced pork | Vegetables: 1/4 zucchini, 1/4 carrot, a small handful of bean sprouts | Staple: 30g flour, 30g millet, Mix the minced meat with finely grated zucchini and carrot, and flour to form a batter, then pan-fry over low heat into small pancakes]","[\"胡萝卜牛肉焖饭+白灼西兰花+玉米粒\",\"荤：牛肉末40g｜素：胡萝卜半根、西兰花3朵、甜玉米粒30g｜主食：大米50g\",\"牛肉末加少许淀粉拌匀":"[Carrot and Beef Steamed Rice + Blanched Broccoli + Corn Kernels, Meat: 40g minced beef | Vegetables: half a carrot, 3 broccoli florets, 30g sweet corn kernels | Staple: 50g rice, Mix the minced beef with a little starch]","[\"蒸肉饼+白灼生菜+冬瓜汤+软米饭\",\"荤：猪肉末50g｜素：生菜2片、冬瓜1段｜主食：米饭50g\",\"肉末加少许蛋清和淀粉，铺平蒸12分钟成肉饼":"[Steamed minced meat patty + blanched lettuce + winter melon soup + soft rice, Meat: 50g minced pork | Vegetable: 2 lettuce leaves, 1 section of winter melon | Staple: 50g rice, Mix minced pork with a little egg white and starch, spread flat and steam for 12 minutes to make a meat patty]","[\"虾仁冬瓜汤+蒜蓉菠菜+软米饭\",\"荤：虾仁30g｜素：冬瓜1段、菠菜3棵｜主食：米饭50g\",\"虾仁去虾线用姜腌10分钟，冬瓜切薄片，水烧开同煮8分钟":"[Shrimp and Winter Melon Soup + Garlic Spinach + Soft Rice, Meat: 30g shrimp | Vegetables: 1 section of winter melon, 3 spinach leaves | Staple: 50g rice, Devein shrimp and marinate with ginger for 10 minutes, slice winter melon thinly, boil water and cook together for 8 minutes]","[\"虾仁时蔬面+清炒西葫芦\",\"荤：鲜虾仁30g｜素：胡萝卜1/4根、娃娃菜2片｜主食：宝宝面 "Cut the potatoes into thin strips and soak in water to remove the starch, then quickly stir-fry in hot oil until soft.","土豆半个、甜玉米粒30g、小青菜3棵":"Half a potato, 30g of sweet corn kernels, 3 small bok choy","土豆去皮蒸熟压泥":"Peel the potatoes, steam until cooked, and mash them","土豆泥":"Mashed potatoes","土豆泥\",\"鳕鱼抹少许柠檬汁，铺姜片蒸8分钟，取出去皮去刺。土豆蒸熟压泥拌配方奶。菠菜焯水切碎。鳕鱼鲜嫩补DHA，配菠菜泥土豆泥\",4],\n[\"蒸肉饼+白灼生菜+冬瓜汤+软米饭\",\"荤：猪肉末50g":"Mashed potatoes, cod fish with a little lemon juice, steamed with ginger slices for 8 minutes, then peeled and deboned. Steam the potatoes until cooked, mash and mix with formula milk. Blanch and chop the spinach. Cod is tender and rich in DHA, served with spinach puree and mashed potatoes.\n\nSteamed meat patty + boiled lettuce + winter melon soup + soft rice. Meat: 50g minced pork","土豆蒸熟压泥":"Steam the potatoes until cooked and then mash them","土豆蒸熟压泥拌配方奶":"Steam the potatoes, mash them, and mix with formula milk","大米40g":"40g of rice","大米40g\",\"大米煮粥。牛肉末加蛋液搅匀，粥快好时淋入滑散煮3分钟。西葫芦切片快炒。南瓜蒸软切块。牛肉滑蛋粥嫩滑补铁，配西葫芦南瓜\",4],\n[\"鸡蛋丝瓜面+清炒胡萝卜+拌豆腐\",\"荤：鸡蛋1个":"40g of rice. Cook the rice into porridge. Mix minced beef with beaten egg, then drizzle it into the porridge when it is almost done and cook for 3 minutes. Slice the zucchini and stir-fry quickly. Steam the pumpkin until soft and cut into pieces. Beef and egg porridge is tender and iron-rich, served with zucchini and pumpkin.\nEgg and loofah noodles + lightly stir-fried carrots + mixed tofu\nMeat: 1 egg","大米40g\",\"大米煮粥。番茄去皮切丁炒出汁，下牛肉末炒散，倒入粥里煮5分钟。土豆蒸熟压泥。油麦菜焯水切碎拌少许油。牛肉粥配土豆泥和油麦菜\",4],\n[\"猪肝瘦肉粥+烫拌生菜+南瓜块\",\"荤：猪肝20g、瘦肉20g":"40g of rice, cook the rice into porridge. Peel and dice the tomato, sauté until juicy, then add minced beef and cook until separated, pour into the porridge and cook for 5 minutes. Steam the potato and mash it. Blanch the romaine lettuce, chop, and mix with a little oil. Serve the beef porridge with mashed potato and romaine lettuce.\n\nPork liver and lean meat porridge + blanched lettuce salad + pumpkin chunks.\nMeat: 20g pork liver, 20g lean meat","大米40g\",\"大米煮粥。虾仁去虾线切丁，豆腐切小丁，粥快好时下锅煮4分钟。芦笋去老皮切段焯水，热油快炒。红薯切条蒸软。虾仁豆腐粥配芦笋和红薯条\",4],\n[\"南瓜鸡肉焖饭+清炒小青菜+番茄块\",\"荤：鸡腿肉40g":"40g of rice, cook the rice into porridge. Devein the shrimp and dice it, cut the tofu into small cubes, add them to the porridge and cook for 4 minutes when the porridge is almost done. Peel the tough parts of the asparagus, cut into sections, blanch and stir-fry quickly in hot oil. Cut the sweet potato into strips and steam until soft. Serve the shrimp and tofu porridge with asparagus and sweet potato strips.\n\nPumpkin Chicken Steamed Rice + Stir-fried Baby Bok Choy + Tomato Chunks, Meat: 40g of chicken thigh","大米40g\",\"大米煮粥。鳕鱼去皮去刺蒸熟压碎，粥快好时拌入。西兰花焯水切碎同煮2分钟。口蘑切片热油炒2分钟。胡萝卜条蒸软。鱼粥滴柠檬汁提鲜，配口蘑和胡萝卜\",4],\n[\"虾仁豆腐粥+清炒芦笋+红薯条\",\"荤：虾仁30g、嫩豆腐30g":"40g rice\", \"cook rice into porridge.\" Remove the cod, remove skin and bones, steam until cooked and crushed, then add when the porridge is ready. Blanch broccoli, chop finely, and cook together for 2 minutes. Slice button mushrooms and stir-fry in hot oil for 2 minutes. Steam carrot strips until soft. Add lemon juice to fish porridge for extra flavor, served with button mushrooms and carrot\",4], \n[\"Shrimp and tofu porridge + stir-fried asparagus + sweet potato fries\",\"Meat: 30g shrimp, 30g soft tofu","大米40g\",\"大米煮粥，鳕鱼蒸熟去刺压碎拌入，最后拌入焯水切碎的小青菜。土豆切丝泡水快炒。番茄去皮切块。鳕鱼菜粥补DHA，配土豆丝番茄\",4],\n[\"肉末四季豆焖面+白灼西兰花\",\"荤：猪肉末40g":"40g of rice. Cook the rice into porridge, steam the codfish, remove the bones, mash it, and mix it in. Finally, mix in the boiled and chopped small greens. Cut the potato into thin strips, soak in water, and stir-fry quickly. Peel and cut the tomato into pieces. Cod and vegetable porridge provides DHA, served with shredded potatoes and tomato.\n\nMinced meat and green bean braised noodles + blanched broccoli. Meat: 40g of minced pork.","大米40g\",\"大米熬成软粥。鸡肉切末、香菇切碎，粥快好时下锅再煮5分钟。西兰花焯水2分钟。胡萝卜切条蒸软。粥滴2滴核桃油，配西兰花和胡萝卜条\",4],\n[\"番茄牛肉粥+清炒油麦菜+土豆泥\",\"荤：牛肉末30g":"40g of rice, cook the rice into a soft porridge. Mince the chicken and chop the mushrooms finely. When the porridge is almost done, add them to the pot and cook for another 5 minutes. Blanch the broccoli for 2 minutes. Cut the carrots into strips and steam until soft. Add 2 drops of walnut oil to the porridge, and serve with the broccoli and carrot strips.\n\nTomato and beef porridge + stir-fried romaine lettuce + mashed potatoes.\nMeat: 30g minced beef.","大米40g\",\"大米熬粥。猪肝泡水去腥焯水切碎，瘦肉切末，粥快好时下锅煮5分钟。南瓜蒸软切块。生菜焯水10秒切丝拌核桃油。补铁粥配南瓜和生菜\",4],\n[\"鳕鱼西兰花粥+清炒口蘑+胡萝卜条\",\"荤：鳕鱼40g":"40g of rice\nCook rice into porridge. Soak pig liver in water to remove the smell, blanch, and chop finely; mince the lean meat. When the porridge is almost done, add them and cook for 5 minutes. Steam the pumpkin until soft and cut into pieces. Blanch lettuce for 10 seconds, cut into shreds and mix with walnut oil. Iron-rich porridge served with pumpkin and lettuce.\n\nCod and broccoli porridge + stir-fried mushrooms + carrot sticks\nMeat: 40g of cod","大米40g\",\"排骨焯水后加水小火炖40分钟，取排骨肉切碎。大米和玉米粒入排骨汤熬粥，快好时下排骨肉。莴笋去皮切条焯水快炒。山药蒸软切条。排骨粥香浓，配莴笋山药\",4],\n[\"猪肉白菜饺+冬瓜汤+清炒胡萝卜丝\",\"荤：猪肉末50g":"40g of rice. After blanching the pork ribs, add water and simmer on low heat for 40 minutes, then remove the ribs and chop the meat finely. Cook the rice and corn kernels in the rib broth to make porridge, and add the chopped rib meat when it's almost done. Peel and cut the celtuce into strips, blanch, and stir-fry briefly. Steam the yam until soft and cut into strips. The rib porridge is rich in flavor, served with celtuce and yam.\n\nPork and cabbage dumplings + winter melon soup + stir-fried carrot shreds. Meat: 50g of minced pork.","大米40g+小米20g":"40g of rice + 20g of millet","大米40g+小米20g\",\"肉末加少许蛋清淀粉搅上劲，搓小丸子。水烧开下丸子煮至浮起，下冬瓜片再煮8分钟。油麦菜焯水，蒜末炝锅快炒。小米大米同焖饭。肉丸汤清爽不腻\",4],\n[\"鸡蓉玉米羹+清炒茼蒿+软米饭\",\"荤：鸡胸肉30g、鸡蛋1个":"40g rice + 20g millet. Mix minced meat with a little egg white and starch until elastic, then roll into small meatballs. Boil water and cook the meatballs until they float, then add winter melon slices and cook for another 8 minutes. Blanch romaine, stir-fry quickly with minced garlic. Cook millet and rice together. The meatball soup is light and non-greasy.\n\nChicken corn soup + stir-fried crown daisy + soft rice. Meat: 30g chicken breast, 1 egg.","大米50g":"50g of rice","大米50g\",\"三文鱼切丁，鸡蛋打散加温水，鱼丁铺碗底淋蛋液蒸12分钟。豌豆苗快炒1分钟。大米加少许燕麦米同焖饭。三文鱼蒸蛋补DHA，配豌豆苗\",4],\n[\"排骨莲藕汤+清炒西兰花+软米饭\",\"荤：排骨2小块":"50g of rice, salmon diced, egg beaten and mixed with warm water, lay the diced fish at the bottom of the bowl, pour the egg mixture over and steam for 12 minutes. Stir-fry pea shoots quickly for 1 minute. Cook the rice with a little oatmeal together. Steamed egg with salmon provides DHA, served with pea shoots.","大米50g\",\"土豆去皮蒸熟压泥。肉末炒香加少许水和土豆泥炒成浇头。大米煮软饭。菠菜焯水切碎拌核桃油。黄瓜去皮切条。肉末土豆泥浇在米饭上拌匀，配菠菜黄瓜\",4],\n[\"玉米排骨粥+清炒莴笋+山药条\",\"荤：排骨2小块":"50g of rice, peel the potato, steam until cooked, and mash it. Stir-fry the minced meat until fragrant, then add a little water and the mashed potato, stir-frying into a topping. Cook the rice until soft. Blanch the spinach, chop it, and mix with walnut oil. Peel the cucumber and cut into strips. Pour the minced meat and mashed potato topping over the rice and mix evenly, served with spinach and cucumber.\n\nCorn and pork rib congee + stir-fried lettuce stem + yam strips\nMeat: 2 small pieces of pork ribs","大米50g\",\"山药去皮蒸熟压泥，与肉末拌匀搓小丸，蒸12分钟。胡萝卜擦丝炒软。菠菜焯水切碎拌入焖好的米饭里。山药肉丸易消化，配胡萝卜和菠菜饭\",3],\n[\"三文鱼蒸蛋+清炒豌豆苗+杂粮饭\",\"荤：三文鱼30g、鸡蛋1个":"50g of rice. Peel and steam the yam, mash it, mix with minced meat and roll into small balls, steam for 12 minutes. Grate the carrot and stir-fry until soft. Blanch and chop the spinach, then mix it into the cooked rice. Yam meatballs are easy to digest, served with carrot and spinach rice.\n\nSteamed salmon egg + stir-fried pea shoots + multigrain rice. Protein: 30g of salmon, 1 egg.","大米50g\",\"牛肉末加少许淀粉拌匀。大米淘净，铺上牛肉末、胡萝卜丁和玉米粒，加水焖成软饭。西兰花焯水2分钟。牛肉焖饭补铁，配白灼西兰花\",4],\n[\"豌豆虾仁焖饭+清炒娃娃菜+土豆条\",\"荤：虾仁30g":"50g of rice, mix minced beef with a little starch. Rinse the rice, then place the minced beef, diced carrots, and corn on top, and cook with water until soft. Blanch broccoli for 2 minutes. Beef steamed rice supplements iron, served with lightly boiled broccoli.\n\nPea and shrimp steamed rice + stir-fried baby cabbage + potato strips, Meat: 30g of shrimp","大米50g\",\"番茄去皮切丁炒出汁，加开水烧开，下牛肉末搅散煮8分钟。土豆切小丁与大米同焖饭。卷心菜切丝快炒。酸甜番茄牛肉汤开胃补铁\",4],\n[\"虾仁冬瓜汤+蒜蓉菠菜+软米饭\",\"荤：虾仁30g":"50g of rice, peel and dice the tomato and fry until juice is released, add boiling water and bring to a boil, then add minced beef and stir to break up, cook for 8 minutes. Dice the potato and cook together with the rice. Shred the cabbage and stir-fry quickly. Sweet and sour tomato beef soup is appetizing and iron-rich.\n\nShrimp and winter melon soup + garlic spinach + soft rice\nMeat: 30g of shrimp","大米50g\",\"虾仁切丁用姜腌10分钟。大米淘净，加豌豆粒、虾仁丁和水焖成软饭。娃娃菜切丝炒软。土豆切条蒸软。豌豆虾仁焖饭配娃娃菜和土豆条\",4],\n[\"土豆肉末拌饭+清炒菠菜+黄瓜条\",\"荤：猪肉末40g":"50g of rice. Dice the shrimp and marinate with ginger for 10 minutes. Rinse the rice, then cook it with peas, diced shrimp, and water until soft. Shred the baby cabbage and stir-fry until soft. Cut the potato into strips and steam until soft. Pea and shrimp rice served with baby cabbage and potato strips.\n\nMinced pork mixed rice + stir-fried spinach + cucumber strips. Meat: 40g of minced pork.","大米50g\",\"虾仁切丁，豆腐切小块，蛋黄打散。水烧开下豆腐虾仁煮3分钟，淋蛋液搅成羹。南瓜切丁与大米同焖成饭。小白菜快炒。豆腐羹补钙，配南瓜饭和青菜\",4],\n[\"番茄鳕鱼豆腐+清炒西葫芦+软米饭\",\"荤：鳕鱼40g":"50g rice\", \"dice shrimp, cut tofu into small pieces, beat egg yolks. Boil water, add tofu and shrimp, cook for 3 minutes, drizzle with egg mixture and stir into a soup. Dice pumpkin and braise together with rice to make rice. Stir-fry bok choy quickly. Tofu soup supplements calcium, paired with pumpkin rice and greens\",4], \n[\"Tomato cod tofu + stir-fried zucchini + soft rice\", \"Meat: cod 40g","大米50g\",\"鸡腿肉去骨切丁，南瓜去皮切丁。大米淘净，与鸡肉丁南瓜丁一起加水焖成软饭。小青菜快炒1分钟。番茄去皮切块。焖饭鲜甜，配菜清爽\",4],\n[\"胡萝卜牛肉焖饭+白灼西兰花+玉米粒\",\"荤：牛肉末40g":"50g of rice. Debone the chicken leg and cut into cubes, peel the pumpkin and cut into cubes. Rinse the rice, then cook it with the chicken and pumpkin cubes in water until soft. Quickly stir-fry the baby bok choy for 1 minute. Peel and cut the tomato into pieces. The stewed rice is fresh and sweet, and the side vegetables are refreshing.\n\nCarrot and beef stewed rice + lightly boiled broccoli + corn kernels\nMeat: 40g minced beef","大米加少许燕麦米同焖饭":"Cook rice together with a small amount of oat groats","大米和玉米粒入排骨汤熬粥，快好时下排骨肉":"Cook rice and corn kernels in pork rib soup to make porridge, and add the pork ribs when it's almost done.","大米淘净，与鸡肉丁南瓜丁一起加水焖成软饭":"Rinse the rice clean, and cook it with diced chicken and diced pumpkin in water until it becomes soft rice.","大米淘净，加豌豆粒、虾仁丁和水焖成软饭":"Rinse the rice, then add peas, diced shrimp, and water, and cook into soft rice.","大米淘净，铺上牛肉末、胡萝卜丁和玉米粒，加水焖成软饭":"Rinse the rice clean, spread ground beef, diced carrots, and corn on top, add water, and simmer into soft rice.","大米煮粥":"Rice cooked into porridge","大米煮粥，鳕鱼蒸熟去刺压碎拌入，最后拌入焯水切碎的小青菜":"Cook the rice into porridge, steam the cod and remove the bones, then mash it and mix in, finally mix in the blanched and chopped small greens.","大米煮软饭":"Cook the rice until soft","大米熬成软粥":"Cook rice into soft porridge","大米熬粥":"Cook rice porridge","娃娃菜切丝同煮":"Shred the baby cabbage and cook together","娃娃菜切丝炒软":"Shred the baby cabbage and stir-fry until soft","嫩豆腐50g、小油菜3棵":"50g soft tofu, 3 small bok choy","嫩豆腐50g、小白菜2棵、南瓜50g":"50g soft tofu, 2 bok choy, 50g pumpkin","嫩豆腐50g、小白菜2棵、香菇1朵":"50g soft tofu, 2 baby bok choy, 1 shiitake mushroom","它吃了一条鱼":"It ate a fish","它跟着妈妈":"It follows mom","完整链接形如：":"The complete link looks like:","完整链接形如：<br><b style=\"word-break:break-all;\">https://www.xiaohongshu.com/...<\/b><\/p>`);":"The full link looks like: <br><b style=\"word-break:break-all;\">https://www.xiaohongshu.com/...<\/b><\/p>`);","宝宝洗澡啦":"The baby is taking a bath.","宝宝面条50g":"Baby noodles 50g","宝宝面条50g\",\"丝瓜去皮切薄片炒软，加水烧开，下面条，淋入蛋液成蛋花。胡萝卜擦丝炒软。豆腐焯水切块淋少许香油。丝瓜面清润，配胡萝卜和豆腐\",3],\n[\"猪肉豆腐煲+清炒小白菜+软米饭\",\"荤：猪肉末40g":"Baby noodles 50g, peel and thinly slice the sponge gourd, stir-fry until soft, add water and bring to a boil, then add the noodles, and drizzle in beaten egg to make egg ribbons. Grate the carrot and stir-fry until soft. Blanch the tofu, cut into pieces, and drizzle with a little sesame oil. The sponge gourd noodles are light and smooth, served with carrot and tofu.","宝宝面条50g\",\"南瓜去皮蒸熟压成泥。鸡腿肉去骨切丁炒白，加开水烧开下南瓜泥搅匀。下面条煮软。小青菜整棵焯水30秒。浓汤面配小青菜，汤浓味甜\",4],\n[\"山药肉末面+清炒豆芽\",\"荤：猪肉末30g":"Baby noodles 50g, pumpkin peeled, steamed, and mashed. Debone chicken thigh and cut into small pieces, stir-fry until white, then add boiling water and bring to a boil, then add the pumpkin puree and mix well. Boil the noodles until soft. Blanche whole baby bok choy for 30 seconds. Serve the rich soup noodles with baby bok choy; the soup is thick and sweet.\n\nYam and minced meat noodles + stir-fried bean sprouts. Meat: 30g minced pork.","宝宝面条50g\",\"四季豆撕筋切碎，焯水5分钟（四季豆必须彻底煮熟）。肉末炒散，加四季豆、胡萝卜丁和半碗水，铺面条加盖焖5分钟拌匀。西兰花焯水。焖面入味，配白灼西兰花\",4],\n[\"虾仁西葫芦煎饼+南瓜小米粥+清炒卷心菜\",\"荤：虾仁30g":"Baby noodles 50g. Trim and chop green beans, blanch for 5 minutes (green beans must be fully cooked). Stir-fry minced meat until broken up, add green beans, diced carrots, and half a bowl of water, spread over noodles, cover and simmer for 5 minutes and mix evenly. Blanch broccoli. The braised noodles absorb the flavor, served with boiled broccoli.\n\nShrimp and zucchini pancake + pumpkin millet porridge + stir-fried cabbage. Meat: shrimp 30g","宝宝面条50g\",\"山药去皮切小段蒸软压泥。肉末炒散加开水，下山药泥搅匀煮开，下面条。豆芽掐尾洗净，热油快炒1分钟。山药肉末面配炒豆芽\",3],\n[\"香菇鸡肉粥+清炒西兰花+胡萝卜条\",\"荤：鸡胸肉30g":"50g baby noodles\", \"Peel and cut yam into small pieces, steam until soft and mash.\" Stir-fry minced meat and add boiling water, add the yam puree, stir well and bring to a boil, then add the noodles. Pinch the ends of the bean sprouts and wash them, then quickly stir-fry in hot oil for 1 minute. Yam and minced pork noodles with stir-fried bean sprouts\",3], \n[\"Mushroom chicken congee + stir-fried broccoli + carrot sticks\", \"Meat: 30g chicken breast","宝宝面条50g\",\"猪肝切薄片泡水30分钟去腥，沸水焯1分钟。另起锅煮面，快熟时下猪肝片和菠菜段再煮2分钟。土豆切细丝泡水去淀粉，热油快炒至软。猪肝面滴1滴宝宝酱油，配土豆丝\",4],\n[\"鳕鱼时蔬面+拌黄瓜条\",\"荤：鳕鱼40g":"Baby noodles 50g. Slice the pork liver thinly and soak in water for 30 minutes to remove the odor, then blanch in boiling water for 1 minute. In another pot, cook the noodles; when almost done, add the pork liver slices and spinach segments and cook for another 2 minutes. Cut the potato into thin strips and soak in water to remove the starch, then stir-fry quickly in hot oil until soft. For the pork liver noodles, add a drop of baby soy sauce and serve with the potato strips.\n\nCod and vegetable noodles + dressed cucumber sticks. Meat: cod 40g","宝宝面条50g\",\"番茄划十字用开水烫后去皮切丁，热锅少油炒出沙。下肉末炒散至变色，加半碗开水小火焖8分钟收成酱。面条煮软捞出过一遍温水。小青菜洗净沸水焯15秒，热锅少油快炒1分钟。面条浇上肉酱，配小青菜，滴2滴核桃油\",4],\n[\"香菇鸡肉面+蒜蓉西兰花\",\"荤：鸡胸肉30g":"Baby noodles 50g. Score the tomato and blanch in boiling water, then peel and dice. Stir-fry in a hot pan with a little oil until sandy. Add minced meat and stir until it changes color, then add half a bowl of boiling water, simmer on low heat for 8 minutes to make the sauce. Cook the noodles until soft, then rinse once in warm water. Wash the baby bok choy and blanch in boiling water for 15 seconds, then stir-fry quickly in a hot pan with a little oil for 1 minute. Pour the meat sauce over the noodles, serve with baby bok choy, and add 2 drops of walnut oil.\n\nMushroom chicken noodles + garlic broccoli. Meat: chicken breast 30g.","宝宝面条50g\",\"番茄去皮切丁炒出沙，加一碗开水烧开。淋入打散的蛋液做成蛋花。下面条煮软。胡萝卜切细丝，热油小火煸炒2分钟至软。面汤盛碗撒葱花，配胡萝卜丝\",4],\n[\"猪肝菠菜面+清炒土豆丝\",\"荤：猪肝30g":"Baby noodles 50g. Peel the tomato, dice it, and fry until it releases juice, then add a bowl of boiling water and bring to a boil. Pour in the beaten egg to make egg flower. Cook the noodles until soft. Cut the carrot into fine strips and sauté in hot oil over low heat for 2 minutes until soft. Serve the noodle soup in a bowl, sprinkle with chopped green onions, and serve with carrot strips.\n\nPork liver spinach noodles + stir-fried shredded potatoes. Meat: 30g pork liver","宝宝面条50g\",\"茄子去皮切丁，用盐水泡10分钟挤干。热油下肉末炒散，加茄子丁炒软，加半碗水焖5分钟成浇头。面条煮熟。菠菜焯水20秒，切碎拌少许核桃油。面浇肉末茄子，配菠菜\",4],\n[\"三鲜菌菇面+清炒荷兰豆\",\"荤：鲜虾仁20g、肉末20g":"Baby noodles 50g, peel and dice the eggplant, soak in salt water for 10 minutes and squeeze dry. Heat oil and stir-fry the minced meat until loose, add the diced eggplant and fry until soft, add half a bowl of water and simmer for 5 minutes to make the topping. Cook the noodles. Blanch the spinach for 20 seconds, chop and mix with a little walnut oil. Pour the minced meat and eggplant topping over the noodles, served with spinach.\n\nThree delicacies mushroom noodles + stir-fried Dutch beans, Meat: fresh shrimp 20g, minced meat 20g.","宝宝面条50g\",\"虾仁切丁、香菇切片，热油下肉末和虾仁炒香，加香菇和开水煮成汤底。下面条煮软。荷兰豆撕筋焯水1分钟，热油快炒。三鲜面配炒荷兰豆\",4],\n[\"南瓜鸡肉浓汤面+白灼小青菜\",\"荤：鸡腿肉30g":"Baby noodles 50g, shrimp diced, shiitake mushrooms sliced. Heat oil and stir-fry minced meat and shrimp until fragrant, add mushrooms and boiling water to make the soup base. Boil the noodles until soft. Trim and blanch snow peas for 1 minute, then stir-fry quickly in hot oil. Serve the three-delicacy noodles with stir-fried snow peas.\n\nPumpkin chicken thick soup noodles + lightly boiled baby bok choy\nMeat: Chicken thigh 30g","宝宝面条50g\",\"虾仁去虾线切丁，用姜片腌10分钟去腥。胡萝卜切碎和面同煮，快熟时下虾仁丁和娃娃菜丝。西葫芦切片，热油炒2分钟。虾仁面滴几滴核桃油，配炒西葫芦\",4],\n[\"肉末茄子面+烫拌菠菜\",\"荤：猪肉末40g":"Baby noodles 50g. Devein the shrimp and dice it, then marinate with ginger slices for 10 minutes to remove the fishy smell. Finely chop the carrot and cook it together with the noodles; when almost done, add the diced shrimp and shredded baby cabbage. Slice the zucchini and stir-fry in hot oil for 2 minutes. Drizzle a few drops of walnut oil on the shrimp noodles and serve with the stir-fried zucchini.","宝宝面条50g\",\"鳕鱼去皮去刺切丁，滴几滴柠檬汁去腥。番茄切丁炒出汁加水烧开，下鳕鱼丁和面条煮软。娃娃菜切丝同煮。黄瓜去皮切条。面盛碗配黄瓜条\",4],\n[\"虾仁时蔬面+清炒西葫芦\",\"荤：鲜虾仁30g":"Baby noodles 50g, cod fillet deboned and skinned, cut into cubes, drizzle a few drops of lemon juice to remove the fishy smell. Dice the tomato and sauté until it releases juice, add water and bring to a boil, then add cod cubes and noodles and cook until soft. Shred baby bok choy and cook together. Peel cucumber and cut into sticks. Serve noodles in a bowl with cucumber sticks.\n\nShrimp and vegetable noodles + stir-fried zucchini, Meat: fresh shrimp 30g","宝宝面条50g\",\"鸡胸肉切小丁，用少许淀粉抓匀。香菇泡软切片，热油下鸡肉丁炒白，加香菇和两碗开水煮开。下面条煮软。西兰花掰小朵焯水2分钟，蒜末炝锅翻炒1分钟。面条连汤装碗，配蒜蓉西兰花\",4],\n[\"番茄蛋花汤面+清炒胡萝卜丝\",\"荤：鸡蛋1个":"Baby noodles 50g, chicken breast cut into small cubes, lightly coated with a little starch. Soak shiitake mushrooms until soft and slice them. Heat oil and stir-fry the chicken cubes until white, add the mushrooms and two bowls of boiling water, bring to a boil. Cook the noodles until soft. Break broccoli into small florets and blanch for 2 minutes. Stir-fry minced garlic in a hot pan for 1 minute. Serve the noodles with the soup in a bowl, accompanied by garlic broccoli.\n\nTomato and egg drop soup noodles + stir-fried carrot shreds\nProtein: 1 egg","小宝宝想出去玩":"The little baby wants to go out and play","小油菜快炒":"Quick-fried baby bok choy","小白菜快炒":"Quick-fried bok choy","小米大米同焖饭":"Millet and Rice Cooked Together","小米熬成粥":"Millet cooked into porridge","小米熬粥":"Millet porridge","小青菜3棵、南瓜50g":"3 baby bok choy, 50g pumpkin","小青菜3棵、土豆半个、番茄半个":"3 small bok choy, half a potato, half a tomato","小青菜快炒":"Stir-fried Baby Bok Choy","小青菜快炒1分钟":"Stir-fry the baby bok choy quickly for 1 minute","小青菜整棵焯水30秒":"Blanch the whole bok choy for 30 seconds","小青菜洗净沸水焯15秒，热锅少油快炒1分钟":"Wash the baby bok choy and blanch in boiling water for 15 seconds, then stir-fry quickly in a hot pan with a little oil for 1 minute","小馄饨配冬瓜汤和炒卷心菜":"Small wontons with winter melon sh into a soup using the back of a spoon.","玉米鸡蓉羹香滑，配茼蒿":"The corn and chicken puree soup is smooth and fragrant, served with tonghao (edible chrysanthemum greens)","玉米鸡蓉羹香滑，配茼蒿\",4],":"Corn and chicken puree soup is smooth and fragrant, served with garland chrysanthemum","现在猫猫吃饱了":"The cat is full now","球又大又圆":"The ball is big and round","瑶柱汤鲜美补锌，瑶柱含盐泡发后要冲洗干净":"Scallop soup is delicious and rich in zinc; after soaking the scallops in salted water, they need to be rinsed thoroughly.","瑶柱汤鲜美补锌，瑶柱含盐泡发后要冲洗干净\",4],":"Scallop soup is delicious and rich in zinc; after soaking the scallops in salted water, they need to be rinsed thoroughly.","瑶柱泡软撕碎，与冬瓜片同煮15分钟":"Soak the dried scallops until soft and shred them, then cook together with winter melon slices for 15 minutes","甜玉米粒40g、茼蒿2棵":"40g sweet corn kernels, 2 stems of garland chrysanthemum","生菜1片、胡萝卜1/4根、豆芽一小把、黄瓜1/4根":"1 leaf of lettuce, 1/4 carrot, a small handful of bean sprouts, 1/4 cucumber","生菜2片、冬瓜1段":"2 pieces of lettuce, 1 section of wax gourd","生菜2片、南瓜50g":"2 pieces of lettuce, 50g of pumpkin","生菜整片焯水20秒":"Blanch the whole lettuce leaf in boiling water for 20 seconds","生菜焯水10秒切丝拌核桃油":"Blanch the lettuce for 10 seconds, shred it, and mix with walnut oil","用你的小勺子":"Use your little spoon","番茄1个、土豆半个、卷心菜2片":"1 tomato, half a potato, 2 pieces of cabbage","番茄1个、土豆半个、洋葱1/8个、卷心菜2片":"1 tomato, half a potato, 1/8 of an onion, 2 pieces of cabbage","番茄1个、嫩豆腐40g、西葫芦1/4根":"1 tomato, 40g soft tofu, 1/4 zucchini","番茄1个、小青菜3棵":"1 tomato, 3 baby bok choy","番茄1个、油麦菜2棵、土豆半个":"1 tomato, 2 stems of romaine lettuce, half a potato","番茄1个、胡萝卜半根":"1 tomato, half a carrot","番茄1个、香菇2朵、金针菇一小把、南瓜50g":"1 tomato, 2 shiitake mushrooms, a small handful of enoki mushrooms, 50g of pumpkin","番茄切丁炒出汁加水烧开，下鳕鱼丁和面条煮软":"Dice the tomatoes and stir-fry to release the juice, add water and bring to a boil, then add the cod cubes and noodles and cook until soft.","番茄划十字用开水烫后去皮切丁，热锅少油炒出沙":"Score a cross on the tomato, scald it with boiling water, peel it, and dice it. Stir-fry in a hot pan with a little oil until it becomes grainy.","番茄半个、娃娃菜2片":"Half a tomato, 2 pieces of baby cabbage","番茄去皮切丁炒出汁，下牛肉末炒散，倒入粥里煮5分钟":"Peel and dice the tomatoes and sauté until they release their juice, then stir-fry the minced beef until it crumbles, and pour into the porridge to cook for 5 minutes.","番茄去皮切丁炒出汁，加半碗水烧开，下鳕鱼丁和豆腐块焖5分钟":"Peel and dice the tomatoes, fry them until they release juice, add half a bowl of water and bring to a boil, then add cod cubes and tofu chunks and simmer for 5 minutes.","番茄去皮切丁炒出汁，加开水、土豆丁、洋葱碎煮15分钟，下牛肉末搅散再煮8分钟，最后下卷心菜丝煮3分钟":"Peel and dice the tomatoes and sauté them to release the juice, add boiling water, diced potatoes, and chopped onions and cook for 15 minutes, then add the minced beef and stir to break it up and cook for another 8 minutes, finally add shredded cabbage and cook for 3 minutes.","番茄去皮切丁炒出汁，加开水烧开，下牛肉末搅散煮8分钟":"Peel and dice the tomatoes, stir-fry to release the juice, add boiling water and bring to a boil, then add the minced beef and stir to break it up, cooking for 8 minutes.","番茄去皮切丁炒出沙，加一碗开水烧开":"Peel the tomatoes and dice them, stir-fry until they release their juice, then add a bowl of boiling water and bring to a boil.","番茄去皮切丁煮成番茄汤":"Peel the tomatoes, dice them, and cook them into tomato soup","番茄去皮切块":"Peel the tomatoes and cut them into pieces","白菜叶2片、冬瓜1段、胡萝卜1/4根":"2 cabbage leaves, 1 section of winter melon, 1/4 carrot","看！一个大气球":"Look! A big balloon","睡觉啦":"Going to sleep","睡觉时间到":"It's time to sleep","穿上小衣服":"Put on the little clothes","穿上小鞋子":"Put on small shoes","米饭50g":"50g of rice","米饭50g\",\"排骨焯水，加姜片和莲藕块，小火炖1小时，取莲藕压泥、排骨肉切碎拌入汤。西兰花焯水。软米饭。莲藕排骨汤清甜润肺，配西兰花\",4],\n[\"山药鸡汤+白灼芦笋+软米饭\",\"荤：鸡腿1个":"50g rice\", \"Blanch the ribs, add ginger slices and lotus root pieces, simmer on low heat for 1 hour, mash the lotus root, chop the pork rib meat, and mix into the soup. Blanch broccoli. Soft rice. Lotus root and pork rib soup is sweet, moistens the lungs, paired with broccoli\",4], \n[\"Yam chicken soup + boiled asparagus + soft rice\",\"Meat: 1 chicken leg","米饭50g\",\"猪肝泡水去腥切薄片，水烧开焯1分钟。另起锅煮汤，下枸杞叶煮2分钟，再下猪肝片煮1分钟。油麦菜焯水快炒。软米饭。猪肝补铁，枸杞叶清肝\",4],\n[\"时蔬肉末炒饭+紫菜蛋花汤+拌黄瓜\",\"荤：猪肉末40g、鸡蛋1个":"50g of rice, soak pork liver in water to remove the odor and cut into thin slices, blanch in boiling water for 1 minute. In another pot, cook soup, add goji leaves and cook for 2 minutes, then add pork liver slices and cook for 1 minute. Blanch and quickly stir-fry romaine lettuce. Soft rice. Pork liver supplements iron, goji leaves clear the liver.","米饭50g\",\"瑶柱泡软撕碎，与冬瓜片同煮15分钟。豆苗快炒1分钟。软米饭。瑶柱汤鲜美补锌，瑶柱含盐泡发后要冲洗干净\",4],\n[\"猪肝枸杞叶汤+清炒油麦菜+软米饭\",\"荤：猪肝30g":"50g of rice. Soak the dried scallops until soft and shred them, then cook together with winter melon slices for 15 minutes. Stir-fry pea shoots quickly for 1 minute. Soft rice. Scallop soup is delicious and rich in zinc; scallops soaked in salted water need to be rinsed clean.\n\nPork liver and goji leaf soup + stir-fried romaine lettuce + soft rice. Meat: 30g of pork liver.","米饭50g\",\"番茄去皮切丁炒出汁，加半碗水烧开，下鳕鱼丁和豆腐块焖5分钟。西葫芦切片快炒。软米饭。酸甜番茄鱼豆腐开胃，配西葫芦\",4],\n[\"冬瓜肉丸汤+蒜蓉油麦菜+小米饭\",\"荤：猪肉末50g":"50g of rice, peel and dice the tomato and stir-fry to release juice, add half a bowl of water and bring to a boil, then add cod pieces and tofu cubes and simmer for 5 minutes. Slice the zucchini and stir-fry quickly. Soft rice. Sweet and sour tomato fish tofu is appetizing, served with zucchini.\n\nWinter melon meatball soup + garlic romaine lettuce + millet rice\nMeat: 50g minced pork","米饭50g\",\"番茄去皮切丁炒出汁，加开水、土豆丁、洋葱碎煮15分钟，下牛肉末搅散再煮8分钟，最后下卷心菜丝煮3分钟。软米饭。蔬菜多营养全，酸甜好喝\",4],\n[\"紫菜蛋花汤+肉末豆腐+软米饭\",\"荤：猪肉末30g、鸡蛋1个":"50g of cooked rice; Peel and dice the tomato and sauté to release juice, add boiling water, diced potatoes, and chopped onions, cook for 15 minutes, then add minced beef and break it up, cook for another 8 minutes, finally add shredded cabbage and cook for 3 minutes. Soft cooked rice. Rich in vegetables, nutritious, sweet and sour, delicious.\n\nSeaweed and egg drop soup + minced meat tofu + soft cooked rice; Meat: 30g minced pork, 1 egg","米饭50g\",\"肉末加少许蛋清和淀粉，铺平蒸12分钟成肉饼。生菜整片焯水20秒。冬瓜切片煮汤。米饭蒸软。肉饼原汁原味，配生菜冬瓜汤\",4],\n[\"蛋黄虾仁豆腐羹+清炒小白菜+南瓜饭\",\"荤：虾仁30g、蛋黄1个":"50g of rice, minced meat mixed with a little egg white and starch, flattened and steamed for 12 minutes to make a meat patty. Blanch whole lettuce leaves for 20 seconds. Slice winter melon and cook into soup. Steam the rice until soft. The meat patty is served in its original juice and flavor, paired with lettuce and winter melon soup.\n\nEgg yolk and shrimp tofu soup + stir-fried baby bok choy + pumpkin rice. Meat: 30g shrimp, 1 egg yolk","米饭50g\",\"肉末炒散，加豆腐块和半碗水焖5分钟。紫菜撕碎，淋蛋液煮成蛋花汤。软米饭。肉末豆腐补蛋白，配紫菜蛋花汤\",4],\n[\"番茄菌菇鸡肉汤+蒸南瓜+软米饭\",\"荤：鸡胸肉30g":"50g rice,\" stir-fry minced pork until loose, add tofu cubes and half a bowl of water, and simmer for 5 minutes. Tear seaweed, drizzle with egg liquid, cook into egg drop soup. Soft rice. Minced meat and tofu for protein supplementation, paired with seaweed egg drop soup,4], \n[\"Tomato and mushroom chicken soup + steamed pumpkin + soft rice\", \"Meat: 30g chicken breast","米饭50g\",\"肉末炒散，加香菇片和半碗水，下豆腐块小火焖8分钟，出锅淋一点水淀粉。小白菜快炒。软米饭。豆腐煲补钙，配小白菜\",4],\n[\"鸡肉西兰花烩饭+清炒胡萝卜丝+黄瓜条\",\"荤：鸡胸肉40g":"50g of rice, stir-fry minced meat, add sliced shiitake mushrooms and half a bowl of water, add tofu cubes and simmer on low heat for 8 minutes, drizzle a little cornstarch slurry before serving. Quickly stir-fry baby bok choy. Soft rice. Tofu casserole for calcium, served with baby bok choy.","米饭50g\",\"虾仁去虾线用姜腌10分钟，冬瓜切薄片，水烧开同煮8分钟。菠菜焯水切段，蒜末炝锅快炒。软米饭。冬瓜虾仁汤清淡，配蒜蓉菠菜\",4],\n[\"宝宝罗宋汤+软米饭\",\"荤：牛肉末40g":"50g of cooked rice, shrimp deveined and marinated with ginger for 10 minutes, winter melon sliced thinly, boil together for 8 minutes. Blanch spinach and cut into sections, stir-fry quickly with minced garlic. Soft rice. Winter melon and shrimp soup is light, served with garlic spinach.\nBaby borscht + soft rice, Meat: 40g minced beef","米饭50g\",\"鲫鱼两面煎微黄，加开水大火煮10分钟至汤白，用纱布过滤鱼刺，加豆腐块再煮5分钟。小油菜快炒。软米饭。鲫鱼汤补钙，一定要滤净鱼刺\",4],\n[\"番茄牛肉汤+清炒卷心菜+土豆饭\",\"荤：牛肉末40g":"50g rice\", \"Pan-fry both sides of crucian carp until slightly golden, add boiling water and boil on high heat for 10 minutes until the soup turns white, filter the fish bones with cheesecloth, add tofu cubes and cook for another 5 minutes.\" Stir-fry baby bok choy quickly. Soft rice. Crucian carp soup supplements calcium, be sure to strain out all fish bones\",4], \n[\"Tomato beef soup + stir-fried cabbage + potato rice\", \"Meat: 40g minced beef","米饭50g\",\"鸡胸肉切丁，番茄去皮切丁炒出汁加水烧开，下鸡肉丁、香菇片、金针菇段煮10分钟。南瓜蒸软切块。软米饭。菌菇汤鲜，配南瓜\",4],\n[\"冬瓜瑶柱汤+清炒豆苗+软米饭\",\"荤：干瑶柱2粒":"50g rice,\" \"dice chicken breast, peel and dice tomatoes, stir-fry to release juice, add water and bring to a boil, add diced chicken, shiitake mushroom slices, enoki mushroom segments, and cook for 10 minutes.\" Steam pumpkin until soft and cut into pieces. Soft rice. Mushroom soup is fresh, paired with pumpkin\",4], \n[\"Winter Melon and Scallop Soup + Stir-fried Pea Sprouts + Soft Rice\", \"Meat: 2 dried scallops","米饭50g\",\"鸡胸肉剁蓉，玉米粒加水煮软，用勺背压碎，倒入鸡蓉搅散煮5分钟，淋蛋液成羹。茼蒿切段快炒。软米饭。玉米鸡蓉羹香滑，配茼蒿\",4],\n[\"山药蒸肉丸+炒胡萝卜丝+菠菜饭\",\"荤：猪肉末50g":"50g of rice, chicken breast minced, corn kernels cooked with water until soft, mashed with the back of a spoon, poured into the minced chicken and stirred, cooked for 5 minutes, then pour in beaten eggs to form a thick soup. Chop tonghao and stir-fry quickly. Soft rice. The corn and chicken thick soup is smooth and fragrant, served with tonghao.","米饭50g\",\"鸡腿去皮焯水，加山药块小火炖40分钟，取鸡腿肉切碎拌回汤里。芦笋去老皮焯水2分钟。软米饭。山药鸡汤健脾，配芦笋\",4],\n[\"鲫鱼豆腐汤+清炒小油菜+软米饭\",\"荤：鲫鱼半条":"50g rice\", \"Chicken thighs peeled and blanched, add yam chunks and simmer over low heat for 40 minutes, then finely chop the chicken thigh meat and mix it back into the soup. Remove the skin from the asparagus and blanch for 2 minutes. Soft rice. Yam chicken soup strengthens the spleen, paired with asparagus\",4], \n[\"Crucian carp tofu soup + stir-fried bok choy + soft rice\", \"Meat: half a crucian carp","米饭50g\",\"鸡腿肉去骨切丁，加香菇片、少许淀粉和生抽拌匀，铺盘蒸12分钟。西兰花焯水2分钟。米饭蒸软。香菇滑鸡嫩滑多汁，配西兰花\",4],\n[\"清蒸鳕鱼+菠菜泥+土豆泥\",\"荤：鳕鱼50g":"50g of rice\nDeboned chicken thigh cut into cubes, mixed with sliced mushrooms, a little starch, and light soy sauce, placed on a plate and steamed for 12 minutes. Blanch broccoli for 2 minutes. Steam rice until soft. The mushroom chicken is tender, juicy, and smooth, served with broccoli.","米饭50g\",\"鸡蛋打散加1.5倍温水，肉末铺底，盖保鲜膜蒸10分钟。南瓜蒸软切块。小青菜快炒。软米饭。蒸蛋滑嫩，配南瓜和青菜\",4],\n[\"香菇滑鸡+西兰花+软米饭\",\"荤：鸡腿肉50g":"50g of rice. Beat the egg and add 1.5 times warm water, spread the minced meat at the bottom, cover with plastic wrap and steam for 10 minutes. Steam the pumpkin until soft and cut into pieces. Quickly stir-fry the bok choy. Soft rice. The steamed egg is smooth and tender, served with pumpkin and bok choy.\n\n\"Mushroom Chicken + Broccoli + Soft Rice\". Meat: 50g of chicken thigh.","米饭60g":"60g of rice","米饭60g\",\"鸡胸肉切丁炒白，加半碗水焖5分钟，下西兰花小朵和米饭翻匀焖2分钟成烩饭。胡萝卜擦丝炒软。黄瓜去皮切条。西兰花鸡肉烩饭一锅搞定，配胡萝卜黄瓜\",4],\n[\"鳕鱼菜粥+清炒土豆丝+番茄块\",\"荤：鳕鱼40g":"60g of rice. Dice the chicken breast and stir-fry until white, add half a bowl of water and simmer for 5 minutes, then add small broccoli florets and rice, mix well and simmer for 2 minutes to make a stew rice. Grate the carrot and stir-fry until soft. Peel the cucumber and cut into strips. Broccoli and chicken stew rice done in one pot, served with carrot and cucumber.\n\nCodfish vegetable porridge + stir-fried shredded potato + tomato pieces. Meat: 40g of codfish.","米饭80g":"80g of rice","米饭80g\",\"米饭压散。鸡蛋炒碎盛出，肉末炒散，加胡萝卜丁豌豆粒炒熟，倒回米饭和鸡蛋碎炒匀。紫菜蛋花汤。黄瓜去皮切条。一锅炒饭荤素全，配汤和黄瓜\",4],\n[\"虾仁蛋炒饭+冬瓜汤+清炒小青菜\",\"荤：虾仁30g、鸡蛋1个":"80g of rice, rice fluffed. Scramble the egg and set aside, cook the minced meat until loose, add diced carrots and peas and cook through, then return the rice and scrambled egg and stir-fry evenly. Seaweed and egg drop soup. Peel and cut the cucumber into strips. One pot of fried rice with both meat and vegetables, served with soup and cucumber.","米饭80g\",\"虾仁切丁炒变色，鸡蛋炒碎，加玉米粒和米饭炒匀。冬瓜煮汤。小青菜快炒。鲜虾蛋炒饭配冬瓜汤和青菜\",4],\n[\"牛肉滑蛋粥+清炒西葫芦+蒸南瓜\",\"荤：牛肉末30g、鸡蛋1个":"80g rice,\" \"dice shrimp and stir-fry until they change color, crush the eggs, add corn kernels and rice, and stir-fry evenly.\" Winter melon is cooked in soup. Stir-fried baby bok choy quickly. Fresh shrimp and egg fried rice with winter melon soup and greens\", 4], \n[\"Beef scrambled egg porridge + stir-fried zucchini + steamed pumpkin\",\"Meat: 30g minced beef, 1 egg","米饭压散":"Fluff the rice","米饭蒸软":"Rice steamed until soft","粥滴2滴核桃油，配西兰花和胡萝卜条":"Add 2 drops of walnut oil to the porridge, served with broccoli and carrot sticks.","粥滴2滴核桃油，配西兰花和胡萝卜条\",4],":"Add 2 drops of walnut oil to the porridge, served with broccoli and carrot sticks","紫菜少许、嫩豆腐50g、小青菜2棵":"A small amount of seaweed, 50g of soft tofu, 2 baby bok choy","紫菜撕碎，淋蛋液煮成蛋花汤":"Tear the seaweed into pieces, pour in the beaten eggs, and cook into egg drop soup.","紫菜撕碎，鸡蛋打散淋入沸水成蛋花汤":"Tear the seaweed into pieces, beat the eggs and pour into boiling water to make egg drop soup","紫菜蛋花汤":"Seaweed and Egg Drop Soup","红红的圆圆的":"Red and round","红薯切条蒸软":"Cut the sweet potato into strips and steam until soft","肉丸汤清爽不腻":"The meatball soup is light and not greasy","肉丸汤清爽不腻\",4],":"Meatball soup is light and not greasy","肉末加少许蛋清和淀粉，铺平蒸12分钟成肉饼":"Add a little egg white and starch to the minced meat, spread it flat, and steam for 12 minutes to make a meat patty.","肉末加少许蛋清淀粉搅上劲，搓小丸子":"Mix the minced meat with a little egg white and starch until well combined, then roll into small meatballs.","肉末加擦细的西葫芦丝胡萝卜丝和面粉拌成糊，小火煎成小饼":"Mix minced meat with finely grated zucchini, shredded carrots, and flour into a batter, and pan-fry into small pancakes over low heat.","肉末加白菜碎、少许香油和一点点盐拌匀成馅":"Mix minced meat with chopped cabbage, a little sesame oil, and a pinch of salt to make the filling.","肉末土豆泥浇在米饭上拌匀，配菠菜黄瓜":"Mashed potatoes with minced meat poured over rice and mixed well, served with spinach and cucumber","肉末土豆泥浇在米饭上拌匀，配菠菜黄瓜\",4],":"Mashed potatoes with minced meat poured over rice and mixed evenly, served with spinach and cucumber","肉末炒散加开水，下山药泥搅匀煮开，下面条":"Stir-fry minced meat until crumbly, add boiling water, stir in mashed Chinese yam and bring to a boil, then add noodles.","肉末炒散，加四季豆、胡萝卜丁和半碗水，铺面条加盖焖5分钟拌匀":"Stir-fry the minced meat until crumbly, add green beans, diced carrots, and half a bowl of water, spread over the noodles, cover and simmer for 5 minutes, then mix well.","肉末炒散，加豆腐块和半碗水焖5分钟":"Stir-fry the minced meat until crumbly, then add tofu cubes and half a bowl of water, and simmer for 5 minutes.","肉末炒散，加香菇片和半碗水，下豆腐块小火焖8分钟，出锅淋一点水淀粉":"Stir-fry the minced meat until crumbly, add the mushroom slices and half a bowl of water, then add the tofu cubes and simmer on low heat for 8 minutes. Drizzle a little cornstarch slurry before serving.","肉末炒香加少许水和土豆泥炒成浇头":"Stir-fry minced meat until fragrant, then add a little water and mashed potatoes and stir-fry into a topping","肉末豆腐补蛋白，配紫菜蛋花汤":"Minced meat tofu for protein, served with seaweed and egg drop soup","肉末豆腐补蛋白，配紫菜蛋花汤\",4],":"Minced meat with tofu for protein, served with seaweed egg drop soup","肉饼原汁原味，配生菜冬瓜汤":"Meat patty with its original flavor, served with lettuce and winter melon soup","肉饼原汁原味，配生菜冬瓜汤\",4],":"The meat patty retains its original flavor, served with lettuce and winter melon soup","胡萝卜1/4根、娃娃菜2片":"1/4 carrot, 2 pieces of baby cabbage","胡萝卜1/4根、西葫芦1/4根、南瓜80g、西兰花3朵":"1/4 carrot, 1/4 zucchini, 80g pumpkin, 3 pieces of broccoli","胡萝卜1/4根、豌豆粒20g、黄瓜1/4根、紫菜少许":"1/4 carrot, 20g peas, 1/4 cucumber, a little seaweed","胡萝卜切丝炒软":"Shred the carrot and stir-fry until soft","胡萝卜切条蒸软":"Cut the carrots into strips and steam until soft","胡萝卜切碎和面同煮，快熟时下虾仁丁和娃娃菜丝":"Chop the carrots and cook them with the noodles, then add diced shrimp and shredded baby bok choy when nearly cooked.","胡萝卜切细丝，热油小火煸炒2分钟至软":"Cut the carrot into thin strips, and stir-fry over low heat in hot oil for 2 minut atties with corn soup and baby bok choy.\n\nChicken and vegetable patties + pumpkin soup + blanched broccoli, Meat: 40g minced chicken","面粉30g\",\"虾仁剁泥，豆腐压碎，加面粉和少许蛋清拌匀，压小饼煎至两面微黄。菠菜焯水切碎，加水煮成菠菜汤。胡萝卜切条蒸软。豆腐虾仁饼补钙，配菠菜汤和胡萝卜条\",4],\n[\"肉末蔬菜饼+小米粥+清炒豆芽\",\"荤：猪肉末40g":"30g of flour, finely chopped shrimp, mashed tofu, mix with flour and a little egg white until well combined, press into small pancakes and pan-fry until both sides are slightly yellow. Blanch and chop spinach, then cook with water to make spinach soup. Cut carrots into strips and steam until soft. Tofu and shrimp pancakes provide calcium, served with spinach soup and carrot strips.\n\nMinced meat and vegetable pancakes + millet porridge + stir-fried bean sprouts. Meat: 40g minced pork","面粉30g\",\"鳕鱼蒸熟去刺，南瓜蒸熟压泥，加面粉拌成团压小饼煎熟。鸡蛋打散入番茄汤成蛋花汤。芦笋切段焯水快炒。鳕鱼南瓜饼配番茄蛋汤和芦笋\",4],\n[\"猪肉荠菜馄饨+冬瓜汤+清炒卷心菜\",\"荤：猪肉末40g":"30g of flour, steam cod and remove the bones, steam pumpkin and mash it, mix with flour to form a dough, press into small patties and pan-fry until cooked. Beat the eggs and add to tomato soup to make egg drop soup. Cut asparagus into sections, blanch, and stir-fry quickly. Serve cod and pumpkin patties with tomato egg soup and asparagus.\n\nPork and shepherd's purse wontons + winter melon soup + stir-fried cabbage, Meat: 40g of minced pork","面粉30g\",\"鸡肉末加擦细的胡萝卜丝和西葫芦丝、面粉拌匀，压小饼煎熟。南瓜蒸熟加水压成浓汤。西兰花焯水拌核桃油。鸡肉饼软嫩，配南瓜汤和西兰花\",4],\n[\"虾仁豆腐饼+菠菜汤+蒸胡萝卜条\",\"荤：虾仁40g、嫩豆腐50g":"30g flour, mix ground chicken with finely grated carrot and zucchini with flour, press into small patties and pan-fry until cooked. Steam pumpkin and mash with water into a thick soup. Blanch broccoli and mix with walnut oil. The chicken patties are soft and tender, served with pumpkin soup and broccoli.\n\nShrimp and tofu patties + spinach soup + steamed carrot sticks\nMeat: 40g shrimp, 50g soft tofu","面粉30g、小米30g":"30g of flour, 30g of millet","面粉30g、小米30g\",\"肉末加擦细的西葫芦丝胡萝卜丝和面粉拌成糊，小火煎成小饼。小米熬成粥。豆芽掐尾快炒1分钟。蔬菜肉饼配小米粥和炒豆芽\",4],\n[\"鳕鱼南瓜饼+番茄蛋汤+清炒芦笋\",\"荤：鳕鱼40g":"30g flour, 30g millet. Mix minced meat with finely grated zucchini, carrot, and flour to make a batter, then pan-fry over low heat into small cakes. Cook the millet into porridge. Trim bean sprouts and stir-fry quickly for 1 minute. Serve the vegetable meat cakes with millet porridge and stir-fried bean sprouts.\n\nCod and pumpkin cakes + tomato egg soup + stir-fried asparagus. Meat: 40g cod.","面粉30g、小米30g\",\"虾仁剁碎，西葫芦擦丝，与面粉和少量水拌成糊，小火煎小饼。南瓜切丁与小米同熬成粥。卷心菜切丝快炒。鲜香小饼配南瓜小米粥和炒卷心菜\",4],\n[\"时蔬鸡蛋卷饼+小米粥+清炒豆芽\",\"荤：鸡蛋1个":"30g flour, 30g millet. Chop the shrimp, grate the zucchini, and mix with flour and a small amount of water into a batter. Fry small pancakes over low heat. Cut the pumpkin into cubes and cook with millet into porridge. Shred the cabbage and stir-fry quickly. Serve the fragrant pancakes with pumpkin millet porridge and stir-fried cabbage.\n\nSeasonal vegetable egg pancakes + millet porridge + stir-fried bean sprouts. Meat: 1 egg.","面粉40g、小米30g":"40g of flour, 30g of millet","面粉加水和蛋液调成糊，摊成薄饼，卷入炒软的胡萝卜丝、生菜叶和黄瓜条，切段":"Mix flour with water and beaten eggs to make a batter, spread into thin pancakes, roll in sautéed carrot strips, lettuce leaves, and cucumber sticks, then cut into sections.","飞呀飞呀飞上天":"Fly, fly, fly up to the sky","饺子皮10张":"10 dumpling wrappers","饺子皮10张\",\"肉末加白菜碎、少许香油和一点点盐拌匀成馅。饺子皮包小饺子，沸水下锅煮至浮起再煮3分钟。冬瓜切薄片煮汤。胡萝卜切丝炒软。饺子配冬瓜汤和胡萝卜丝\",4],\n[\"鸡肉香菇饺+紫菜蛋花汤+拌黄瓜\",\"荤：鸡肉末50g":"10 dumpling wrappers. Mix minced meat with chopped cabbage, a little sesame oil, and a pinch of salt to make the filling. Wrap small dumplings with the dumpling wrappers and cook in boiling water until they float, then cook for another 3 minutes. Slice winter melon thinly and cook into soup. Shred and sauté carrots until soft. Serve dumplings with winter melon soup and carrot shreds.\n\nChicken and shiitake mushroom dumplings + seaweed egg drop soup + marinated cucumber\nMeat: 50g minced chicken","饺子皮10张\",\"虾仁剁泥、胡萝卜擦细丝，混合成馅包小饺子。番茄去皮切丁煮成番茄汤。西兰花焯水。虾仁饺子配番茄汤和西兰花\",4],\n[\"三文鱼土豆饼+玉米浓汤+清炒小青菜\",\"荤：三文鱼40g":"10 dumpling wrappers. Chop shrimp into a paste and grate carrots into fine shreds, mix them to make the filling and wrap small dumplings. Peel and dice tomatoes to cook into tomato soup. Blanch the broccoli. Serve the shrimp dumplings with tomato soup and broccoli.\n\nSalmon potato cakes + corn chowder + stir-fried baby greens. Meat: 40g of salmon.","饺子皮10张\",\"鸡肉末加香菇碎拌匀成馅，包小饺子煮熟。紫菜撕碎，鸡蛋打散淋入沸水成蛋花汤。黄瓜去皮切条。饺子蘸少许宝宝酱油，配紫菜蛋花汤和黄瓜条\",4],\n[\"虾仁胡萝卜饺+番茄汤+清炒西兰花\",\"荤：虾仁50g":"10 dumpling wrappers. Mix ground chicken with finely chopped mushrooms to make the filling, wrap into small dumplings and cook until done. Tear the seaweed into pieces, beat the eggs and pour into boiling water to make egg drop soup. Peel the cucumber and cut into strips. Dip the dumplings in a little baby soy sauce, and serve with seaweed egg drop soup and cucumber strips.\n\nShrimp and carrot dumplings + tomato soup + stir-fried broccoli. Meat: 50g shrimp","饺子皮包小饺子，沸水下锅煮至浮起再煮3分钟":"Wrap small dumplings with dumpling wrappers, put them into boiling water, cook until they float, then cook for another 3 minutes","饺子蘸少许宝宝酱油，配紫菜蛋花汤和黄瓜条":"Dumplings dipped in a little baby soy sauce, served with seaweed and egg drop soup and cucumber sticks","饺子蘸少许宝宝酱油，配紫菜蛋花汤和黄瓜条\",4],":"Dumplings dipped in a little baby soy sauce, served with seaweed egg drop soup and cucumber sticks","饺子配冬瓜汤和胡萝卜丝":"Dumplings served with winter melon soup and shredded carrots","饺子配冬瓜汤和胡萝卜丝\",4],":"Dumplings served with winter melon soup and shredded carrots","馄饨皮10张":"10 wonton wrappers","馄饨皮10张\",\"荠菜焯水挤干切碎，和肉末拌匀成馅，包小馄饨煮熟。冬瓜煮成清汤。卷心菜切丝快炒。小馄饨配冬瓜汤和炒卷心菜\",4],\n[\"鸡肉菌菇馄饨+黄瓜条+蒸红薯\",\"荤：鸡肉末40g":"10 wonton wrappers, blanch and drain shepherd's purse then chop, mix with minced meat to make filling, wrap small wontons and cook until done. Cook winter melon into clear soup. Shred cabbage and quickly stir-fry. Serve small wontons with winter melon soup and stir-fried cabbage.\nChicken and mushroom wontons + cucumber sticks + steamed sweet potato, Meat: 40g minced chicken","馄饨皮10张\",\"鸡肉末加香菇碎和少许蛋清拌成馅，包小馄饨煮熟。红薯切条蒸软。黄瓜去皮切条。小馄饨配红薯和黄瓜\",4],\n[\"肉末蒸蛋+清炒小青菜+南瓜块\",\"荤：猪肉末20g、鸡蛋1个":"10 wonton wrappers, mix minced chicken with chopped shiitake mushrooms and a little egg white to make the filling, wrap into small wontons and cook. Cut sweet potatoes into strips and steam until soft. Peel cucumbers and cut into strips. Serve small wontons with sweet potatoes and cucumbers.\n\nMinced meat steamed egg + stir-fried baby bok choy + pumpkin chunks\nMeat: 20g minced pork, 1 egg","香菇2朵、荷兰豆8个":"2 shiitake mushrooms, 8 snow peas","香菇2朵、西兰花3朵":"2 shiitake mushrooms, 3 broccoli florets","香菇2朵、西兰花3朵、胡萝卜1/4根":"2 shiitake mushrooms, 3 broccoli florets, 1/4 carrot","香菇2朵、黄瓜1/4根、紫菜少许":"2 shiitake mushrooms, 1/4 cucumber, a small amount of seaweed","香菇2朵、黄瓜1/4根、红薯50g":"2 shiitake mushrooms, 1/4 cucumber, 50g sweet potato","香菇泡软切片，热油下鸡肉丁炒白，加香菇和两碗开水煮开":"Soak the shiitake mushrooms until soft, then slice them. Heat oil and stir-fry the diced chicken until white, add the mushrooms and two bowls of boiling water, and bring to a boil.","香菇滑鸡嫩滑多汁，配西兰花":"Tender and juicy shiitake mushroom chicken, served with broccoli","香菇滑鸡嫩滑多汁，配西兰花\",4],":"Tender and juicy chicken with shiitake mushrooms, served with broccoli","鱼粥滴柠檬汁提鲜，配口蘑和胡萝卜":"Fish porridge with a dash of lemon juice to enhance the flavor, served with button mushrooms and carrots","鱼粥滴柠檬汁提鲜，配口蘑和胡萝卜\",4],":"Add a few drops of lemon juice to the fish porridge to enhance its freshness, paired with button mushrooms and carrots.","鲜虾仁20g、肉末20g":"20g fresh shrimp, 20g minced meat","鲜虾仁30g":"30g of fresh shrimp","鲜虾蛋炒饭配冬瓜汤和青菜":"Shrimp and egg fried rice served with winter melon soup and green vegetables","鲜虾蛋炒饭配冬瓜汤和青菜\",4],":"Shrimp and egg fried rice with winter melon soup and greens","鲜香小饼配南瓜小米粥和炒卷心菜":"Fragrant small pancakes with pumpkin millet porridge and stir-fried cabbage","鲜香小饼配南瓜小米粥和炒卷心菜\",4],":"Fragrant small pancakes with pumpkin millet porridge and stir-fried cabbage","鲫鱼两面煎微黄，加开水大火煮10分钟至汤白，用纱布过滤鱼刺，加豆腐块再煮5分钟":"Pan-fry the crucian carp on both sides until slightly yellow, add boiling water and cook on high heat for 10 minutes until the soup turns white, filter out the fish bones with cheesecloth, add tofu cubes, and cook for another 5 minutes","鲫鱼半条":"Half a crucian carp","鲫鱼汤补钙，一定要滤净鱼刺":"Crucian carp soup supplements calcium, be sure to filter out the fish bones","鲫鱼汤补钙，一定要滤净鱼刺\",4],":"Crucian carp soup supplements calcium; you must carefully remove the fish bones.","鳕鱼40g":"Cod 40g","鳕鱼50g":"50g cod","鳕鱼南瓜饼配番茄蛋汤和芦笋":"Cod and pumpkin pancakes with tomato egg soup and asparagus","鳕鱼南瓜饼配番茄蛋汤和芦笋\",4],":"Cod and pumpkin cakes with tomato egg soup and asparagus","鳕鱼去皮去刺切丁，滴几滴柠檬汁去腥":"Remove the skin and bones from the cod and cut it into cubes, then add a few drops of lemon juice to remove the fishy smell.","鳕鱼去皮去刺蒸熟压碎，粥快好时拌入":"Remove the skin and bones from the cod, steam it until cooked, and mash it, then stir it in when the porridge is almost done.","鳕鱼抹少许柠檬汁，铺姜片蒸8分钟，取出去皮去刺":"Rub the cod with a little lemon juice, lay ginger slices, steam for 8 minutes, then remove the skin and bones","鳕鱼菜粥补DHA，配土豆丝番茄":"Codfish and vegetable porridge to supplement DHA, served with shredded potatoes and tomatoes","鳕鱼菜粥补DHA，配土豆丝番茄\",4],":"Cod and vegetable congee to supplement DHA, served with shredded potatoes and tomatoes","鳕鱼蒸熟去刺，南瓜蒸熟压泥，加面粉拌成团压小饼煎熟":"Steam the cod until cooked and remove the bones, steam the pumpkin and mash it, mix with flour to form a dough, press into small cakes, and pan-fry until cooked.","鳕鱼鲜嫩补DHA，配菠菜泥土豆泥":"Fresh and tender cod rich in DHA, served with spinach puree and mashed potatoes","鳕鱼鲜嫩补DHA，配菠菜泥土豆泥\",4],":"Tender cod rich in DHA, served with spinach puree and mashed potatoes","鸟妈妈带来食物":"Mother bird brings food","鸟窝里有只小鸟":"There is a little bird in the nest","鸡肉切末、香菇切碎，粥快好时下锅再煮5分钟":"Finely chop the chicken and mushrooms, and when the porridge is almost done, add them to the pot and cook for another 5 minutes.","鸡肉末40g":"40g minced 0g chicken thigh meat","鸡腿肉50g":"50g chicken thigh meat","鸡腿肉去骨切丁炒白，加开水烧开下南瓜泥搅匀":"Debone the chicken thigh meat and cut it into cubes, stir-fry until white, then add boiling water and bring to a boil. Add pumpkin puree and stir evenly.","鸡腿肉去骨切丁，加香菇片、少许淀粉和生抽拌匀，铺盘蒸12分钟":"Remove the bones from the chicken thighs and cut into cubes, mix with sliced shiitake mushrooms, a little starch, and light soy sauce, then spread on a plate and steam for 12 minutes","鸡腿肉去骨切丁，南瓜去皮切丁":"Debone the chicken thigh and cut into cubes, peel the pumpkin and cut into cubes","鸡蛋1个":"1 egg","鸡蛋打散入番茄汤成蛋花汤":"Beat the eggs and pour them into the tomato soup to make egg drop soup","鸡蛋打散加1.5倍温水，肉末铺底，盖保鲜膜蒸10分钟":"Beat the eggs and add 1.5 times the amount of warm water, spread the minced meat on the bottom, cover with plastic wrap and steam for 10 minutes","鸡蛋炒碎盛出，肉末炒散，加胡萝卜丁豌豆粒炒熟，倒回米饭和鸡蛋碎炒匀":"Scramble the eggs and set aside. Stir-fry the minced meat until loose, add diced carrots and peas and cook until done, then return the rice and scrambled eggs and stir-fry until evenly mixed.","黄瓜去皮切条":"Peel the cucumber and cut it into strips","，桌面就有小树苗图标啦 🌱');":", and there will be a little sapling icon on the desktop 🌱');","💡 不要求一次说很多，固定场景反复说同一句，宝宝自然就懂了":"💡 You don't need to say a lot at once; repeating the same sentence in the same situation will help the baby naturally understand.","💡 先听几遍熟悉旋律，再跟着做动作，最后留白让宝宝接词（比如唱到 “round and ____” 停一下）":"💡 Listen to the melody a few times to get familiar with it, then follow along with the actions, and finally leave a pause for the baby to fill in the word (for example, sing up to 'round and ____' and pause)","💡 排敏原则：新食物一次只加一种，连吃 3 天观察反应；蛋白、虾、芒果、花生等易过敏食物建议 1 岁后逐步尝试，每次少量":"💡 Allergy Avoidance Principle: Introduce only one new food at a time, eat it for 3 consecutive days and observe any reactions; foods that are commonly allergenic such as proteins, shrimp, mango, peanuts, etc., are recommended to be tried gradually after the age of 1, in small amounts each time.","💡 教育没有标准答案，情绪稳定 + 共情 + 示范，是通用的底层方法":"💡 There is no standard answer in education; emotional stability + empathy + demonstration are universal fundamental methods.","🔊 点击卡片朗读英文单词，让宝宝看着 emoji 指认":"🔊 Click the card to read the English word aloud, and let the baby look at the emoji to point it out","🔊 点击字母卡片，先读字母、再读 “A is for Apple” 整句，跟着 ABC 歌一起唱":"🔊 Click the letter card, first read the letter, then read the whole sentence 'A is for Apple', and sing along with the ABC song","小蝌蚪找妈妈":"Little Tadpoles Looking for Their Mother","小蝌蚪一路询问，终于找到妈妈，认识青蛙的成长。":"The little tadpoles asked all the way and finally found their mother, learning about the growth of frogs.","龟兔赛跑":"The Tortoise and the Hare","慢吞吞的乌龟靠坚持赢了骄傲的兔子。":"The slow-moving turtle won against the arrogant rabbit through perseverance.","三只小猪":"Three Little Pigs","用不同材料盖房，只有砖房挡住大灰狼。":"Building houses with different materials, only the brick house can keep the big bad wolf out.","狼来了":"The wolf is coming","撒谎的孩子最后没人相信他。":"The child who lies is not believed by anyone in the end.","小马过河":"The little horse crosses the river","自己试过才知道河水是深是浅。":"You only know how deep or shallow the river is by trying it yourself.","猴子捞月":"The monkey tries to fish the moon","猴子们以为月亮掉井里，原来是倒影。":"The monkeys thought the moon had fallen into the well, but it was actually its reflection.","守株待兔":"Waiting for a rabbit by the tree stump","勤劳":"Diligent","等兔子撞树，不如自己好好种地。":"Instead of waiting for rabbits to run into the tree, it's better to cultivate the land yourself.","画蛇添足":"To draw a snake and add feet","适度":"Moderate","多此一举，反而把事情办坏了。":"Unnecessary action, on the contrary, made things worse.","狐假虎威":"The fox exploits the tiger's might","狐狸借老虎的威风吓跑了百兽。":"The fox borrowed the tiger's prestige to scare away all the beasts.","拔萝卜":"Pulling up a radish","大家一起用力，才拔出大萝卜。":"Everyone worked together with force, and only then did they pull out the big radish.","愚公移山":"The Foolish Old Man Who Moved Mountains","祖祖辈辈努力，也能搬走大山。":"Generations of hard work can also move mountains.","曹冲称象":"Cao Chong Weighs the Elephant","用石头等量，称出了大象的重量。":"Using stones in equal amounts, the weight of the elephant was measured.","司马光砸缸":"Sima Guang Smashes the Vat","砸破水缸，救出落水的小伙伴。":"Smash the water tank to rescue the friend who fell into the water.","孔融让梨":"Kong Rong Gives Up Pears","把大的梨让给哥哥，自己拿小的。":"Give the big pear to your older brother and take the small one for yourself.","神笔马良":"Magic Brush Ma Liang","用神笔为穷人画出想要的东西。":"Use a magical pen to draw what the poor want.","后羿射日":"Hou Yi Shoots the Suns","射下九个太阳，拯救了人间。":"Shot down nine suns, saving the world.","嫦娥奔月":"Chang'e flies to the moon","嫦娥吞下仙药，飞到了月宫。":"Chang'e swallowed the elixir and flew to the Moon Palace.","精卫填海":"Jingwei fills the sea","小小鸟衔石填海，永不言弃。":"The little bird carries stones to fill the sea, never giving up.","牛郎织女":"The Cowherd and the Weaver Girl","七夕这天，喜鹊搭桥让他们相会。":"On the Qixi Festival, magpies build a bridge to let them meet.","哪吒闹海":"Nezha Conquers the Sea","小英雄哪吒打败了东海龙王。":"The little hero Nezha defeated the Dragon King of the East Sea.","大闹天宫":"The Havoc in Heaven","孙悟空举起金箍棒反抗天庭。":"Sun Wukong raised his golden staff to resist the Heavenly Court.","年的故事":"Story of the Year","用红色和鞭炮赶走了叫「年」的怪兽。":"Used red and firecrackers to drive away the monster called 'Nian'.","端午的由来":"The Origin of the Dragon Boat Festival","为了纪念屈原，有了吃粽子赛龙舟。":"In order to commemorate Qu Yuan, people eat zongzi and hold dragon boat races.","中秋的月亮":"The Mid-Autumn Moon","圆圆的月亮下，一家人赏月吃月饼。":"Under the round moon, the whole family enjoys moon-gazing and eating mooncakes.","十二生肖":"The Twelve Zodiac Animals","动物们赛跑，排出了十二个年份。":"The animals raced, resulting in twelve years.","狐狸和葡萄":"The Fox and the Grapes","够不到就说酸，别给自己找借口。":"If you can't reach it, just say it's sour; don't make excuses for yourself.","乌鸦喝水":"The crow drinks water","丢进石子，让水位升到嘴边。":"Throw in some stones, and let the water rise to the mouth.","北风与太阳":"The North Wind and the Sun","温暖比强风，更让人愿意脱下外套。":"Warmth makes people more willing to take off their ["肉末蔬菜饼+小米粥+清炒豆芽","荤：猪肉末40g｜素：西葫芦1/4根、胡萝卜1/4根、豆芽一小把｜主食：面粉30g、小米30g","肉末加擦细的西葫芦丝胡萝卜丝和面粉拌成糊，小火煎成小饼。小米熬成粥。豆芽掐尾快炒1分钟。蔬菜肉饼配小米粥和炒豆芽",4],
["鳕鱼南瓜饼+番茄蛋汤+清炒芦笋","荤：鳕鱼40g｜素：南瓜80g、番茄半个、芦笋2根｜主食：面粉30g","鳕鱼蒸熟去刺，南瓜蒸熟压泥，加面粉拌成团压小饼煎熟。鸡蛋打散入番茄汤成蛋花汤。芦笋切段焯水快炒。鳕鱼南瓜饼配番茄蛋汤和芦笋",4],

["清蒸鳕鱼+菠菜泥+土豆泥","荤：鳕鱼50g｜素：菠菜3棵、土豆半个｜主食：土豆泥","鳕鱼抹少许柠檬汁，铺姜片蒸8分钟，取出去皮去刺。土豆蒸熟压泥拌配方奶。菠菜焯水切碎。鳕鱼鲜嫩补DHA，配菠菜泥土豆泥",4],

["冬瓜肉丸汤+蒜蓉油麦菜+小米饭","荤：猪肉末50g｜素：冬瓜1段、油麦菜2棵｜主食：大米40g+小米20g","肉末加少许蛋清淀粉搅上劲，搓小丸子。水烧开下丸子煮至浮起，下冬瓜片再煮8分钟。油麦菜焯水，蒜末炝锅快炒。小米大米同焖饭。肉丸汤清爽不腻",4],
["鸡蓉玉米羹+清炒茼蒿+软米饭","荤：鸡胸肉30g、鸡蛋1个｜素：甜玉米粒40g、茼蒿2棵｜主食：米饭50g","鸡胸肉剁蓉，玉米粒加水煮软，用勺背压碎，倒入鸡蓉搅散煮5分钟，淋蛋液成羹。茼蒿切段快炒。软米饭。玉米鸡蓉羹香滑，配茼蒿",4],

["排骨莲藕汤+清炒西兰花+软米饭","荤：排骨2小块｜素：莲藕1段、西兰花3朵｜主食：米饭50g","排骨焯水，加姜片和莲藕块，小火炖1小时，取莲藕压泥、排骨肉切碎拌入汤。西兰花焯水。软米饭。莲藕排骨汤清甜润肺，配西兰花",4],

function menuById(key){
  if(!key)return null;
  if(key[0]==='r'){const r=(S.recipes||[]).find(x=>x.id===key.slice(1));if(r)return {name:r.name,ing:'',steps:r.steps||'',stage:null,custom:true};}
  const i=parseInt(key.slice(1));const f=FOOD[i];
  return f?{name:f[0],ing:f[1],steps:f[2],stage:f[3]}:null;
}
/* ================= 转盘筛选体系：不想吃 / 过敏 / 爱吃 / 自定义食谱 ================= */
/* 过敏别名：标记「蛋黄」时含蛋的菜都避开等（奶/蛋/麦类整族排除更安全） */
const ALL_ALIAS={'蛋黄':['蛋'],'全蛋':['蛋'],'鲜牛奶':['奶'],'酸奶':['奶'],'奶酪':['奶','芝士'],'黄油':['奶'],'小麦面粉':['面','麦','馄饨','饺子'],'燕麦':['麦'],'花生酱':['花生'],'芝麻酱':['芝麻'],'核桃':['核桃'],'核桃油':['核桃'],'猕猴桃':['猕猴桃','奇异果']};
function allergenHit(text){
  if(!text)return null;
  const names=Object.keys(S.allergy||{});
  for(const a of names){
    if(text.indexOf(a)>=0)return a;
    const al=ALL_ALIAS[a];
    if(al){for(const k of al){if(k&&text.indexOf(k)>=0)return a;}}
  }
  return null;
}
function isAllergicDish(f){return !!allergenHit(f[0]+'｜'+f[1]);}
function isDislikedDish(f){return (S.dislike||[]).some(d=>d&&((f[0].indexOf(d)>=0)||(f[1].indexOf(d)>=0)));}
function baseWheelKeys(){
  const am=gameAgeCap();
  /* FOOD 第 4 个元素 = 阶段：1=6月+ 2=8月+ 3=10月+ 4=12月+，按当前月龄过滤 */
  const minStage=am>=12?4:am>=10?3:am>=8?2:am>=6?1:1;
  return FOOD.map((f,i)=>{
    const stage=f[3]|0;
    if(stage < minStage)return null;
    return (isDislikedDish(f)||isAllergicDish(f))?null:'f'+i;
  }).filter(Boolean);
}
function lovedKeys(keys){return keys.filter(k=>k[0]==='f'&&(S.love||[]).indexOf(FOOD[+k.slice(1)][0])>=0);}
function curKey(){return (spinIdx>=0&&S.wheel[spinIdx])?S.wheel[spinIdx]:(S.wheel[0]||'f0');}
function stopSpinSafe(){if(spinning){spinning=false;cancelAnimationFrame(animId);setSpinBtns(false,true);}}
function buildWheel(){
  stopSpinSafe();
  const keys=baseWheelKeys();
  S.wheel=keys.concat(lovedKeys(keys));
  spinIdx=-1;save();
  document.querySelectorAll('#wsvg,#wsvgFull').forEach(s=>{if(s)s.innerHTML=wheelSvg();});
}
/* 每次旋转前重建：自定义食谱约一半几率上场，顶替 2 格（概率≈普通菜）；爱吃菜双倍权重 */
function buildWheelForSpin(){
  let keys=baseWheelKeys().slice();
  const recs=(S.recipes||[]).filter(r=>!allergenHit(r.name)&&!(S.dislike||[]).some(d=>d&&r.name.indexOf(d)>=0));
  if(keys.length>=2&&recs.length&&Math.random()<0.5){
    const r=recs[Math.floor(Math.random()*recs.length)];
    keys[Math.floor(Math.random()*keys.length)]='r'+r.id;
    keys[Math.floor(Math.random()*keys.length)]='r'+r.id;
  }
  S.wheel=keys.concat(lovedKeys(keys));
}

function lineChart(recs,label,color){
  if(recs.length<2)return `<div class="chartcard" data-charttype="${recs[0]?esc(recs[0].type):''}" data-chartlabel="${esc(label)}" data-chartcolor="${esc(color)}" style="background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:var(--sh);cursor:pointer;"><div style="font-weight:700;font-size:13px;color:#666;">${label}</div><div class="muted" style="margin-top:8px;">记录 ≥2 条显示曲线</div></div>`;
  const w=280,h=150,pad=24,padB=34;
  const vals=recs.map(r=>r.v),min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1;
  const X=i=>pad+(w-2*pad)*i/(recs.length-1),Y=v=>h-padB-(h-padB-pad)*(v-min)/rg;
  let pts='',dots='',lbl='',dlbl='';
  recs.forEach((r,i)=>{const x=X(i),y=Y(r.v);pts+=`${x},${y} `;dots+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${color}"/>`;
    if(recs.length<=5||i===0||i===recs.length-1){lbl+=`<text x="${x}" y="${y-7}" text-anchor="middle" font-size="10" fill="${color}" font-weight="700">${r.v}</text>`;dlbl+=`<text x="${x}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="#999">${r.date.slice(5)}</text>`;}});
  return `<div class="chartcard" data-charttype="${esc(recs[0].type)}" data-chartlabel="${esc(label)}" data-chartcolor="${esc(color)}" style="background:#fff;border-radius:12px;padding:12px 8px 8px;box-shadow:var(--sh);cursor:pointer;"><div style="text-align:center;font-weight:700;font-size:13px;color:#666;">${label}</div><svg width="100%" viewBox="0 0 280 150"><line x1="${pad}" y1="${h-padB}" x2="${w-pad}" y2="${h-padB}" stroke="#F0EAE3"/>${dlbl}<polyline points="${pts.trim()}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbl}</svg></div>`;
}

/* 三餐推荐安全化：含过敏原的菜 → 用同池安全菜确定性替换（同一天同一套稳定不变） */
function mealSafeItem(x){
  const hit=allergenHit(x);
  if(!hit)return {name:x,hit:null};
  const isBf=MEAL_PLAN.some(m=>m.bf.indexOf(x)>=0);
  let pool;
  if(isBf){pool=[...new Set([].concat(...MEAL_PLAN.map(m=>m.bf)))].filter(b=>!allergenHit(b));}
  else{pool=FOOD.filter(f=>!allergenHit(f[0]+'｜'+f[1])).map(f=>f[0]);}
  if(!pool.length)return {name:x,hit,stuck:true};
  let h=0;const seed=x+'|'+hit+'|'+((dayIdx(today())+mealOff)%97);
  for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  return {name:pool[h%pool.length],hit};
}
