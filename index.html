// ElevenLabs 默认儿童音色（Bella，美式女童感），可在「宝宝设置」换成你喜欢的儿童音 voice_id
const DEFAULT_EL_VOICE='EXAVITQu4vr4xnSDxMaL';
function speak(txt){
  if(!txt)return;
  if(window.__HB_LANG==='en'&&window.__hbTr)txt=window.__hbTr(txt);
  // 已配置 ElevenLabs Key：优先云端真人儿童音，失败再回退系统语音
  if((S.aiKey||'').trim()){ if(onlineTTS(txt,function(){localSpeak(txt,function(){toast('云端发音失败，也没找到系统语音');});}))return; }
  const ss=window.speechSynthesis;
  const finalFail=()=>toast('发音不可用，建议在「宝宝设置」填入 ElevenLabs Key 获取儿童音');
  const tryOnline=()=>{ if(!onlineTTS(txt,finalFail)) finalFail(); };
  // 长文本（儿歌歌词/故事）：本地朗读最稳
  if(txt.length>120){ if(ss){localSpeak(txt,finalFail);}else{tryOnline();} return; }
  // 短文本：本地语音优先
  if(ss){ localSpeak(txt,tryOnline); } else { tryOnline(); }
}
function localSpeak(txt,onfail){
  const ss=window.speechSynthesis;if(!ss){if(onfail)onfail();return;}
  try{
    // 先生成 utterance，再选声音，MAC/安卓/微信里都能发声
    ss.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    // 自动识别语言：含中文且几乎无英文单词 → 用中文语音；否则用英文语音
    const isCn=/[\u4e00-\u9fff]/.test(txt)&&!/[A-Za-z]{3,}/.test(txt);
    u.lang=isCn?'zh-CN':'en-US';
    u.rate=.84;              // 稍慢，读给小孩更从容
    u.pitch=1.08;            // 略高一点，接近温和的童感（不宜过高以免发飘）
    const vs=ss.getVoices();
    if(isCn){
      // 中文：优先自然中文女声，其次任意中文音，最后随便一个
      const cnv=['Xiaoxiao','Xiaoyi','Xiaohan','Xiaomo','Huihui','Yaoyao','Tingting','Meijia','Google 普通话','Google 國語','Lili','Tian-Tian','Sinji'];
      let v=vs.find(x=>{const l=(x.lang||'').toLowerCase().replace('_','-');return l.indexOf('zh')===0&&cnv.some(n=>x.name.indexOf(n)>=0);})
        ||vs.find(x=>{const l=(x.lang||'').toLowerCase().replace('_','-');return l.indexOf('zh')===0;})
        ||vs[0];
      if(v)u.voice=v;
    }else{
      // 英文：优先听感自然的英文女声，其次任何英文音，最后随便一个
      const prefer=['Samantha','Karen','Allison','Aria','Ava','Zira','Jenny','Zoe','Google US English'];
      let v=vs.find(x=>{const l=(x.lang||'').toLowerCase().replace('_','-');return l.indexOf('en-us')>=0&&prefer.some(n=>x.name.toLowerCase().indexOf(n.toLowerCase())>=0);})
        ||vs.find(x=>{const l=(x.lang||'').toLowerCase().replace('_','-');return l.indexOf('en')===0;})
        ||vs[0];
      if(v)u.voice=v;
    }
    let d=false;
    let g=setInterval(function(){if(!ss.speaking&&!ss.pending){clearInterval(g);return;}ss.pause();ss.resume();},3000);
    u.onend=function(){if(!d){d=true;clearInterval(g);}};
    u.onerror=function(){if(!d){d=true;clearInterval(g);if(onfail)onfail();}};
    // 必须在用户点击手势内同步触发
    ss.speak(u);
    // 静默失败兜底：600ms 仍未发声则转在线发音
    setTimeout(function(){if(!d&&!ss.speaking&&!ss.pending){clearInterval(g);if(onfail)onfail();}},600);
  }catch(e){if(onfail)onfail();}
}
// ElevenLabs 神经TTS：真人儿童美语发音，需在「宝宝设置」填入 Key
function onlineTTS(txt,onfail){
  const key=(S.aiKey||'').trim();
  if(!key)return false;
  const vid=(S.aiVoice||'').trim()||DEFAULT_EL_VOICE;
  try{
    fetch('https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(vid),{
      method:'POST',
      headers:{'Content-Type':'application/json','xi-api-key':key},
      body:JSON.stringify({text:txt,model_id:'eleven_multilingual_v2',voice_settings:{stability:.45,similarity_boost:.85,style:.7}})
    }).then(function(r){
      if(!r.ok)throw 0;
      return r.blob();
    }).then(function(blob){
      const u=URL.createObjectURL(blob);
      const a=new Audio(u);
      a.onended=function(){URL.revokeObjectURL(u);};
      a.onerror=function(){URL.revokeObjectURL(u);if(onfail)onfail();};
      a.play().catch(function(){URL.revokeObjectURL(u);if(onfail)onfail();});
    }).catch(function(){ if(onfail)onfail(); });
    return true;
  }catch(e){ if(onfail)onfail(); return false; }
}

  <p class="muted" style="margin-top:12px;">💡 不要求一次说很多，固定场景反复说同一句，宝宝自然就懂了。</p>
  </div>`;
}
function talkListHtml(ti,onlyFav){
  const fav=S.talkFav||[];
  const list=ti<0?TALK:TALK.slice(ti,ti+1);
  let out='';
  list.forEach(t=>{
    const items=onlyFav?t.p.filter(p=>fav.includes(t.s+':'+p[0])):t.p;
    if(!items.length)return;
    out+=`<div style="font-weight:800;font-size:14px;margin:12px 0 8px;display:flex;align-items:center;gap:7px;"><span class="nicon" style="background:${t.c};font-size:15px;">${t.e}</span>${t.s}（${items.length}句）</div>
    ${items.map(p=>{const key=t.s+':'+p[0];const isFav=fav.includes(key);return `<div class="talkCard">
      <div class="scEm" style="background:${t.c}">${t.e}</div>
      <div class="inf"><div class="en">${esc(p[0])}</div><div class="zh">${esc(p[1])}</div></div>
      <button class="spk" data-spk="${esc(p[0])}">🔊</button>
      <button class="fav ${isFav?'on':''}" data-tfav="${key}">${isFav?'❤️':'🤍'}</button></div>`;}).join('')}`;
  });
  return out||'<div class="empty">收藏夹还空着，遇到常用句点 ❤️ 收进来吧</div>';
}
function bindEn(){
  document.querySelectorAll('.sssCard').forEach(c=>c.onclick=()=>{c.classList.toggle('open');});
  document.querySelectorAll('.sssCard .ply').forEach(b=>b.onclick=ev=>{ev.stopPropagation();speak(SSS[+b.dataset.ply][4]);});
  document.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>speak(b.dataset.spk));
  document.querySelectorAll('.abc').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.abc').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    const L=c.dataset.a,W=c.dataset.w;
    speak(`${L}. ${L} is for ${W}. ${W}`);
  });
  document.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-wt]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    document.getElementById('wordList').innerHTML=wordListHtml(+b.dataset.wt);bindWords();
  });
  bindWords();
  document.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-tk]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    document.getElementById('talkList').innerHTML=talkListHtml(+b.dataset.tk,false);bindTalk();
  });
  const tf=document.getElementById('talkFavBtn');
  if(tf)tf.onclick=()=>{const cur=document.getElementById('talkList');cur.innerHTML=talkListHtml(-1,true);bindTalk();document.querySelectorAll('[data-tk]').forEach(x=>x.classList.remove('on'));};
  bindTalk();
}
function bindWords(){
  document.querySelectorAll('.word').forEach(w=>w.onclick=ev=>{
    if(ev.target.closest('[data-wok]')){toggleWordOk(ev.target.closest('[data-wok]').dataset.wok);return;}
    speak(w.dataset.wspk);
  });
}
function toggleWordOk(key){
  const ok=S.wordsOk=S.wordsOk||[];
  const i=ok.indexOf(key);
  if(i>=0)ok.splice(i,1);else ok.push(key);
  save();render();
}
function bindTalk(){
  document.querySelectorAll('[data-tfav]').forEach(b=>b.onclick=()=>{
    const fav=S.talkFav=S.talkFav||[];
    const key=b.dataset.tfav,i=fav.indexOf(key);
    if(i>=0)fav.splice(i,1);else fav.push(key);
    save();render();
  });
}

const BILL_CATS=['奶粉','尿不湿','衣物','玩具','辅食','零食','医疗','鞋','其他'];
const CAT_COLOR={'奶粉':'#FFE3E7','尿不湿':'#E4F4E0','衣物':'#FFEBDD','玩具':'#E5EBFF','辅食':'#FFF3D1','零食':'#FFF6D8','医疗':'#E8E5FA','鞋':'#E0F2F1','其他':'#EDEDED'};

function billMoney(b){return (+b.price)||0;} // 价格为总价，统计直接用，不再乘数量
function billUnitPrice(b){const q=(+b.qty);if(!q)return null;return billMoney(b)/q;} // 单价 = 总价 ÷ 数量；未填数量则不算单价

/* ── 「+记一笔」智能识别：输入一句“买了什么”自动填名称/分类/总价/数量/单位 ── */
const BILL_UNITS='包|罐|瓶|件|箱|盒|双|个|袋|支|条|套|组|斤|千克|公斤|筒|捆|片';
const BILL_CAT_KEYS=[
  ['尿不湿',['纸尿裤','尿不湿','尿布','拉拉裤','尿裤','裤型']],
  ['医疗',['药','维生素','钙片','D3','退烧','益生菌','蒙脱石','口罩','棉签','体温计','疫苗','雾化','创可贴','纱布']],
  ['辅食',['米粉','面条','粥','肉泥','菜泥','鱼泥','鳕鱼','碎面','粒粒面','果泥','辅食油']],
  ['零食',['饼干','磨牙棒','溶豆','泡芙','米饼','虾条','山楂','薯片','酸奶','奶酪棒']],
  ['奶粉',['奶粉','配方奶','一段','二段','三段','羊奶粉']],
  ['衣物',['衣服','上衣','裤子','袜子','裙子','T恤','卫衣','外套','睡衣','打底','套装','连体衣']],
  ['鞋',['鞋','凉鞋','运动鞋','帆布鞋','靴','拖鞋','学步鞋','机能鞋']],
  ['玩具',['玩具','积木','小车','汽车','娃娃','玩偶','绘本','书','拼图','球','乐高','摇铃']]
];
function detectBillCat(txt){
  for(let i=0;i<BILL_CAT_KEYS.length;i++){const c=BILL_CAT_KEYS[i][0],ks=BILL_CAT_KEYS[i][1];for(const k of ks){if(txt.indexOf(k)>=0)return c;}}
  return '';
}
function parsePrice(txt,qty){
  let m=txt.match(/[¥￥]\s*(\d+(?:\.\d+)?)/);if(m)return +m[1];
  m=txt.match(/(\d+(?:\.\d+)?)\s*(?:块钱|块|元)/);if(m)return +m[1];
  // 无“元/块”时：取剩下的独立数字里最大者当价格（避开数量那个数）
  const ms=(txt.match(/\d+(?:\.\d+)?/g)||[]);let best=null;
  for(const x of ms){const v=+x;if(qty!==null&&v===qty)continue;if(best===null||v>best)best=v;}
  return best;
}
function cnN(s){const m1={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  if(!s)return null;if(s==='十')return 10;if(s.startsWith('十'))return 10+(m1[s[1]]||0);
  const t=s.indexOf('十');if(t>=0)return (m1[s[t-1]]||1)*10+(t+1<s.length?(m1[s[t+1]]||0):0);
  return m1[s]||null;}
function parseQtyUnit(txt){
  let m=txt.match(new RegExp('(\\d+)\\s*('+BILL_UNITS+')'));
  if(m)return {qty:+m[1],unit:m[2]};
  m=txt.match(new RegExp('([一二两三四五六七八九十]+)\\s*('+BILL_UNITS+')'));
  if(m){const q=cnN(m[1]);if(q)return {qty:q,unit:m[2]};}
  return {qty:null,unit:''};
}
function parseBillName(txt){
  let s=txt||'';
  s=s.replace(/[¥￥]\s*\d+(\.\d+)?/g,' ');
  s=s.replace(/\d+(\.\d+)?\s*(?:块钱|块|元)/g,' ');
  s=s.replace(new RegExp('(?:\\d+|[一二两三四五六七八九十]+)\\s*(?:'+BILL_UNITS+')','g'),' ');
  s=s.replace(/花了|一共|总共|买了|给我|给宝宝|给宝宝买|买|价格|大概|的|是|，|。|,|\./g,' ');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}
function parseBill(txt){
  const s=(txt||'').trim();
  const p=parseQtyUnit(s);
  return {cat:detectBillCat(s),name:parseBillName(s),price:parsePrice(s,p.qty),qty:p.qty,unit:p.unit};
}

function openGrowthChart(type,label,color){
  const recs=S.growth.filter(x=>x.type===type).sort((a,b)=>a.date.localeCompare(b.date));
  if(!recs.length){toast('暂无'+label+'记录');return;}
  const w=340,h=240,pad=30,padB=42;
  let pts='',dots='',lbl='',dlbl='';
  if(recs.length<2){
    showSheet(`📈 ${label}趋势图`,`<div class="empty" style="padding:30px;">记录 ≥2 条才能显示趋势曲线<br><br>当前只有 ${recs.length} 条记录</div>`);
    return;
  }
  const vals=recs.map(r=>r.v),min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1;
  const X=i=>pad+(w-2*pad)*i/(recs.length-1),Y=v=>h-padB-(h-padB-pad)*(v-min)/rg;
  recs.forEach((r,i)=>{const x=X(i),y=Y(r.v);pts+=`${x},${y} `;dots+=`<circle cx="${x}" cy="${y}" r="4" fill="${color}"/>`;lbl+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="11" fill="${color}" font-weight="700">${r.v}</text>`;dlbl+=`<text x="${x}" y="${h-padB+16}" text-anchor="middle" font-size="10" fill="#888">${r.date}</text>`;});
  showSheet(`📈 ${label}趋势图（${recs.length}条记录）`,`<svg width="100%" viewBox="0 0 340 240"><line x1="${pad}" y1="${h-padB}" x2="${w-pad}" y2="${h-padB}" stroke="#F0EAE3"/>${dlbl}<polyline points="${pts.trim()}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbl}</svg><div style="text-align:center;margin-top:10px;font-size:13px;color:#999;">横轴为记录日期 · 点击「成长记录」可编辑</div>`);
}

function bindPhotoWall(){
  // 照片墙：上传 / 上一张 / 下一张 / 随机 / 删除 / 清空
  const add=document.getElementById('phAdd');
  if(add)add.onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const MAX=640;
          let w=img.width,h=img.height;
          if(Math.max(w,h)>MAX){const sc=MAX/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          const data=c.toDataURL('image/jpeg',0.6);
          if((S.photos||[]).length>=30){toast('照片已达30张上限，可删除旧照片');return;}
          S.photos=S.photos||[];S.photos.push(data);S.photoCur=S.photos.length-1;
          save();render();
        };
        img.onerror=()=>toast('图片读取失败，请重试');
        img.src=ev.target.result;
      };
      r.readAsDataURL(f);
    };
    inp.click();
  };
  const prev=document.getElementById('phPrev');
  if(prev)prev.onclick=()=>{const n=(S.photos||[]).length;if(!n)return;S.photoCur=((S.photoCur||0)-1+n)%n;save();render();};
  const next=document.getElementById('phNext');
  if(next)next.onclick=()=>{const n=(S.photos||[]).length;if(!n)return;S.photoCur=((S.photoCur||0)+1)%n;save();render();};
  const rnd=document.getElementById('phRandom');
  if(rnd)rnd.onclick=()=>{const n=(S.photos||[]).length;if(!n)return;S.photoCur=Math.floor(Math.random()*n);save();render();};
  const del=document.getElementById('phDel');
  if(del)del.onclick=()=>{const n=(S.photos||[]).length;if(!n)return;if(!confirm('删除当前这张照片？'))return;S.photos.splice((S.photoCur||0),1);if(!S.photos.length)S.photoCur=-1;else S.photoCur%=S.photos.length;save();render();};
  const clr=document.getElementById('phClear');
  if(clr)clr.onclick=()=>{const n=(S.photos||[]).length;if(!n)return;if(!confirm('确认清空全部照片？此操作不可恢复'))return;S.photos=[];S.photoCur=-1;save();render();};
}

function curWsvg(){return document.getElementById('wsvgFull')||document.getElementById('wsvg');}
function setSpinBtns(goDis,stopDis){
  document.querySelectorAll('.sp-go').forEach(b=>b.disabled=goDis);
  document.querySelectorAll('.sp-stop').forEach(b=>b.disabled=stopDis);
}
function spinGo(){
  if(spinning)return;
  const base=baseWheelKeys(),recs=S.recipes||[];
  if(!base.length&&!recs.length){toast('菜都被排除光啦～去调整「🚫 我不想吃」或排敏记录');return;}
  buildWheelForSpin();
  if(!S.wheel.length)S.wheel=recs.map(r=>'r'+r.id).concat(recs.map(r=>'r'+r.id));
  document.querySelectorAll('#wsvg,#wsvgFull').forEach(s=>{if(s)s.innerHTML=wheelSvg();});
  spinning=true;
  setSpinBtns(true,false);
  spd=7.5+Math.random()*2.5;
  wheelLoop();
}
function wheelLoop(){
  spinRot=(spinRot+spd)%360;
  const svg=curWsvg();
  if(svg)svg.style.transform=`rotate(${spinRot}deg)`;
  animId=requestAnimationFrame(spinning?wheelLoop:wheelDecel);
}
function wheelDecel(){
  spd*=.978;
  spinRot=(spinRot+spd)%360;
  const svg=curWsvg();
  if(svg)svg.style.transform=`rotate(${spinRot}deg)`;
  if(spd>.25){animId=requestAnimationFrame(wheelDecel);}
  else{spinStop();}
}
function spinStop(){
  spinning=false;
  cancelAnimationFrame(animId);
  // 指针固定在屏幕顶部（转盘本地坐标 -90°）；转盘旋转 spinRot 后，
  // 指针指向的本地角度 = (360 - spinRot%360) % 360，扇区 i 起点 = i*per-90
  const n=Math.max(1,S.wheel.length);
  const q=(360-spinRot%360)%360;
  spinIdx=Math.floor(q/(360/n))%n;
  setSpinBtns(false,true);
  const card=document.getElementById('menuCard');
  if(card){
    card.innerHTML=menuCardHtml(curKey());
    const en=card.querySelector('#eatNow');
    if(en)en.onclick=()=>{const m=menuById(curKey());if(m)openFoodRec(m);};
    const lv=card.querySelector('#loveMenu');
    if(lv)lv.onclick=loveCurrent;
  }
  // 同步刷新全屏转盘结果卡片
  const fcard=document.getElementById('menuCardFull');
  if(fcard){
    fcard.innerHTML=menuCardHtml(curKey());
    const en2=fcard.querySelector('#eatNow');
    if(en2)en2.onclick=()=>{const m=menuById(curKey());if(m)openFoodRec(m);};
    const lv2=fcard.querySelector('#loveMenu');
    if(lv2)lv2.onclick=loveCurrent;
    // 手机屏内容较长时，自动滑到结果卡片，方便直接查看菜单
    try{fcard.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
  }
  const svg=curWsvg();
  if(svg)svg.innerHTML=wheelSvg();
}

function isMobileUA(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);}
function isStandaloneApp(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function showA2HS(){
  if(!isMobileUA()||isStandaloneApp())return;
  let done='0';try{done=localStorage.getItem(P+'a2hs_done')||'0';}catch(_){}
  if(done==='1')return;
  let last=0;try{last=+localStorage.getItem(P+'a2hs_hide')||0;}catch(_){}
  if(Date.now()-last<7*864e5)return;
  if(document.getElementById('a2hs'))return;
  const isWX=/MicroMessenger/i.test(navigator.userAgent);
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const w=document.createElement('div');
  w.id='a2hs';w.className='a2hs';
  w.innerHTML=`<div class="a2hs-ic">🌱</div>
    <div class="a2hs-tx"><b>加到手机桌面</b><span>像 App 一样全屏打开，不占聊天窗口</span></div>
    <button class="a2hs-btn" id="a2hsBtn" ${isWX?'data-wx="1"':''}>${isWX?'查看方法':'一键添加'}</button>
    <div class="a2hs-x" id="a2hsX" title="关闭">✕</div>`;
  document.body.appendChild(w);
  requestAnimationFrame(()=>{w.classList.add('show');});
  document.getElementById('a2hsX').onclick=()=>hideA2HS(true);
  document.getElementById('a2hsBtn').onclick=async()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      const ch=await deferredInstallPrompt.userChoice.catch(()=>null);
      deferredInstallPrompt=null;
      if(ch&&ch.outcome==='dismissed')hideA2HS(true);

  U.skill = function (db, id, p) { return db.updateRecord({ databaseId: 'JBmyGc2XOguHIA1oU31Zt2', recordId: id, properties: p }); };
  DL.skill = function (db, id) { return db.deleteRecord({ databaseId: 'JBmyGc2XOguHIA1oU31Zt2', recordId: id }); };

  /* 分页读全表（hasMore/nextCursor 循环，上限 2500 行） */
  function qAll(tk) {
    var db = sdk();
    var rows = [];
    function page(cur) {
      return Q[tk](db, cur).then(function (res) {
        ((res && res.results) || []).forEach(function (r) { rows.push(r); });
        if (res && res.hasMore && res.nextCursor && rows.length < 2500) { return page(res.nextCursor); }
        return rows;
      });
    }
    return page(null);
  }

  /* 行 → oneof 属性（列有值才写；rid/updatedAt 恒写） */
  function serializeRow(tk, rid, c, now) {
    var props = { rid: { text: rid }, updatedAt: { number: now } };
    Object.keys(TABS[tk].cols).forEach(function (col) {
      var v = c[col];
      if (v === undefined || v === null) { return; }
      var t = TABS[tk].cols[col];
      if (t === 'n') { props[col] = { number: Number(v) }; }
      else if (t === 'c') { props[col] = { checkbox: !!v }; }
      else { props[col] = { text: String(v) }; }
    });
    return props;
  }

  function applyToState(rowsByTk) {
    Object.keys(rowsByTk).forEach(function (tk) { APPLY[tk](S, rowsByTk[tk]); });
    try { buildWheel(); } catch (e) {}
    try { _rawSave(); } catch (e) {} /* 原写法引用的是 init() 内的局部变量，必然抛错被吞 → 同步结果没落盘 */
    try { render(); } catch (e) {}
    try { if (canWrite()) { toast(window.__HB_LANG === 'en' ? '☁️ Synced from Library' : '☁️ 已从资料库同步最新数据'); } } catch (e) {}
  }

  /* ---------- doPull：7 表并行拉取 → 行级对账 → 应用 ---------- */
  function doPull() {
    var rawStart = jobj(S);
    var snap = cfgLoad().snap || {};
    var localMaps = {};
    TAB_KEYS.forEach(function (tk) {
      var m = {};
      EXTRACT[tk](S).forEach(function (r) { r.hash = recHash(r); m[r.rid] = r; });
      localMaps[tk] = m;
    });
    return Promise.all(TAB_KEYS.map(function (tk) { return qAll(tk).catch(function () { return null; }); }))
      .then(function (cloudList) {
        var toApply = [], newSnap = {};
        var _ro = !canWrite(); /* 只读访客：本机不是权威副本，本地改动不做保留，一律以云端为准 */
        TAB_KEYS.forEach(function (tk, i) {
          var cl = cloudList[i];
          if (!cl) { if (snap[tk]) { newSnap[tk] = snap[tk]; } return; }
          var loc = localMaps[tk];
          var s = snap[tk] || null;
          var eff = s;
          if (!eff) { eff = {}; Object.keys(loc).forEach(function (rid) { eff[rid] = loc[rid].hash; }); }
          var cloud = {};
          cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
          var merged = {}, changed = false;
          Object.keys(loc).forEach(function (rid) { merged[rid] = loc[rid].c; });
          Object.keys(cloud).forEach(function (rid) {
            var cc = rowCols(tk, cloud[rid]);
            var lr = loc[rid];
            if (lr) {
              if (sameContent(lr.c, cc)) { return; }
              if (_ro || lr.hash === eff[rid]) { merged[rid] = cc; changed = true; }
            } else if (!eff[rid]) { merged[rid] = cc; changed = true; }
          });
          if (s) {
            Object.keys(s).forEach(function (rid) {
              if (cloud[rid]) { return; }
              if (loc[rid] && loc[rid].hash === s[rid] && merged[rid]) { delete merged[rid]; changed = true; }
            });
          }
          if (!s) {
            /* 首访（本机无任何同步基线）：云端该表已有数据时以云端为准，丢弃本机未经云端确认的行。
               页面首次打开会 seed 一份内置示例，其 rid 与云端不一致，不校准会与云端数据叠加成「两份」。
               云端为空时保留本机数据仅作本地展示（基线在下方统一登记，不会产生写请求）。 */
            if (Object.keys(cloud).length) {
              merged = {};
              Object.keys(cloud).forEach(function (rid) { merged[rid] = rowCols(tk, cloud[rid]); });
              changed = true;
            }
          }
          if (changed) { toApply.push({ tk: tk, rows: Object.keys(merged).map(function (rid) { return { rid: rid, c: merged[rid] }; }) }); }
        });
        /* 应用前校验：拉取期间用户改过本机数据 → 本轮放弃，下个周期重来 */
        if (toApply.length && jobj(S) !== rawStart) { return false; }
        if (toApply.length) {
          var byTk = {};
          toApply.forEach(function (a) { byTk[a.tk] = a.rows; });
          applyToState(byTk);
        }
        /* 基线一律以「应用之后本机实际内容」为准，而不是以云端行原样为准：
           云端行常常缺列（如用品表没有「价格历史」、档案表只有 4 列），本机 EXTRACT 会补齐默认列，
           若拿云端行算基线就会永远对不上 → 每轮都判定「有待推送改动」→ 首访即发写请求
           （无写权环境下就是 401 → 发布壳跳登录页）。 */
        TAB_KEYS.forEach(function (tk) {
          var m = {};
          EXTRACT[tk](S).forEach(function (r) { m[r.rid] = recHash(r); });
          newSnap[tk] = m;
        });
        var c = cfgLoad();
        c.snap = newSnap;
        cfgSave(c);
        return toApply.length > 0;
      });
  }

  /* ---------- doPush：逐表最小化 upsert + 删除传播 ---------- */
  function doPush() {
    var db = sdk();
    var snap = cfgLoad().snap || {};
    var now = Date.now();
    var allOk = true;
    var jobs = TAB_KEYS.map(function (tk) {
      var rows = [];
      EXTRACT[tk](S).forEach(function (r) { r.hash = recHash(r); rows.push(r); });
      var localH = {};
      rows.forEach(function (r) { localH[r.rid] = r.hash; });
      var snapT = snap[tk] || null;
      if (snapT && sameSnap(snapT, localH)) { return Promise.resolve('skip'); }
      return qAll(tk).then(function (cl) {
        var cloud = {};
        cl.forEach(function (r) { var rid = pv(r.rid); if (rid) { cloud[rid] = r; } });
        var ops = [], confirmed = {};
        rows.forEach(function (row) {
          var cr = cloud[row.rid];
          if (cr) {
            if (sameContent(row.c, rowCols(tk, cr))) { confirmed[row.rid] = true; return; }
            if (snapT && snapT[row.rid] && row.hash === snapT[row.rid]) { return; } /* 拉取滞后，不覆盖云端新值 */
          }
          var props = serializeRow(tk, row.rid, row.c, now);
          var op;
          if (cr && pv(cr._id)) {
            var sysid = pv(cr._id);
            op = U[tk](db, sysid, props).then(function () { return true; }, function () {
              return A[tk](db, props).then(function () { return true; }, function () { return false; });
            });
          } else {
            op = A[tk](db, props).then(function () { return true; }, function () { return false; });
          }
          ops.push(op.then(function (ok) { if (ok) { confirmed[row.rid] = true; } else { allOk = false; } }));
        });
        Object.keys(cloud).forEach(function (rid) {
          if (localH[rid]) { return; }
          if (!snapT || !snapT[rid]) { return; } /* 不是本机删的，不动 */
          var sysid = pv(cloud[rid]._id);
          if (!sysid) { return; }
          ops.push(DL[tk](db, sysid).then(function () { return true; }, function () { return false; }).then(function (ok) { if (!ok) { allOk = false; } }));
        });
        return Promise.all(ops).then(function () {
          var t = {};
          Object.keys(confirmed).forEach(function (rid) { t[rid] = localH[rid]; });
          return t;
        });
      }).catch(function () { allOk = false; return null; });
    });
    return Promise.all(jobs).then(function (results) {
      if (!allOk) { _denied = true; return false; } /* 写被拒 → 本会话降级只读，不再重复撞权限 */
      var c = cfgLoad();
      var newSnap = c.snap || {};
      results.forEach(function (t, i) { if (t && t !== 'skip') { newSnap[TAB_KEYS[i]] = t; } });
      c.snap = newSnap;
      c.lastTs = now;
      cfgSave(c);
      return true;
    });
  }

  function hasPending() {
    var snap = cfgLoad().snap || {};
    for (var i = 0; i < TAB_KEYS.length; i++) {
      var tk = TAB_KEYS[i];
      var m = {};
      EXTRACT[tk](S).forEach(function (r) { m[r.rid] = recHash(r); });
      if (!sameSnap(snap[tk], m)) { return true; }
    }
    return false;
  }

  function pull() {
    if (!online() || _syncing) { return Promise.resolve(false); }
    _syncing = true;
    setStatus('syncing');
    var failed = false;
    return Promise.resolve().then(function () { return doPull(); })
      .catch(function () { failed = true; /* 离线 / 网络失败静默 */ })
      .then(function (applied) {
        _syncing = false;
        setStatus(failed ? 'failed' : (canWrite() ? 'synced' : 'readonly'));
        if (canWrite() && hasPending()) { try { push(); } catch (e) {} }
        return !!applied;
      });
  }

  function push() {
    if (!online() || _syncing || !canWrite()) { return Promise.resolve(); }
    _syncing = true;
    return Promise.resolve().then(function () { return doPush(); })
      .catch(function () { /* 静默重试 */ })
      .then(function (ok) {
        _syncing = false;
        if (ok === true) { markWrote(); setStatus('synced'); }
        else if (ok === false) { setStatus(canWrite() ? 'failed' : 'readonly'); }
      });
  }

  function schedule() {
    if (!online() || _syncing) { return; }
    if (!canWrite()) { readonlyHint(); return; }
    if (_timer) { clearTimeout(_timer); }
    _timer = setTimeout(function () { try { push(); } catch (e) {} }, 1200);
  }

  /* ---------- 页面 → 主表绑定标注（写 DOM 时同步 setAttribute） ---------- */
  var PAGE_DB = { health: 'growth', daily: 'profile', game: 'chk', sup: 'sup' };
  function markBinding(p) {
    try {
      var tk = PAGE_DB[p];
      var el = document.getElementById('main');
      if (tk && el) {
        el.setAttribute('data-sp-bindable', 'database');
        el.setAttribute('data-sp-database-id', IDS[tk]);
      }
    } catch (e) {}
  }

  /* ---------- 初始化：包一层 save → 防抖推送；拉取 + 订阅 ---------- */
  function init() {
    try {
      ensureUI();
      if (!online()) { setStatus('local'); return; } /* 本地直开：无 SDK，整层停用 */
      setStatus(canWrite() ? 'syncing' : 'readonly');
      var origRender = render;
      render = function () { try { markBinding(page); } catch (e) {} return origRender(); };
      var origSave = save;
      save = function () {
        origSave();
        try {
          if (!canWrite()) { readonlyHint(); return; }
          schedule();
        } catch (e) {}
      };
      /* 主脚本 init 挂在 DOMContentLoaded（晚于本层执行），等 S 就绪后再首拉 */
      var bootTries = 100;
      function bootPull() {
        if (typeof S !== 'undefined' && S && S.seed !== undefined) { pull().catch(function () {}); }
        else if (bootTries-- > 0) { setTimeout(bootPull, 100); }
      }
      setTimeout(bootPull, 80);
      setInterval(function () { try { pull(); } catch (e) {} }, 30000);
      var db0 = sdk();
      if (db0 && typeof db0.onUpdated === 'function') {
        db0.onUpdated(function () {
          if (_pullTimer) { clearTimeout(_pullTimer); }
          _pullTimer = setTimeout(function () { try { pull(); } catch (e) {} }, 300);
        });
      }
    } catch (e) { /* 同步层任何异常不影响页面功能 */ }
  }

  init();
})();
</script>
