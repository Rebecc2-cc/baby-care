<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>健康宝宝早教喂养台</title>
<style>
  :root{
    --pri:#FF7BA9;--pri-d:#F2508E;--green:#69C477;--green-d:#3FA85B;
    --bg:#FFF7F4;--card:#fff;--text:#3A2E3A;--muted:#9D8D9D;--line:#FBE6EE;
    --gross:#FF6B6B;--fine:#FFB84D;--cog:#5BC8E8;--lang:#9B7BE8;--soc:#F27BB0;
    --priGrad:linear-gradient(135deg,#FF9DC0,#FF6BA9);
    --r:18px;--sh:0 6px 18px rgba(242,80,142,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  svg{display:block;}
  .topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .logo{font-weight:900;font-size:19px;color:var(--pri-d);display:flex;align-items:center;gap:6px;margin-right:auto;}
  .logo svg{width:26px;height:26px;}
  .babyinfo{display:flex;align-items:center;gap:7px;font-size:13px;color:#777;background:#FFF4EC;border-radius:99px;padding:4px 12px 4px 5px;font-weight:600;cursor:pointer;}
  .babyinfo .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#FFD9A8,#FFB37E);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;flex-shrink:0;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.12);}
  .babyinfo .av img{width:100%;height:100%;object-fit:cover;}
  .tbtn{min-height:40px;padding:0 11px;border:none;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--text);}
  .tbtn svg{width:16px;height:16px;}
  .tbtn.warn{color:#E5484D;}
  .learnHead{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .layout{display:flex;min-height:calc(100vh - 58px);overflow-x:hidden;}
  .side{width:232px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:12px 10px;}
  .side .nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px;}
  .side .nav a{display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:16px;color:#4A3A4A;text-decoration:none;font-weight:800;font-size:19px;cursor:pointer;transition:background .15s;border:1px solid transparent;}
  .side .nav a .nicon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:transform .15s;}
  .side .nav a:hover .nicon{transform:scale(1.1);}
  .side .nav a.on{background:var(--priGrad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(242,80,142,.4);}
  .side .nav a.on .nicon{transform:scale(1.12);box-shadow:0 2px 10px rgba(255,107,169,.5);}
  .main{flex:1;padding:18px 20px 80px;max-width:1060px;overflow-x:hidden;}
  .banner{display:flex;align-items:center;gap:8px;background:#FFF3D6;color:#9A6A16;border-radius:13px;padding:10px 14px;font-size:14px;font-weight:600;margin:0 0 14px;}
  .banner.danger{background:#FFEDED;color:#C53030;}
  .sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 16px;}
  .sec h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px;}
  .sec h2 svg{width:24px;height:24px;color:var(--pri-d);}
  .sec .sub{color:var(--muted);font-size:15px;margin:0 0 12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{min-height:48px;padding:0 18px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn svg{width:17px;height:17px;}
  .btn.p{background:var(--priGrad);color:#fff;box-shadow:var(--sh);}
  .btn.g{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn.gn{background:var(--green);color:#fff;}
  .btn.block{width:100%;}
  .btn.sm{min-height:36px;font-size:13.5px;padding:0 11px;}
  .btn.warn{color:#E5484D;}
  .grid{display:grid;gap:10px;}
  .grid.c2{grid-template-columns:1fr 1fr;}
  .grid.c3{grid-template-columns:repeat(3,1fr);}
  .stat{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh);}
  .stat .n{font-size:26px;font-weight:800;color:var(--pri-d);}
  .stat .l{font-size:14.5px;color:var(--muted);}
  .catwrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .catwrap .billcat{flex:1 1 46%;min-width:150px;display:flex;align-items:center;gap:9px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);}
  .catwrap .cn,#billList .cn{font-weight:800;font-size:13px;padding:3px 10px;border-radius:9px;white-space:nowrap;color:#6b5a45;}
  .catwrap .cnt{font-size:13px;color:#999;flex:1;}
  .catwrap .amt{font-size:17px;font-weight:800;color:#333;}
  .catEmpty{background:#FFFBF0;border:1px dashed #F0CF8C;color:#B0893C;border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px;text-align:center;}
  .hint{font-size:14px;color:#999;text-align:center;margin:12px 0 0;}
  input,select,textarea{width:100%;font-size:17px;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font-family:inherit;}
  textarea{resize:vertical;min-height:52px;}
  label.fld{display:block;font-size:15px;color:#777;margin:10px 0 4px;font-weight:600;}
  .item{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:var(--sh);}
  .item .top{display:flex;align-items:center;gap:8px;}
  .item .nm{font-weight:700;font-size:17px;}
  .item .dt{color:var(--muted);font-size:13.5px;margin-left:auto;}
  .item .nt{font-size:15px;color:#666;margin-top:6px;}
  .empty{text-align:center;color:var(--muted);padding:22px;font-size:16px;}
  .muted{color:var(--muted);font-size:15px;}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:#fff;}
  .badge.gross{background:var(--gross);}.badge.fine{background:var(--fine);}.badge.cog{background:var(--cog);}.badge.lang{background:var(--lang);}.badge.soc{background:var(--soc);}
  .chip{background:#FFF0E2;color:var(--pri-d);border-radius:9px;padding:3px 9px;font-size:12.5px;font-weight:600;}
  .chip.blue{background:#E8F4FC;color:#2E7DB0;}
  .plantwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .plant{flex:0 0 auto;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
  .plant svg{width:210px;height:230px;margin:0 auto;overflow:visible;}
  .plant .sprout{transform-origin:50% 100%;animation:sproutSway 3.2s ease-in-out infinite;}
  @keyframes sproutSway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  .plant.bounce .sprout{animation:sproutBounce .7s ease;}
  @keyframes sproutBounce{0%{transform:translateY(0) rotate(-2.2deg)}30%{transform:translateY(-16px) rotate(3deg)}55%{transform:translateY(0) rotate(-2.2deg)}75%{transform:translateY(-7px) rotate(2deg)}100%{transform:translateY(0) rotate(-2.2deg)}}
  .plant .bubble{position:relative;background:#fff;border:2px solid #FFE0A8;border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;color:#B2693C;display:none;margin:0 auto 6px;width:max-content;max-width:200px;box-shadow:0 3px 10px rgba(255,180,90,.25);}
  .plant .bubble.show{display:block;animation:bubblePop .35s ease;}
  .plant .bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#FFE0A8;}
  @keyframes bubblePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .plant .lv{font-weight:700;color:#8A6A4A;font-size:13.5px;margin-top:4px;background:#FFF9EF;border:1px dashed #EED9B8;border-radius:99px;padding:4px 12px;display:inline-block;}
  .plant .agechip{font-size:11.5px;color:#fff;background:linear-gradient(145deg,#FFB37E,#FF8A5B);border-radius:99px;padding:2px 9px;font-weight:700;margin-top:5px;display:inline-block;}
  .plantbtns{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .carebtn{min-height:46px;min-width:86px;border:none;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .carebtn svg{width:16px;height:16px;}
  .carebtn.w{background:#EAF7FF;color:#2E7DB0;}
  .carebtn.s{background:#FFF3D6;color:#C98A1B;}
  .carebtn.done{filter:grayscale(1);opacity:.55;cursor:default;}
  .lv{font-size:13px;color:var(--green-d);font-weight:700;margin-top:6px;}
  .starnode{display:inline-flex;align-items:center;gap:6px;border:none;background:#FFF7EF;border:1.5px solid #FFD9BC;border-radius:13px;padding:8px 10px;cursor:pointer;font-size:13.5px;font-weight:700;color:#7A5B3F;}
  .starnode svg{width:20px;height:20px;}
  .starnode.done{background:linear-gradient(135deg,#FFF3B8,#FFE08A);border-color:#FFC53D;color:#7A5200;}
  .wall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 0;}
  .wall .w{width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFB300;background:#FFF7E6;border-radius:50%;box-shadow:0 2px 7px rgba(255,179,0,.28);transition:transform .15s;}
  .wall .w svg{width:26px;height:26px;}
  .wall .w:hover,.wall .w:active{transform:scale(1.15);}
  .wall .w{background:linear-gradient(160deg,#FFFDF0,#FFF6D6);border:1px solid #F5E3A8;border-radius:14px;padding:10px;text-align:center;}
  .wall .w svg{width:34px;height:34px;margin:0 auto 4px;color:#F5B700;}
  .wall .w .n{font-size:13px;font-weight:700;}
  .wall .w .d{font-size:11.5px;color:#A0883C;margin-top:2px;}
  .wheelbox{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .wheel{position:relative;width:min(100%,400px);aspect-ratio:1/1;cursor:pointer;touch-action:manipulation;}
  .wheel .pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 3px 5px rgba(240,110,160,.4));}
  .wheel svg#wsvg{width:100%;height:100%;will-change:transform;}
  .wheel .center{position:absolute;inset:0;margin:auto;width:104px;height:104px;border-radius:50%;background:#fff;border:5px solid #FFD6E3;box-shadow:0 6px 20px rgba(150,180,230,.35);z-index:6;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:auto;cursor:pointer;}
  .wheel .center svg{width:92%;height:92%;}
  .wheelbtns{display:flex;gap:14px;}
  .wheelbtns button{min-height:46px;padding:0 26px;border:none;border-radius:99px;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.13);transition:transform .15s,opacity .2s;touch-action:manipulation;white-space:nowrap;}
  .wheelbtns button:active{transform:scale(.94);}
  .wheelbtns .sp-go{background:linear-gradient(135deg,#FF9DC0,#FF6BA9);color:#fff;}
  .wheelbtns .sp-stop{background:linear-gradient(135deg,#9DC4FF,#6BA0F0);color:#fff;}
  .sp-full{margin-top:2px;border:1px solid var(--line);background:#fff;color:#FF6BA9;font-weight:700;font-size:13.5px;border-radius:99px;padding:8px 16px;cursor:pointer;}
  .wheelmask{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  #wheelFullMask .wfcnt{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:640px;}
  #wallFullMask{justify-content:flex-start;}
  #wallFullMask{justify-content:safe center;}
  .wheelmask .wheel{width:min(100%,460px);aspect-ratio:1/1;flex-shrink:0;}
  .wheelmask .sp-go,.wheelmask .sp-stop{min-height:50px;padding:0 30px;font-size:16px;white-space:nowrap;flex-shrink:0;}
  .wheelmask .menuCard{flex-shrink:0;}
  .wheelfullbar{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:82;}
  .wallfull{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:680px;max-height:72vh;overflow-y:auto;padding:6px 2px;}
  .wfstar{width:90px;padding:12px 8px;text-align:center;background:#FAFAFA;border:1px solid #EEE;border-radius:14px;cursor:pointer;color:#cfcfcf;transition:transform .15s;}
  .wfstar svg{width:34px;height:34px;color:#DADADA;}
  .wfstar .n{font-size:12px;font-weight:700;margin-top:4px;color:#777;line-height:1.2;}
  .wfstar .d{font-size:11px;margin-top:2px;color:#A0883C;}
  .wfstar.done{color:#F5B700;background:linear-gradient(160deg,#FFFDF0,#FFF6D6);border-color:#F5D66A;box-shadow:0 2px 8px rgba(255,179,0,.22);}
  .wfstar.done svg{color:#F5B700;}
  .wfstar:active{transform:scale(.94);}
  .wfallEdit{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;display:flex;align-items:center;justify-content:center;padding:24px;animation:up .18s ease;}
  /* 添加到桌面引导横幅 */
  .a2hs{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 32px rgba(0,0,0,.22);transform:translateY(130%);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s;}
  .a2hs.show{transform:translateY(0);opacity:1;}
  .a2hs-ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#FFEFD6,#FFD9A8);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;}
  .a2hs-tx{flex:1;min-width:0;}
  .a2hs-tx b{display:block;font-size:14.5px;color:#3B3B3B;}
  .a2hs-tx span{display:block;font-size:12px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .a2hs-btn{flex:none;border:none;background:linear-gradient(135deg,#FFB84D,#FF9F2E);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:999px;cursor:pointer;box-shadow:0 4px 10px rgba(255,159,46,.35);}
  .a2hs-btn:active{transform:scale(.94);}
  .a2hs-x{flex:none;color:#BBB;font-size:15px;padding:6px;cursor:pointer;}
  .wheelbtns button:disabled{opacity:.45;cursor:not-allowed;}
  .menuCard{width:100%;max-width:560px;background:linear-gradient(150deg,#FFF6FB,#F2F7FF);border:1.5px solid #FFD6E3;border-radius:18px;padding:16px;}
  .menuCard .pf{display:flex;align-items:flex-start;gap:8px;margin:3px 0;font-size:14px;color:#555;}
  .menuCard .ptag{flex-shrink:0;font-size:11.5px;font-weight:800;color:#fff;background:#FF8FB8;border-radius:7px;padding:2px 7px;margin-top:1px;}
  .planDay{background:linear-gradient(150deg,#FFF6FB,#F0F6FF);border:1.5px solid #FFD6E3;border-radius:18px;padding:16px;}
  .planDay .pd{font-size:15.5px;font-weight:900;color:#D75B8E;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .mealRow{display:flex;gap:10px;margin:8px 0;align-items:flex-start;}
  .mealTag{flex-shrink:0;font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:4px 9px;margin-top:2px;white-space:nowrap;}
  .mealTag.bf{background:#FFB45B;}.mealTag.lu{background:#FF7BA9;}.mealTag.di{background:#7BA8F0;}
  .mealRow .mm{font-size:13.8px;line-height:1.7;color:#444;}
  .mealRow .mm b{color:#333;}
  .intake{background:#fff;border:1.5px dashed #B8D4FF;border-radius:16px;padding:13px 15px;margin-top:12px;}
  .intake .tt{font-weight:800;color:#4A78C8;margin-bottom:8px;font-size:13.5px;}
  .intake .row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip2{font-size:12px;background:#EEF5FF;color:#3E68B0;border-radius:99px;padding:4px 10px;font-weight:700;}
  .alTab{padding:8px 14px;border:1.5px solid var(--line);background:#fff;border-radius:99px;font-size:13px;font-weight:700;color:#666;cursor:pointer;}
  .alTab.on{background:linear-gradient(135deg,#FF9DC0,#FF6BA9);border-color:transparent;color:#fff;}
  .allgrid{display:flex;flex-wrap:wrap;gap:8px;}
  .allem{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:all .15s;color:#666;}
  .allem .mi{font-size:11px;color:#B0A8A0;font-weight:600;}
  .allem.done{background:#E8F8EF;border-color:#8AD3A6;color:#1E7A4A;}
  .allem.done .mi{color:#6BB58C;}
  .allem.bad{background:#FFE9EC;border-color:#F2A9B8;color:#C0344B;}
  .allem.bad .mi{color:#D06A7E;}
  .allem:hover{transform:scale(1.05);}
  .menuCard .mn{font-size:20px;font-weight:900;color:var(--pri-d);}
  .menuCard .mg{font-size:12.5px;color:#A08060;font-weight:700;margin:4px 0 10px;}
  .menuCard .it{font-size:14.5px;background:#fff;border-radius:11px;padding:8px 12px;margin:6px 0;}
  .menuCard .st{font-size:14px;color:#666;padding:0 4px;margin:4px 0;}
  .menuCard .st li{margin:3px 0;}
  .ok{color:var(--green-d);}.mid{color:#C98A1B;}.low{color:#E5484D;}
  .tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;}
  .tabs button{min-height:46px;padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;color:#666;}
  .tabs button.on{background:var(--priGrad);border-color:transparent;color:#fff;}
  .card{background:#fff;border-radius:14px;padding:13px;box-shadow:var(--sh);}
  .card .tt{font-weight:800;font-size:17px;display:flex;align-items:center;gap:7px;}
  .card .tt svg{width:19px;height:19px;}
  .card .tx{font-size:15px;color:#666;margin-top:6px;}
  .tipcard{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px;border-left:5px solid var(--pri);}
  .tipcard .sc{font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center;}
  .tipcard .sc .num{background:var(--priGrad);color:#fff;border-radius:9px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .tipcard ul{margin:10px 0 0;padding-left:20px;}
  .tipcard li{font-size:16px;color:#555;margin:5px 0;}
  .abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
  .abc{background:#fff;border-radius:14px;padding:12px 6px 10px;text-align:center;box-shadow:var(--sh);cursor:pointer;transition:transform .12s;border:1.5px solid transparent;}
  .abc:active{transform:scale(.93);}
  .abc .L{font-size:30px;font-weight:900;color:var(--pri-d);line-height:1.1;}
  .abc .em{font-size:26px;line-height:1.3;margin:2px 0 1px;}
  .abc .W{font-size:13px;font-weight:800;color:#555;margin-top:1px;}
  .abc .C{font-size:11px;color:var(--muted);}
  .abc.on{outline:2.5px solid var(--pri);transform:scale(1.04);}
  /* ---- 英文启蒙：SSS 歌曲卡 / 单词本 / 亲子口语 ---- */
  .sssCard{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,background .15s;}
  .sssCard:hover{border-color:#FFD9BC;}
  .sssCard.open{border-color:#FFD9BC;background:#FFFDF9;}
  .sssTop{display:flex;align-items:center;gap:12px;}
  .sssCard .em{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;background:#FFF0E2;}
  .sssCard .inf{flex:1;min-width:0;}
  .sssCard .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .sssCard .tp{font-size:11.5px;color:#A08060;background:#FFF3D6;border-radius:99px;padding:2px 9px;font-weight:700;}
  .sssCard .tx{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .sssCard .ply{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(145deg,#FF9A6E,#FF7A4D);color:#fff;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(255,138,91,.35);flex-shrink:0;}
  .sssCard .ply:active{transform:scale(.9);}
  .sssCard .lyr{display:none;background:#FFF8F1;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.9;color:#6B4A2E;}
  .sssCard .lyr b{color:#C2692F;}
  .sssCard.open .lyr{display:block;}
  .sssCard .lyr .playlyr{display:inline-flex;align-items:center;gap:5px;margin-top:6px;border:none;background:var(--pri);color:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;}
  .word{background:#fff;border-radius:16px;padding:14px 8px 10px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative;transition:transform .12s;border:1.5px solid transparent;}
  .word:active{transform:scale(.93);}
  .word .em{font-size:36px;line-height:1.2;}
  .word .en{font-weight:800;font-size:14.5px;margin-top:5px;color:var(--pri-d);}
  .word .zh{font-size:12px;color:#888;margin-top:1px;}
  .word .okmark{position:absolute;top:7px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid #DFD4C8;font-size:12px;display:flex;align-items:center;justify-content:center;color:#fff;}
  .word.learnt{background:linear-gradient(150deg,#F1FBE9,#E4F7D7);border-color:#BFE3A8;}
  .word.learnt .okmark{background:var(--green);border-color:var(--green);}
  .talkCard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px;}
  .talkCard .scEm{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#FFF0E2;}
  .talkCard .inf{flex:1;min-width:0;}
  .talkCard .en{font-weight:800;font-size:15.5px;color:var(--pri-d);}
  .talkCard .zh{font-size:13px;color:#777;margin-top:2px;}
  .talkCard .spk{width:42px;height:42px;border-radius:50%;border:none;background:#EFEAFC;color:#7A5CF0;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .talkCard .spk:active{transform:scale(.9);}
  .talkCard .fav{width:42px;height:42px;border-radius:50%;border:none;background:#FFF0E2;color:#E8A0B8;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .talkCard .fav.on{background:#FFEDF4;color:#E5484D;}
  .progbar{height:9px;background:#F0EAE3;border-radius:99px;overflow:hidden;margin:8px 0 2px;}
  .progbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8FD89E,#58B36B);transition:width .3s;}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;color:#666;}
  .seg button.on{background:var(--pri);color:#fff;border-color:var(--pri);}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;}
  .chiprow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:#666;}
  .chiprow button.on{background:var(--pri);color:#fff;border-color:var(--pri);}
  @media(max-width:860px){
    .topbar{padding:6px 8px;gap:6px;}
    .logo{font-size:16px;}
    .logo svg{width:22px;height:22px;}
    .babyinfo{font-size:12px;padding:3px 9px 3px 4px;}
    .babyinfo .av{width:26px;height:26px;font-size:14px;}
    .tbtn{min-height:38px;padding:0 9px;font-size:14px;border-radius:10px;}
    .tbtn svg{width:18px;height:18px;}
    .side{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;flex-shrink:0;background:#fff;border-right:none;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -3px 14px rgba(0,0,0,.10);}
    .side .nav{flex-direction:row;justify-content:space-around;align-items:stretch;gap:2px;position:static;}
    .side .nav a{flex-direction:column;gap:3px;padding:7px 2px;font-size:13px;text-align:center;white-space:normal;line-height:1.2;border-radius:14px;flex:1;}
    .side .nav a .nicon{width:42px;height:42px;font-size:23px;border-radius:12px;}
    .main{padding:14px 10px 100px;flex:1;min-width:0;overflow-x:hidden;max-width:100%;}
    .plantwrap{flex-direction:column;align-items:center;text-align:center;}
    .plant{max-width:100%;}
    .plant svg{width:170px;max-width:100%;height:auto;overflow:hidden;}
    .grid.c2,.grid.c3{grid-template-columns:1fr 1fr;}
    .carebtn{min-height:42px;min-width:72px;font-size:13.5px;gap:4px;padding:0 8px;}
    .carebtn svg{width:16px;height:16px;}
  }
  @media(max-width:520px){
    .side .nav a .nicon{width:38px;height:38px;font-size:21px;}
    .side .nav a{padding:6px 2px;font-size:12.5px;}
    .side .nav{justify-content:space-between;}
    .grid.c3{grid-template-columns:1fr 1fr;}
    .grid.c2{grid-template-columns:1fr;}
    .plantwrap .stat{padding:9px;}
    .plantwrap .stat .n{font-size:20px;}
    .plantwrap .stat .l{font-size:12.5px;}
    .carebtn{min-height:38px;min-width:60px;font-size:12px;gap:3px;padding:0 5px;border-radius:10px;}
    .carebtn svg{width:14px;height:14px;}
  }
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(40,40,45,.93);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:99px;z-index:90;max-width:86vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
</style>
</head>

<script>
(function(){
var __LANG='zh';
try{var _l=(new URL(location.href).searchParams.get('lang')||'').toLowerCase();if(_l==='en')__LANG='en';}catch(e){}
window.__HB_LANG=__LANG;
document.documentElement.lang=__LANG==='en'?'en':'zh-CN';
var DICT={"大运动":"Gross Motor","精细运动":"Fine Motor","认知启蒙":"Cognitive","语言启蒙":"Language","社交情感":"Social-Emotional","6个月+":"6mo+","8个月+":"8mo+","10个月+":"10mo+","12个月+":"12mo+","番茄肉酱面+清炒小青菜":"Spaghetti with tomato meat sauce + stir-fried baby bok choy","荤：猪里脊肉末50g｜素：番茄1个、小青菜3棵｜主食：宝宝面条50g":"Meat: 50g minced pork tenderloin | Vegetarian: 1 tomato, 3 small bok choy | Staple: 50g baby noodles","番茄划十字用开水烫后去皮切丁，热锅少油炒出沙。下肉末炒散至变色，加半碗开水小火焖8分钟收成酱。面条煮软捞出过一遍温水。小青菜洗净沸水焯15秒，热锅少油快炒1分钟。面条浇上肉酱，配小青菜，滴2滴核桃油":"Score the tomatoes with a cross, scald them in boiling water, peel, and dice. Stir-fry in a hot pan with a little oil until sandy. Add minced meat and stir until it changes color, then add half a bowl of boiling water and simmer over low heat for 8 minutes to make a sauce. Cook the noodles until soft, then drain and rinse briefly with warm water. Clean the baby bok choy and blanch in boiling water for 15 seconds, then stir-fry quickly in a hot pan with a little oil for 1 minute. Pour the meat sauce over the noodles, serve with the baby bok choy, and drizzle with 2 drops of walnut oil.","香菇鸡肉面+蒜蓉西兰花":"Shiitake Mushroom Chicken Noodles + Garlic Broccoli","荤：鸡胸肉30g｜素：香菇2朵、西兰花3朵｜主食：宝宝面条50g":"Meat: 30g chicken breast | Vegetarian: 2 shiitake mushrooms, 3 pieces of broccoli | Staple: 50g baby noodles","鸡胸肉切小丁，用少许淀粉抓匀。香菇泡软切片，热油下鸡肉丁炒白，加香菇和两碗开水煮开。下面条煮软。西兰花掰小朵焯水2分钟，蒜末炝锅翻炒1分钟。面条连汤装碗，配蒜蓉西兰花":"Cut the chicken breast into small cubes and coat evenly with a little starch. Soften the shiitake mushrooms in water and slice them. Heat oil, stir-fry the chicken cubes until white, then add the mushrooms and two bowls of boiling water and bring to a boil. Cook the noodles until soft. Break the broccoli into small florets and blanch for 2 minutes. Stir-fry minced garlic in a hot pan for 1 minute. Serve the noodles with the broth in a bowl, accompanied by garlic broccoli.","番茄蛋花汤面+清炒胡萝卜丝":"Tomato and egg drop soup noodles + stir-fried shredded carrots","荤：鸡蛋1个｜素：番茄1个、胡萝卜半根｜主食：宝宝面条50g":"Meat: 1 egg | Vegetables: 1 tomato, half a carrot | Staple food: 50g baby noodles","番茄去皮切丁炒出沙，加一碗开水烧开。淋入打散的蛋液做成蛋花。下面条煮软。胡萝卜切细丝，热油小火煸炒2分钟至软。面汤盛碗撒葱花，配胡萝卜丝":"Peel the tomatoes, dice them, and stir-fry until they release their juices. Add a bowl of boiling water and bring to a boil. Pour in the beaten eggs to make egg drop soup. Boil the noodles until soft. Cut the carrot into fine shreds, stir-fry in hot oil over low heat for 2 minutes until soft. Serve the noodle soup in a bowl, sprinkle with chopped green onions, and serve with carrot shreds.","猪肝菠菜面+清炒土豆丝":"Pork Liver and Spinach Noodles + Stir-Fried Shredded Potatoes","荤：猪肝30g｜素：菠菜3棵、土豆半个｜主食：宝宝面条50g":"Meat: 30g of pork liver | Vegetables: 3 leaves of spinach, half a potato | Staple: 50g of baby noodles","猪肝切薄片泡水30分钟去腥，沸水焯1分钟。另起锅煮面，快熟时下猪肝片和菠菜段再煮2分钟。土豆切细丝泡水去淀粉，热油快炒至软。猪肝面滴1滴宝宝酱油，配土豆丝":"Slice the pork liver thinly and soak in water for 30 minutes to remove the odor, then blanch in boiling water for 1 minute. In another pot, cook the noodles, and when almost done, add the pork liver slices and spinach pieces and cook for another 2 minutes. Cut the potato into thin shreds and soak in water to remove starch, then quickly stir-fry in hot oil until soft. Drizzle 1 drop of baby soy sauce on the pork liver noodles, and serve with shredded potatoes.","鳕鱼时蔬面+拌黄瓜条":"Cod Fish with Seasonal Vegetables Noodles + Mixed Cucumber Strips","荤：鳕鱼40g｜素：番茄半个、娃娃菜2片｜主食：宝宝面条50g":"Meat: 40g cod | Vegetarian: half a tomato, 2 pieces of baby cabbage | Staple: 50g baby noodles","鳕鱼去皮去刺切丁，滴几滴柠檬汁去腥。番茄切丁炒出汁加水烧开，下鳕鱼丁和面条煮软。娃娃菜切丝同煮。黄瓜去皮切条。面盛碗配黄瓜条":"Peel and debone the cod, cut it into cubes, and add a few drops of lemon juice to remove the fishy smell. Dice the tomato and stir-fry until it releases juice, then add water and bring to a boil. Add the cod cubes and noodles and cook until soft. Shred the baby bok choy and cook together. Peel the cucumber and cut it into strips. Serve the noodles in a bowl with cucumber strips.","虾仁时蔬面+清炒西葫芦":"Shrimp and Vegetable Noodles + Stir-Fried Zucchini","荤：鲜虾仁30g｜素：胡萝卜1/4根、娃娃菜2片｜主食：宝宝面条50g":"Meat: Fresh shrimp 30g | Vegetables: Carrot 1/4 piece, baby cabbage 2 leaves | Staple: Baby noodles 50g","虾仁去虾线切丁，用姜片腌10分钟去腥。胡萝卜切碎和面同煮，快熟时下虾仁丁和娃娃菜丝。西葫芦切片，热油炒2分钟。虾仁面滴几滴核桃油，配炒西葫芦":"Remove the veins from the shrimp and cut into small cubes, marinate with ginger slices for 10 minutes to remove the fishy smell. Finely chop the carrot and cook it together with the noodles. When almost cooked, add the diced shrimp and shredded baby cabbage. Slice the zucchini and stir-fry in hot oil for 2 minutes. Drizzle a few drops of walnut oil on the shrimp noodles and serve with the stir-fried zucchini.","肉末茄子面+烫拌菠菜":"Minced Meat Eggplant Noodles + Blanched Spinach Salad","荤：猪肉末40g｜素：茄子半根、菠菜3棵｜主食：宝宝面条50g":"Meat: 40g minced pork | Vegetarian: half an eggplant, 3 spinach leaves | Staple: 50g baby noodles","茄子去皮切丁，用盐水泡10分钟挤干。热油下肉末炒散，加茄子丁炒软，加半碗水焖5分钟成浇头。面条煮熟。菠菜焯水20秒，切碎拌少许核桃油。面浇肉末茄子，配菠菜":"Peel the eggplant and cut into cubes, soak in salt water for 10 minutes and squeeze dry. Heat oil and stir-fry the minced meat until scattered, then add the eggplant cubes and fry until soft, add half a bowl of water and simmer for 5 minutes to make the topping. Cook the noodles. Blanch the spinach for 20 seconds, chop it and mix with a little walnut oil. Pour the minced meat and eggplant topping over the noodles and serve with the spinach.","三鲜菌菇面+清炒荷兰豆":"Three-Delicacy Mushroom Noodles + Stir-Fried Snow Peas","荤：鲜虾仁20g、肉末20g｜素：香菇2朵、荷兰豆8个｜主食：宝宝面条50g":"Meat: 20g fresh shrimp, 20g minced meat | Vegetarian: 2 shiitake mushrooms, 8 snow peas | Staple: 50g baby noodles","虾仁切丁、香菇切片，热油下肉末和虾仁炒香，加香菇和开水煮成汤底。下面条煮软。荷兰豆撕筋焯水1分钟，热油快炒。三鲜面配炒荷兰豆":"Dice the shrimp, slice the shiitake mushrooms, and stir-fry the minced meat and shrimp in hot oil until fragrant. Add the mushrooms and boiling water to make the soup base. Cook the noodles until soft. Trim the strings from the snow peas and blanch them for 1 minute, then quickly stir-fry in hot oil. Serve the three-delicacy noodles with stir-fried snow peas.","南瓜鸡肉浓汤面+白灼小青菜":"Pumpkin Chicken Cream Soup Noodles + Blanched Baby Bok Choy","荤：鸡腿肉30g｜素：南瓜80g、小青菜3棵｜主食：宝宝面条50g":"Meat: 30g chicken thigh | Vegetables: 80g pumpkin, 3 baby bok choy | Staple food: 50g baby noodles","南瓜去皮蒸熟压成泥。鸡腿肉去骨切丁炒白，加开水烧开下南瓜泥搅匀。下面条煮软。小青菜整棵焯水30秒。浓汤面配小青菜，汤浓味甜":"Peel the pumpkin, steam until cooked, and mash into a puree. Remove the bones from the chicken drumsticks, cut into small cubes, and stir-fry until white. Add boiling water, bring to a boil, then add the pumpkin puree and stir evenly. Cook the noodles until soft. Blanch the whole baby bok choy for 30 seconds. Serve the thick soup noodles with the baby bok choy; the soup is thick and sweet.","山药肉末面+清炒豆芽":"Yam and Minced Pork Noodles + Stir-Fried Bean Sprouts","荤：猪肉末30g｜素：山药50g、黄豆芽一小把｜主食：宝宝面条50g":"Meat: 30g minced pork | Vegetables: 50g Chinese yam, a small handful of soybean sprouts | Staple: 50g baby noodles","山药去皮切小段蒸软压泥。肉末炒散加开水，下山药泥搅匀煮开，下面条。豆芽掐尾洗净，热油快炒1分钟。山药肉末面配炒豆芽":"Peel the Chinese yam and cut it into small sections, steam until soft, and mash it. Stir-fry the minced meat until loose, add boiling water, then add the yam mash and stir evenly, bringing it to a boil, then add noodles. Trim and wash the bean sprouts, and quickly stir-fry in hot oil for 1 minute. Serve the yam and minced meat noodles with the stir-fried bean sprouts.","香菇鸡肉粥+清炒西兰花+胡萝卜条":"Shiitake Mushroom Chicken Congee + Stir-fried Broccoli + Carrot Sticks","荤：鸡胸肉30g｜素：香菇2朵、西兰花3朵、胡萝卜1/4根｜主食：大米40g":"Meat: 30g chicken breast | Vegetarian: 2 shiitake mushrooms, 3 broccoli florets, 1/4 carrot | Staple: 40g rice","大米熬成软粥。鸡肉切末、香菇切碎，粥快好时下锅再煮5分钟。西兰花焯水2分钟。胡萝卜切条蒸软。粥滴2滴核桃油，配西兰花和胡萝卜条":"Cook the rice into a soft porridge. Mince the chicken and chop the shiitake mushrooms. When the porridge is almost done, add them into the pot and cook for another 5 minutes. Blanch the broccoli for 2 minutes. Cut the carrot into strips and steam until soft. Add 2 drops of walnut oil to the porridge, and serve with the broccoli and carrot strips.","番茄牛肉粥+清炒油麦菜+土豆泥":"Tomato and beef congee + Stir-fried romaine lettuce + Mashed potatoes","荤：牛肉末30g｜素：番茄1个、油麦菜2棵、土豆半个｜主食：大米40g":"Meat: 30g of ground beef | Vegetables: 1 tomato, 2 stalks of romaine lettuce, half a potato | Staple: 40g of rice","大米煮粥。番茄去皮切丁炒出汁，下牛肉末炒散，倒入粥里煮5分钟。土豆蒸熟压泥。油麦菜焯水切碎拌少许油。牛肉粥配土豆泥和油麦菜":"Cook rice into porridge. Peel and dice the tomatoes, stir-fry to release juice, then stir-fry the ground beef until crumbly, and pour into the porridge to cook for 5 minutes. Steam the potatoes until cooked and mash them. Blanch the romaine lettuce, chop finely, and mix with a little oil. Serve the beef porridge with mashed potatoes and romaine lettuce.","猪肝瘦肉粥+烫拌生菜+南瓜块":"Pork liver and lean meat congee + blanched lettuce + pumpkin pieces","荤：猪肝20g、瘦肉20g｜素：生菜2片、南瓜50g｜主食：大米40g":"Meat: 20g pork liver, 20g lean meat | Vegetables: 2 leaves of lettuce, 50g pumpkin | Staple: 40g rice","大米熬粥。猪肝泡水去腥焯水切碎，瘦肉切末，粥快好时下锅煮5分钟。南瓜蒸软切块。生菜焯水10秒切丝拌核桃油。补铁粥配南瓜和生菜":"Cook rice into porridge. Soak pig liver in water to remove the odor, blanch, and chop finely; mince the lean pork. When the porridge is almost done, add them to the pot and cook for 5 minutes. Steam the pumpkin until soft and cut into pieces. Blanch the lettuce for 10 seconds, shred, and mix with walnut oil. Iron-rich porridge served with pumpkin and lettuce.","鳕鱼西兰花粥+清炒口蘑+胡萝卜条":"Cod and broccoli porridge + stir-fried mushrooms + carrot sticks","荤：鳕鱼40g｜素：西兰花3朵、口蘑2个、胡萝卜1/4根｜主食：大米40g":"Meat: 40g cod | Vegetables: 3 broccoli florets, 2 button mushrooms, 1/4 carrot | Staple: 40g rice","大米煮粥。鳕鱼去皮去刺蒸熟压碎，粥快好时拌入。西兰花焯水切碎同煮2分钟。口蘑切片热油炒2分钟。胡萝卜条蒸软。鱼粥滴柠檬汁提鲜，配口蘑和胡萝卜":"Cook rice into porridge. Remove the skin and bones from the cod, steam until cooked, and mash it, then stir it into the porridge when it's almost done. Blanch and chop the broccoli and cook together for 2 minutes. Slice the mushrooms and stir-fry in hot oil for 2 minutes. Steam carrot sticks until soft. Drizzle lemon juice into the fish porridge to enhance the flavor, and serve with mushrooms and carrots.","虾仁豆腐粥+清炒芦笋+红薯条":"Shrimp and Tofu Congee + Stir-fried Asparagus + Sweet Potato Fries","荤：虾仁30g、嫩豆腐30g｜素：芦笋2根、红薯50g｜主食：大米40g":"Meat: 30g shrimp, 30g soft tofu | Vegetables: 2 asparagus spears, 50g sweet potato | Staple: 40g rice","大米煮粥。虾仁去虾线切丁，豆腐切小丁，粥快好时下锅煮4分钟。芦笋去老皮切段焯水，热油快炒。红薯切条蒸软。虾仁豆腐粥配芦笋和红薯条":"Cook rice into porridge. Devein the shrimp and cut into small cubes, cut the tofu into small cubes, and add to the pot when the porridge is almost done and cook for 4 minutes. Peel and cut the asparagus into sections, blanch, and quickly stir-fry in hot oil. Cut the sweet potato into strips and steam until soft. Shrimp and tofu porridge served with asparagus and sweet potato strips.","南瓜鸡肉焖饭+清炒小青菜+番茄块":"Pumpkin Chicken Braised Rice + Stir-Fried Baby Bok Choy + Tomato Chunks","荤：鸡腿肉40g｜素：南瓜80g、小青菜3棵、番茄半个｜主食：大米50g":"Meat: 40g chicken thigh | Vegetables: 80g pumpkin, 3 bok choy, half a tomato | Staple: 50g rice","鸡腿肉去骨切丁，南瓜去皮切丁。大米淘净，与鸡肉丁南瓜丁一起加水焖成软饭。小青菜快炒1分钟。番茄去皮切块。焖饭鲜甜，配菜清爽":"Debone the chicken thigh and cut it into cubes, peel the pumpkin and cut it into cubes. Rinse the rice, and cook it with the chicken cubes and pumpkin cubes with water to make soft rice. Quickly stir-fry the bok choy for 1 minute. Peel and cut the tomato into pieces. The braised rice is fresh and sweet, and the side dishes are refreshing.","胡萝卜牛肉焖饭+白灼西兰花+玉米粒":"Braised Rice with Carrots and Beef + Blanched Broccoli + Corn Kernels","荤：牛肉末40g｜素：胡萝卜半根、西兰花3朵、甜玉米粒30g｜主食：大米50g":"Meat: 40g minced beef | Vegetables: half a carrot, 3 broccoli florets, 30g sweet corn kernels | Staple: 50g rice","牛肉末加少许淀粉拌匀。大米淘净，铺上牛肉末、胡萝卜丁和玉米粒，加水焖成软饭。西兰花焯水2分钟。牛肉焖饭补铁，配白灼西兰花":"Mix minced beef with a little starch. Rinse the rice, spread the minced beef, diced carrots, and corn on top, then add water and simmer into soft rice. Blanch the broccoli for 2 minutes. Beef simmered rice supplements iron, served with blanched broccoli.","豌豆虾仁焖饭+清炒娃娃菜+土豆条":"Pea and Shrimp Braised Rice + Stir-fried Baby Cabbage + Potato Strips","荤：虾仁30g｜素：豌豆粒30g、娃娃菜3片、土豆半个｜主食：大米50g":"Meat: 30g of shrimp｜Vegetables: 30g of peas, 3 pieces of baby cabbage, half a potato｜Staple: 50g of rice","虾仁切丁用姜腌10分钟。大米淘净，加豌豆粒、虾仁丁和水焖成软饭。娃娃菜切丝炒软。土豆切条蒸软。豌豆虾仁焖饭配娃娃菜和土豆条":"Dice the shrimp and marinate with ginger for 10 minutes. Rinse the rice, add pea kernels, diced shrimp, and water, and cook into soft rice. Shred the baby cabbage and stir-fry until soft. Cut the potatoes into strips and steam until soft. Serve the pea and shrimp rice with baby cabbage and potato strips.","土豆肉末拌饭+清炒菠菜+黄瓜条":"Minced Pork with Potato Mixed Rice + Stir-fried Spinach + Cucumber Sticks","荤：猪肉末40g｜素：土豆1个、菠菜3棵、黄瓜1/4根｜主食：大米50g":"Meat: 40g minced pork | Vegetables: 1 potato, 3 spinach leaves, 1/4 cucumber | Staple: 50g rice","土豆去皮蒸熟压泥。肉末炒香加少许水和土豆泥炒成浇头。大米煮软饭。菠菜焯水切碎拌核桃油。黄瓜去皮切条。肉末土豆泥浇在米饭上拌匀，配菠菜黄瓜":"Peel the potatoes, steam until cooked, and mash them. Stir-fry the minced meat until fragrant, then add a little water and the mashed potatoes to stir-fry into a topping. Cook the rice until soft. Blanch the spinach, chop it, and mix with walnut oil. Peel the cucumber and cut into strips. Pour the minced meat and mashed potato topping over the rice and mix well, served with spinach and cucumber.","玉米排骨粥+清炒莴笋+山药条":"Corn and Pork Rib Congee + Stir-fried Lettuce Stem + Yam Strips","荤：排骨2小块｜素：玉米粒30g、莴笋1段、山药50g｜主食：大米40g":"Meat: 2 small pieces of pork ribs | Vegetables: 30g corn kernels, 1 section of lettuce stem, 50g Chinese yam | Staple: 40g rice","排骨焯水后加水小火炖40分钟，取排骨肉切碎。大米和玉米粒入排骨汤熬粥，快好时下排骨肉。莴笋去皮切条焯水快炒。山药蒸软切条。排骨粥香浓，配莴笋山药":"Blanch the ribs, then add water and simmer over low heat for 40 minutes. Remove the ribs and chop the meat. Cook the rice and corn kernels in the rib soup to make porridge, and add the rib meat near the end. Peel and cut the celtuce into strips, blanch, and quickly stir-fry. Steam the yam until soft and cut into strips. The rib porridge is rich and fragrant, served with celtuce and yam.","猪肉白菜饺+冬瓜汤+清炒胡萝卜丝":"Pork and cabbage dumplings + winter melon soup + stir-fried shredded carrots","荤：猪肉末50g｜素：白菜叶2片、冬瓜1段、胡萝卜1/4根｜主食：饺子皮10张":"Meat: 50g minced pork | Vegetarian: 2 cabbage leaves, 1 section of winter melon, 1/4 carrot | Staple: 10 dumpling wrappers","肉末加白菜碎、少许香油和一点点盐拌匀成馅。饺子皮包小饺子，沸水下锅煮至浮起再煮3分钟。冬瓜切薄片煮汤。胡萝卜切丝炒软。饺子配冬瓜汤和胡萝卜丝":"Mix minced meat with chopped cabbage, a little sesame oil, and a pinch of salt to make the filling. Wrap the filling in dumpling wrappers to make small dumplings, cook in boiling water until they float, then cook for another 3 minutes. Slice winter melon thinly and cook into soup. Shred carrots and sauté until soft. Serve the dumplings with winter melon soup and shredded carrots.","鸡肉香菇饺+紫菜蛋花汤+拌黄瓜":"Chicken and shiitake mushroom dumplings + seaweed egg drop soup + tossed cucumber","荤：鸡肉末50g｜素：香菇2朵、黄瓜1/4根、紫菜少许｜主食：饺子皮10张":"Meat: 50g minced chicken | Vegetables: 2 shiitake mushrooms, 1/4 cucumber, a little seaweed | Staple: 10 dumpling wrappers","鸡肉末加香菇碎拌匀成馅，包小饺子煮熟。紫菜撕碎，鸡蛋打散淋入沸水成蛋花汤。黄瓜去皮切条。饺子蘸少许宝宝酱油，配紫菜蛋花汤和黄瓜条":"Mix minced chicken with chopped shiitake mushrooms to make a filling, use it to wrap small dumplings and cook them. Tear the seaweed into pieces, beat the eggs and pour them into boiling water to make egg drop soup. Peel the cucumber and cut it into strips. Dip the dumplings in a little baby soy sauce, and serve with seaweed egg drop soup and cucumber strips.","虾仁胡萝卜饺+番茄汤+清炒西兰花":"Shrimp and Carrot Dumplings + Tomato Soup + Stir-Fried Broccoli","荤：虾仁50g｜素：胡萝卜半根、番茄半个、西兰花3朵｜主食：饺子皮10张":"Meat: 50g of shrimp｜Vegetables: half a carrot, half a tomato, 3 pieces of broccoli｜Staple: 10 dumpling wrappers","虾仁剁泥、胡萝卜擦细丝，混合成馅包小饺子。番茄去皮切丁煮成番茄汤。西兰花焯水。虾仁饺子配番茄汤和西兰花":"Chop the shrimp into a paste, grate the carrots finely, mix them into a filling, and make small dumplings. Peel and dice the tomatoes to cook into tomato soup. Blanch the broccoli. Serve the shrimp dumplings with tomato soup and broccoli.","三文鱼土豆饼+玉米浓汤+清炒小青菜":"Salmon Potato Pancakes + Corn Chowder + Stir-Fried Baby Greens","荤：三文鱼40g｜素：土豆半个、甜玉米粒30g、小青菜3棵｜主食：面粉30g":"Meat: 40g of salmon | Vegetarian: half a potato, 30g of sweet corn, 3 baby bok choy | Staple: 30g of flour","三文鱼蒸熟去刺压碎，土豆蒸熟压泥，与面粉混合成团，压成小饼，平底锅少油小火煎两面金黄。玉米粒加水煮软，用勺背压浓成汤。小青菜快炒。三文鱼饼配玉米浓汤和小青菜":"Steam the salmon until cooked, remove the bones, and mash it. Steam the potatoes until cooked and mash them. Mix with flour to form a dough, press into small patties, and pan-fry with a little oil over low heat until both sides are golden. Boil the corn kernels until soft, then mash them into a thick soup with the back of a spoon. Stir-fry the baby bok choy quickly. Serve the salmon patties with corn chowder and baby bok choy.","鸡肉时蔬饼+南瓜浓汤+烫拌西兰花":"Chicken and vegetable pancake + pumpkin cream soup + blanched broccoli","荤：鸡肉末40g｜素：胡萝卜1/4根、西葫芦1/4根、南瓜80g、西兰花3朵｜主食：面粉30g":"Meat: 40g minced chicken | Vegetables: 1/4 carrot, 1/4 zucchini, 80g pumpkin, 3 broccoli florets | Staple: 30g flour","鸡肉末加擦细的胡萝卜丝和西葫芦丝、面粉拌匀，压小饼煎熟。南瓜蒸熟加水压成浓汤。西兰花焯水拌核桃油。鸡肉饼软嫩，配南瓜汤和西兰花":"Minced chicken mixed with finely grated carrot and zucchini, and flour, shaped into small patties and pan-fried until cooked. Pumpkin steamed and mashed with water into a thick soup. Broccoli blanched and tossed with walnut oil. The chicken patties are tender, served with pumpkin soup and broccoli.","虾仁豆腐饼+菠菜汤+蒸胡萝卜条":"Shrimp and tofu patties + spinach soup + steamed carrot sticks","荤：虾仁40g、嫩豆腐50g｜素：菠菜3棵、胡萝卜1/4根｜主食：面粉30g":"Meat: 40g of shrimp, 50g of soft tofu | Vegetables: 3 spinach leaves, 1/4 carrot | Staple: 30g of flour","虾仁剁泥，豆腐压碎，加面粉和少许蛋清拌匀，压小饼煎至两面微黄。菠菜焯水切碎，加水煮成菠菜汤。胡萝卜切条蒸软。豆腐虾仁饼补钙，配菠菜汤和胡萝卜条":"Chop the shrimp into a paste, crush the tofu, mix with flour and a little egg white, press into small patties and pan-fry until both sides are light yellow. Blanch the spinach, chop it, and cook with water to make spinach soup. Cut the carrots into strips and steam until soft. Tofu and shrimp patties are rich in calcium, served with spinach soup and carrot strips.","肉末蔬菜饼+小米粥+清炒豆芽":"Minced meat and vegetable pancake + millet porridge + stir-fried bean sprouts","荤：猪肉末40g｜素：西葫芦1/4根、胡萝卜1/4根、豆芽一小把｜主食：面粉30g、小米30g":"Meat: 40g minced pork | Vegetarian: 1/4 zucchini, 1/4 carrot, a small handful of bean sprouts | Staple: 30g flour, 30g millet","肉末加擦细的西葫芦丝胡萝卜丝和面粉拌成糊，小火煎成小饼。小米熬成粥。豆芽掐尾快炒1分钟。蔬菜肉饼配小米粥和炒豆芽":"Mix minced meat with finely grated zucchini, carrot, and flour into a batter, and pan-fry over low heat into small pancakes. Cook millet into porridge. Trim bean sprouts and stir-fry quickly for 1 minute. Serve vegetable meat pancakes with millet porridge and stir-fried bean sprouts.","鳕鱼南瓜饼+番茄蛋汤+清炒芦笋":"Cod and Pumpkin Pancakes + Tomato and Egg Soup + Stir-Fried Asparagus","荤：鳕鱼40g｜素：南瓜80g、番茄半个、芦笋2根｜主食：面粉30g":"Meat: 40g of cod | Vegetarian: 80g of pumpkin, half a tomato, 2 asparagus spears | Staple: 30g of flour","鳕鱼蒸熟去刺，南瓜蒸熟压泥，加面粉拌成团压小饼煎熟。鸡蛋打散入番茄汤成蛋花汤。芦笋切段焯水快炒。鳕鱼南瓜饼配番茄蛋汤和芦笋":"Steam the cod and remove the bones, steam the pumpkin and mash it, mix with flour to form a dough, press into small cakes and pan-fry until cooked. Beat the eggs and add to tomato soup to make egg drop soup. Cut the asparagus into sections, blanch, and quickly stir-fry. Serve cod and pumpkin cakes with tomato egg soup and asparagus.","猪肉荠菜馄饨+冬瓜汤+清炒卷心菜":"Pork and Shepherd's Purse Wontons + Winter Melon Soup + Stir-fried Cabbage","荤：猪肉末40g｜素：荠菜一小把、冬瓜1段、卷心菜2片｜主食：馄饨皮10张":"Meat: 40g minced pork | Vegetarian: a small handful of shepherd's purse, a section of winter melon, 2 cabbage leaves | Staple: 10 wonton wrappers","荠菜焯水挤干切碎，和肉末拌匀成馅，包小馄饨煮熟。冬瓜煮成清汤。卷心菜切丝快炒。小馄饨配冬瓜汤和炒卷心菜":"Blanch the shepherd's purse, squeeze dry and chop, mix with minced meat to make a filling, and wrap into small wontons to cook. Cook the winter melon into a clear soup. Shred the cabbage and stir-fry quickly. Serve the small wontons with winter melon soup and stir-fried cabbage.","鸡肉菌菇馄饨+黄瓜条+蒸红薯":"Chicken and mushroom wontons + cucumber sticks + steamed sweet potato","荤：鸡肉末40g｜素：香菇2朵、黄瓜1/4根、红薯50g｜主食：馄饨皮10张":"Meat: 40g minced chicken | Vegetarian: 2 shiitake mushrooms, 1/4 cucumber, 50g sweet potato | Staple: 10 wonton wrappers","鸡肉末加香菇碎和少许蛋清拌成馅，包小馄饨煮熟。红薯切条蒸软。黄瓜去皮切条。小馄饨配红薯和黄瓜":"Mix minced chicken with chopped shiitake mushrooms and a little egg white to make the filling, then wrap into small wontons and cook until done. Cut the sweet potato into strips and steam until soft. Peel and cut the cucumber into strips. Serve the small wontons with sweet potato and cucumber.","肉末蒸蛋+清炒小青菜+南瓜块":"Steamed egg with minced meat + stir-fried baby bok choy + pumpkin chunks","荤：猪肉末20g、鸡蛋1个｜素：小青菜3棵、南瓜50g｜主食：米饭50g":"Meat: 20g minced pork, 1 egg | Vegetables: 3 small bok choy, 50g pumpkin | Staple: 50g rice","鸡蛋打散加1.5倍温水，肉末铺底，盖保鲜膜蒸10分钟。南瓜蒸软切块。小青菜快炒。软米饭。蒸蛋滑嫩，配南瓜和青菜":"Beat the eggs and add 1.5 times warm water, spread minced meat at the bottom, cover with plastic wrap and steam for 10 minutes. Steam the pumpkin until soft and cut into pieces. Quickly stir-fry the baby bok choy. Soft rice. The steamed eggs are smooth and tender, served with pumpkin and vegetables.","香菇滑鸡+西兰花+软米饭":"Braised Chicken with Shiitake Mushrooms + Broccoli + Soft Rice","荤：鸡腿肉50g｜素：香菇2朵、西兰花3朵｜主食：米饭50g":"Meat: 50g chicken thigh｜Vegetables: 2 shiitake mushrooms, 3 broccoli florets｜Staple: 50g rice","鸡腿肉去骨切丁，加香菇片、少许淀粉和生抽拌匀，铺盘蒸12分钟。西兰花焯水2分钟。米饭蒸软。香菇滑鸡嫩滑多汁，配西兰花":"Debone the chicken thigh and cut into cubes, mix with sliced shiitake mushrooms, a little cornstarch, and light soy sauce, then spread on a plate and steam for 12 minutes. Blanch the broccoli for 2 minutes. Steam the rice until soft. The shiitake chicken is tender and juicy, served with broccoli.","清蒸鳕鱼+菠菜泥+土豆泥":"Steamed cod + spinach puree + mashed potatoes","荤：鳕鱼50g｜素：菠菜3棵、土豆半个｜主食：土豆泥":"Meat: 50g cod｜Vegetables: 3 spinach leaves, half a potato｜Staple: mashed potato","鳕鱼抹少许柠檬汁，铺姜片蒸8分钟，取出去皮去刺。土豆蒸熟压泥拌配方奶。菠菜焯水切碎。鳕鱼鲜嫩补DHA，配菠菜泥土豆泥":"Spread a little lemon juice on the cod, place ginger slices on top, and steam for 8 minutes. Remove the skin and bones. Steam the potatoes until cooked, then mash and mix with formula milk. Blanch the spinach and chop finely. Cod is tender and rich in DHA, served with spinach puree and mashed potatoes.","蒸肉饼+白灼生菜+冬瓜汤+软米饭":"Steamed meat patty + blanched lettuce + winter melon soup + soft rice","荤：猪肉末50g｜素：生菜2片、冬瓜1段｜主食：米饭50g":"Meat: 50g minced pork | Vegetables: 2 lettuce leaves, 1 piece of winter melon | Staple: 50g rice","肉末加少许蛋清和淀粉，铺平蒸12分钟成肉饼。生菜整片焯水20秒。冬瓜切片煮汤。米饭蒸软。肉饼原汁原味，配生菜冬瓜汤":"Add a little egg white and starch to the minced meat, spread it flat, and steam for 12 minutes to make a meat patty. Blanch whole lettuce leaves in boiling water for 20 seconds. Slice winter melon and cook it in soup. Steam the rice until soft. Serve the meat patty with its original juice, accompanied by lettuce and winter melon soup.","蛋黄虾仁豆腐羹+清炒小白菜+南瓜饭":"Egg Yolk and Shrimp Tofu Soup + Stir-Fried Baby Bok Choy + Pumpkin Rice","荤：虾仁30g、蛋黄1个｜素：嫩豆腐50g、小白菜2棵、南瓜50g｜主食：大米50g":"Meat: 30g shrimp, 1 egg yolk | Vegetarian: 50g soft tofu, 2 baby bok choy, 50g pumpkin | Staple: 50g rice","虾仁切丁，豆腐切小块，蛋黄打散。水烧开下豆腐虾仁煮3分钟，淋蛋液搅成羹。南瓜切丁与大米同焖成饭。小白菜快炒。豆腐羹补钙，配南瓜饭和青菜":"Dice the shrimp, cut the tofu into small pieces, and beat the egg yolk. Boil the water, add the tofu and shrimp, and cook for 3 minutes, then pour in the beaten egg and stir into a thick soup. Cut the pumpkin into cubes and cook with the rice until done. Quickly stir-fry the bok choy. Tofu soup supplements calcium and is served with pumpkin rice and green vegetables.","番茄鳕鱼豆腐+清炒西葫芦+软米饭":"Tomato Cod Tofu + Stir-Fried Zucchini + Soft Rice","荤：鳕鱼40g｜素：番茄1个、嫩豆腐40g、西葫芦1/4根｜主食：米饭50g":"Meat: 40g cod | Vegetarian: 1 tomato, 40g soft tofu, 1/4 zucchini | Staple: 50g rice","番茄去皮切丁炒出汁，加半碗水烧开，下鳕鱼丁和豆腐块焖5分钟。西葫芦切片快炒。软米饭。酸甜番茄鱼豆腐开胃，配西葫芦":"Peel and dice the tomatoes, fry until they release their juice, add half a bowl of water and bring to a boil, then add cod cubes and tofu pieces and simmer for 5 minutes. Slice the zucchini and stir-fry quickly. Soft rice. Sweet and sour tomato fish tofu is appetizing, served with zucchini.","冬瓜肉丸汤+蒜蓉油麦菜+小米饭":"Winter Melon Meatball Soup + Garlic Romaine Lettuce + Millet Rice","荤：猪肉末50g｜素：冬瓜1段、油麦菜2棵｜主食：大米40g+小米20g":"Meat: 50g minced pork | Vegetables: 1 section of winter melon, 2 heads of romaine lettuce | Staple: 40g rice + 20g millet","肉末加少许蛋清淀粉搅上劲，搓小丸子。水烧开下丸子煮至浮起，下冬瓜片再煮8分钟。油麦菜焯水，蒜末炝锅快炒。小米大米同焖饭。肉丸汤清爽不腻":"Mix the minced meat with a little egg white and starch until smooth, then roll into small meatballs. Boil water and cook the meatballs until they float, then add winter melon slices and cook for another 8 minutes. Blanch the romaine lettuce, and quickly stir-fry with minced garlic. Cook millet and rice together. The meatball soup is light and not greasy.","鸡蓉玉米羹+清炒茼蒿+软米饭":"Chicken and Corn Soup + Stir-fried Garland Chrysanthemum + Soft Rice","荤：鸡胸肉30g、鸡蛋1个｜素：甜玉米粒40g、茼蒿2棵｜主食：米饭50g":"Meat: 30g chicken breast, 1 egg | Vegetables: 40g sweet corn kernels, 2 stalks of garland chrysanthemum | Staple: 50g rice","鸡胸肉剁蓉，玉米粒加水煮软，用勺背压碎，倒入鸡蓉搅散煮5分钟，淋蛋液成羹。茼蒿切段快炒。软米饭。玉米鸡蓉羹香滑，配茼蒿":"Minced chicken breast, corn kernels boiled until soft, mashed with the back of a spoon, poured into the minced chicken and stirred to cook for 5 minutes, then drizzle with beaten eggs to make a thick soup. Chop crown daisy and stir-fry quickly. Soft rice. Corn and minced chicken soup is smooth and fragrant, served with crown daisy.","山药蒸肉丸+炒胡萝卜丝+菠菜饭":"Steamed Yam Meatballs + Stir-fried Shredded Carrots + Spinach Rice","荤：猪肉末50g｜素：山药50g、胡萝卜1/4根、菠菜2棵｜主食：大米50g":"Meat: 50g minced pork | Vegetarian: 50g yam, 1/4 carrot, 2 spinach leaves | Staple: 50g rice","山药去皮蒸熟压泥，与肉末拌匀搓小丸，蒸12分钟。胡萝卜擦丝炒软。菠菜焯水切碎拌入焖好的米饭里。山药肉丸易消化，配胡萝卜和菠菜饭":"Peel the Chinese yam, steam until cooked, mash it, mix with minced meat, shape into small balls, and steam for 12 minutes. Grate the carrot and stir-fry until soft. Blanch the spinach, chop it, and mix it into the cooked rice. Chinese yam meatballs are easy to digest and are served with carrot and spinach rice.","三文鱼蒸蛋+清炒豌豆苗+杂粮饭":"Steamed egg with salmon + Stir-fried pea shoots + Multigrain rice","荤：三文鱼30g、鸡蛋1个｜素：豌豆苗一小把、燕麦米少许｜主食：大米50g":"Meat: 30g salmon, 1 egg | Vegetables: a small handful of pea shoots, a little oatmeal | Staple: 50g rice","三文鱼切丁，鸡蛋打散加温水，鱼丁铺碗底淋蛋液蒸12分钟。豌豆苗快炒1分钟。大米加少许燕麦米同焖饭。三文鱼蒸蛋补DHA，配豌豆苗":"Dice the salmon, beat the eggs and add warm water, place the diced fish at the bottom of a bowl, pour in the egg mixture, and steam for 12 minutes. Stir-fry the pea shoots quickly for 1 minute. Cook the rice with a small amount of oat rice together. Steamed salmon with egg provides DHA, served with pea shoots.","排骨莲藕汤+清炒西兰花+软米饭":"Pork Rib and Lotus Root Soup + Stir-Fried Broccoli + Soft Rice","荤：排骨2小块｜素：莲藕1段、西兰花3朵｜主食：米饭50g":"Meat: 2 small pieces of pork ribs | Vegetables: 1 section of lotus root, 3 florets of broccoli | Staple: 50g of rice","排骨焯水，加姜片和莲藕块，小火炖1小时，取莲藕压泥、排骨肉切碎拌入汤。西兰花焯水。软米饭。莲藕排骨汤清甜润肺，配西兰花":"Blanch the pork ribs, add ginger slices and lotus root pieces, simmer over low heat for 1 hour, mash the lotus root, chop the pork ribs, and mix them into the soup. Blanch the broccoli. Soft rice. Lotus root and pork rib soup is sweet and nourishing for the lungs, served with broccoli.","山药鸡汤+白灼芦笋+软米饭":"Yam Chicken Soup + Blanched Asparagus + Soft Rice","荤：鸡腿1个｜素：山药80g、芦笋2根｜主食：米饭50g":"Meat: 1 chicken drumstick | Vegetables: 80g yam, 2 asparagus stalks | Staple: 50g rice","鸡腿去皮焯水，加山药块小火炖40分钟，取鸡腿肉切碎拌回汤里。芦笋去老皮焯水2分钟。软米饭。山药鸡汤健脾，配芦笋":"Peel the chicken leg and blanch it, then add yam chunks and simmer on low heat for 40 minutes. Take the chicken meat, chop it, and mix it back into the soup. Remove the old skin from the asparagus and blanch for 2 minutes. Soft rice. Yam chicken soup invigorates the spleen, served with asparagus.","鲫鱼豆腐汤+清炒小油菜+软米饭":"Crucian carp tofu soup + stir-fried baby bok choy + soft rice","荤：鲫鱼半条｜素：嫩豆腐50g、小油菜3棵｜主食：米饭50g":"Meat: Half a crucian carp | Vegetarian: 50g soft tofu, 3 small bok choy | Staple food: 50g rice","鲫鱼两面煎微黄，加开水大火煮10分钟至汤白，用纱布过滤鱼刺，加豆腐块再煮5分钟。小油菜快炒。软米饭。鲫鱼汤补钙，一定要滤净鱼刺":"Pan-fry the crucian carp on both sides until slightly yellow, add boiling water and cook on high heat for 10 minutes until the soup turns white, strain out the fish bones with a cloth, add tofu cubes and cook for another 5 minutes. Quickly stir-fry baby bok choy. Serve with soft rice. Crucian carp soup supplements calcium, be sure to strain out all the fish bones.","番茄牛肉汤+清炒卷心菜+土豆饭":"Tomato beef soup + stir-fried cabbage + potato rice","荤：牛肉末40g｜素：番茄1个、土豆半个、卷心菜2片｜主食：大米50g":"Meat: 40g minced beef | Vegetables: 1 tomato, half a potato, 2 cabbage leaves | Staple: 50g rice","番茄去皮切丁炒出汁，加开水烧开，下牛肉末搅散煮8分钟。土豆切小丁与大米同焖饭。卷心菜切丝快炒。酸甜番茄牛肉汤开胃补铁":"Peel the tomatoes and cut them into small cubes, then fry until they release juice. Add boiling water and bring to a boil, then add minced beef and stir to break it up, cooking for 8 minutes. Cut the potatoes into small cubes and cook together with rice to make a pilaf. Shred the cabbage and stir-fry quickly. Sweet and sour tomato beef soup is appetizing and iron-rich.","虾仁冬瓜汤+蒜蓉菠菜+软米饭":"Shrimp and Winter Melon Soup + Garlic Spinach + Soft Rice","荤：虾仁30g｜素：冬瓜1段、菠菜3棵｜主食：米饭50g":"Meat: 30g shrimp｜Vegetables: 1 section of winter melon, 3 spinach leaves｜Staple: 50g rice","虾仁去虾线用姜腌10分钟，冬瓜切薄片，水烧开同煮8分钟。菠菜焯水切段，蒜末炝锅快炒。软米饭。冬瓜虾仁汤清淡，配蒜蓉菠菜":"Devein the shrimp and marinate with ginger for 10 minutes. Cut the winter melon into thin slices and boil in water for 8 minutes. Blanch the spinach and cut into sections, stir-fry quickly with minced garlic in a heated pan. Soft rice. The winter melon and shrimp soup is light, served with garlic spinach.","宝宝罗宋汤+软米饭":"Baby Borscht + Soft Rice","荤：牛肉末40g｜素：番茄1个、土豆半个、洋葱1/8个、卷心菜2片｜主食：米饭50g":"Meat: 40g minced beef | Vegetables: 1 tomato, half a potato, 1/8 onion, 2 cabbage leaves | Staple: 50g rice","番茄去皮切丁炒出汁，加开水、土豆丁、洋葱碎煮15分钟，下牛肉末搅散再煮8分钟，最后下卷心菜丝煮3分钟。软米饭。蔬菜多营养全，酸甜好喝":"Peel and dice the tomatoes, sauté until they release juice, add boiling water, diced potatoes, and chopped onions, and cook for 15 minutes. Add minced beef and break it apart, then cook for another 8 minutes. Finally, add shredded cabbage and cook for 3 minutes. Soft rice. With plenty of vegetables, it's nutritious and completely wholesome, tangy and sweet, and delicious.","紫菜蛋花汤+肉末豆腐+软米饭":"Seaweed and egg drop soup + minced meat tofu + soft rice","荤：猪肉末30g、鸡蛋1个｜素：紫菜少许、嫩豆腐50g、小青菜2棵｜主食：米饭50g":"Meat: 30g minced pork, 1 egg | Vegetables: a little seaweed, 50g soft tofu, 2 small bok choy | Staple: 50g rice","肉末炒散，加豆腐块和半碗水焖5分钟。紫菜撕碎，淋蛋液煮成蛋花汤。软米饭。肉末豆腐补蛋白，配紫菜蛋花汤":"Stir-fry minced meat until crumbly, add tofu cubes and half a bowl of water, and simmer for 5 minutes. Tear the seaweed into pieces, pour in beaten eggs and cook into egg drop soup. Soft rice. Minced meat and tofu provide protein, served with seaweed egg drop soup.","番茄菌菇鸡肉汤+蒸南瓜+软米饭":"Tomato mushroom chicken soup + steamed pumpkin + soft rice","荤：鸡胸肉30g｜素：番茄1个、香菇2朵、金针菇一小把、南瓜50g｜主食：米饭50g":"Meat: 30g chicken breast | Vegetables: 1 tomato, 2 shiitake mushrooms, a small handful of enoki mushrooms, 50g pumpkin | Staple: 50g rice","鸡胸肉切丁，番茄去皮切丁炒出汁加水烧开，下鸡肉丁、香菇片、金针菇段煮10分钟。南瓜蒸软切块。软米饭。菌菇汤鲜，配南瓜":"Dice the chicken breast, peel and dice the tomatoes, fry until juicy, add water and bring to a boil. Add the chicken cubes, sliced shiitake mushrooms, and enoki mushroom sections, and cook for 10 minutes. Steam the pumpkin until soft and cut into pieces. Soft rice. The mushroom soup is fresh, served with pumpkin.","冬瓜瑶柱汤+清炒豆苗+软米饭":"Winter Melon and Dried Scallop Soup + Stir-Fried Pea Shoots + Soft Rice","荤：干瑶柱2粒｜素：冬瓜1段、豆苗一小把｜主食：米饭50g":"Meat: 2 dried scallops | Vegetarian: 1 section of winter melon, a small handful of pea shoots | Staple: 50g of rice","瑶柱泡软撕碎，与冬瓜片同煮15分钟。豆苗快炒1分钟。软米饭。瑶柱汤鲜美补锌，瑶柱含盐泡发后要冲洗干净":"Soak the dried scallops until soft and shred them, then cook with winter melon slices for 15 minutes. Stir-fry pea shoots quickly for 1 minute. Serve with soft rice. Scallop soup is delicious and replenishes zinc; rinse the scallops well after soaking them in salted water.","猪肝枸杞叶汤+清炒油麦菜+软米饭":"Pork liver and goji leaf soup + stir-fried romaine lettuce + soft rice","荤：猪肝30g｜素：枸杞叶一小把、油麦菜2棵｜主食：米饭50g":"Meat: 30g pork liver | Vegetables: a small handful of goji leaves, 2 stalks of romaine lettuce | Staple: 50g rice","猪肝泡水去腥切薄片，水烧开焯1分钟。另起锅煮汤，下枸杞叶煮2分钟，再下猪肝片煮1分钟。油麦菜焯水快炒。软米饭。猪肝补铁，枸杞叶清肝":"Soak pig liver in water to remove the odor and cut into thin slices, blanch in boiling water for 1 minute. In another pot, cook soup, add goji leaves and cook for 2 minutes, then add the pig liver slices and cook for 1 minute. Blanch and quickly stir-fry romaine lettuce. Soft rice. Pig liver supplements iron, goji leaves clear the liver.","时蔬肉末炒饭+紫菜蛋花汤+拌黄瓜":"Stir-fried rice with seasonal vegetables and minced meat + Seaweed and egg drop soup + Cucumber salad","荤：猪肉末40g、鸡蛋1个｜素：胡萝卜1/4根、豌豆粒20g、黄瓜1/4根、紫菜少许｜主食：米饭80g":"Meat: 40g minced pork, 1 egg | Vegetables: 1/4 carrot, 20g peas, 1/4 cucumber, a little seaweed | Staple: 80g rice","米饭压散。鸡蛋炒碎盛出，肉末炒散，加胡萝卜丁豌豆粒炒熟，倒回米饭和鸡蛋碎炒匀。紫菜蛋花汤。黄瓜去皮切条。一锅炒饭荤素全，配汤和黄瓜":"Fluff the rice. Scramble the eggs and set aside. Stir-fry the minced meat until broken up, add diced carrots and peas and cook through, then return the rice and scrambled eggs and stir-fry evenly. Seaweed and egg drop soup. Peel the cucumber and cut into strips. One pot of fried rice with both meat and vegetables, served with soup and cucumber.","虾仁蛋炒饭+冬瓜汤+清炒小青菜":"Shrimp and egg fried rice + winter melon soup + stir-fried baby bok choy","荤：虾仁30g、鸡蛋1个｜素：冬瓜1段、小青菜3棵、玉米粒20g｜主食：米饭80g":"Meat: 30g shrimp, 1 egg | Vegetables: 1 section of winter melon, 3 bok choy, 20g corn kernels | Staple: 80g rice","虾仁切丁炒变色，鸡蛋炒碎，加玉米粒和米饭炒匀。冬瓜煮汤。小青菜快炒。鲜虾蛋炒饭配冬瓜汤和青菜":"Dice the shrimp and stir-fry until it changes color, scramble the eggs, then add corn kernels and rice and stir-fry evenly. Boil the winter melon soup. Stir-fry the baby bok choy quickly. Fresh shrimp and egg fried rice served with winter melon soup and vegetables.","牛肉滑蛋粥+清炒西葫芦+蒸南瓜":"Beef and scrambled egg congee + stir-fried zucchini + steamed pumpkin","荤：牛肉末30g、鸡蛋1个｜素：西葫芦1/4根、南瓜50g｜主食：大米40g":"Meat: 30g minced beef, 1 egg | Vegetables: 1/4 zucchini, 50g pumpkin | Staple: 40g rice","大米煮粥。牛肉末加蛋液搅匀，粥快好时淋入滑散煮3分钟。西葫芦切片快炒。南瓜蒸软切块。牛肉滑蛋粥嫩滑补铁，配西葫芦南瓜":"Cook rice into porridge. Mix minced beef with beaten eggs, and when the porridge is almost done, pour in the mixture and cook for 3 minutes until smooth. Quickly stir-fry sliced zucchini. Steam the pumpkin until soft and cut into pieces. The beef and egg porridge is tender and iron-rich, served with zucchini and pumpkin.","鸡蛋丝瓜面+清炒胡萝卜+拌豆腐":"Egg and loofah noodles + stir-fried carrots + mixed tofu","荤：鸡蛋1个｜素：丝瓜半根、胡萝卜1/4根、嫩豆腐40g｜主食：宝宝面条50g":"Meat: 1 egg | Vegetarian: half a loofah, 1/4 carrot, 40g soft tofu | Staple: 50g baby noodles","丝瓜去皮切薄片炒软，加水烧开，下面条，淋入蛋液成蛋花。胡萝卜擦丝炒软。豆腐焯水切块淋少许香油。丝瓜面清润，配胡萝卜和豆腐":"Peel the sponge gourd and cut it into thin slices, stir-fry until soft, add water and bring to a boil, then add noodles and pour in beaten eggs to form egg ribbons. Grate the carrot and stir-fry until soft. Blanch the tofu, cut into pieces, and drizzle with a little sesame oil. The sponge gourd noodles are clear and smooth, served with carrot and tofu.","猪肉豆腐煲+清炒小白菜+软米饭":"Pork and tofu stew + stir-fried bok choy + soft rice","荤：猪肉末40g｜素：嫩豆腐50g、小白菜2棵、香菇1朵｜主食：米饭50g":"Meat: 40g of minced pork | Vegetarian: 50g of soft tofu, 2 baby bok choy, 1 shiitake mushroom | Staple: 50g of rice","肉末炒散，加香菇片和半碗水，下豆腐块小火焖8分钟，出锅淋一点水淀粉。小白菜快炒。软米饭。豆腐煲补钙，配小白菜":"Stir-fry minced meat until crumbly, add sliced mushrooms and half a bowl of water, then add tofu cubes and simmer on low heat for 8 minutes. Drizzle some cornstarch slurry before serving. Stir-fry baby bok choy quickly. Soft rice. Tofu casserole supplements calcium, served with baby bok choy.","鸡肉西兰花烩饭+清炒胡萝卜丝+黄瓜条":"Chicken and broccoli risotto + stir-fried shredded carrots + cucumber sticks","荤：鸡胸肉40g｜素：西兰花3朵、胡萝卜1/4根、黄瓜1/4根｜主食：米饭60g":"Meat: 40g chicken breast | Vegetables: 3 broccoli florets, 1/4 carrot, 1/4 cucumber | Staple: 60g rice","鸡胸肉切丁炒白，加半碗水焖5分钟，下西兰花小朵和米饭翻匀焖2分钟成烩饭。胡萝卜擦丝炒软。黄瓜去皮切条。西兰花鸡肉烩饭一锅搞定，配胡萝卜黄瓜":"Dice the chicken breast and stir-fry until white, add half a bowl of water and simmer for 5 minutes, then add small broccoli florets and rice, stir to mix and simmer for 2 minutes to make a risotto. Grate the carrot and stir-fry until soft. Peel the cucumber and cut into strips. Broccoli chicken risotto is done in one pot, served with carrots and cucumber.","鳕鱼菜粥+清炒土豆丝+番茄块":"Cod fish and vegetable porridge + Stir-fried shredded potatoes + Tomato chunks","荤：鳕鱼40g｜素：小青菜3棵、土豆半个、番茄半个｜主食：大米40g":"Meat: 40g of cod | Vegetables: 3 baby bok choy, half a potato, half a tomato | Staple: 40g of rice","大米煮粥，鳕鱼蒸熟去刺压碎拌入，最后拌入焯水切碎的小青菜。土豆切丝泡水快炒。番茄去皮切块。鳕鱼菜粥补DHA，配土豆丝番茄":"Cook rice into porridge, steam the codfish, remove the bones, mash it and mix in, finally mix in the blanched and chopped small greens. Cut the potato into shreds, soak in water, and stir-fry quickly. Peel the tomato and cut into pieces. Codfish vegetable porridge provides DHA, served with shredded potatoes and tomatoes.","肉末四季豆焖面+白灼西兰花":"Braised Noodles with Minced Pork and Green Beans + Blanched Broccoli","荤：猪肉末40g｜素：四季豆6根、西兰花3朵、胡萝卜1/4根｜主食：宝宝面条50g":"Meat: 40g minced pork | Vegetables: 6 green beans, 3 broccoli florets, 1/4 carrot | Staple: 50g baby noodles","四季豆撕筋切碎，焯水5分钟（四季豆必须彻底煮熟）。肉末炒散，加四季豆、胡萝卜丁和半碗水，铺面条加盖焖5分钟拌匀。西兰花焯水。焖面入味，配白灼西兰花":"Tear the strings off the green beans and chop them, then blanch for 5 minutes (the green beans must be thoroughly cooked). Stir-fry the ground meat until crumbly, add the green beans, diced carrots, and half a bowl of water, layer the noodles on top, cover, and simmer for 5 minutes, then mix well. Blanch the broccoli. The noodles are flavorful and served with boiled broccoli.","虾仁西葫芦煎饼+南瓜小米粥+清炒卷心菜":"Shrimp and Zucchini Pancakes + Pumpkin Millet Porridge + Stir-Fried Cabbage","荤：虾仁30g｜素：西葫芦1/4根、卷心菜2片、南瓜50g｜主食：面粉30g、小米30g":"Meat: 30g shrimp | Vegetables: 1/4 zucchini, 2 cabbage leaves, 50g pumpkin | Staple: 30g flour, 30g millet","虾仁剁碎，西葫芦擦丝，与面粉和少量水拌成糊，小火煎小饼。南瓜切丁与小米同熬成粥。卷心菜切丝快炒。鲜香小饼配南瓜小米粥和炒卷心菜":"Chop the shrimp, grate the zucchini, and mix with flour and a small amount of water into a batter, then cook small pancakes over low heat. Cut the pumpkin into cubes and cook with millet into porridge. Shred the cabbage and stir-fry quickly. Serve the fragrant small pancakes with pumpkin millet porridge and stir-fried cabbage.","时蔬鸡蛋卷饼+小米粥+清炒豆芽":"Seasonal Vegetable and Egg Roll + Millet Porridge + Stir-Fried Bean Sprouts","荤：鸡蛋1个｜素：生菜1片、胡萝卜1/4根、豆芽一小把、黄瓜1/4根｜主食：面粉40g、小米30g":"Meat: 1 egg | Vegetables: 1 lettuce leaf, 1/4 carrot, a small handful of bean sprouts, 1/4 cucumber | Staple foods: 40g flour, 30g millet","面粉加水和蛋液调成糊，摊成薄饼，卷入炒软的胡萝卜丝、生菜叶和黄瓜条，切段。小米熬粥。豆芽快炒。蛋饼卷蔬菜色彩诱人，配小米粥和豆芽":"Mix flour with water and beaten eggs to make a batter, spread into thin pancakes, roll in sautéed carrot shreds, lettuce leaves, and cucumber sticks, and cut into sections. Cook millet porridge. Quickly stir-fry bean sprouts. The egg pancake rolled with vegetables is visually appealing, served with millet porridge and bean sprouts.","谷物 50-100g":"Grains 50-100g","蔬菜 50-150g":"Vegetables 50-150g","水果 50-150g":"Fruit 50-150g","肉禽鱼 50-75g":"Meat, poultry, and fish 50-75g","鸡蛋 1 个":"1 egg","奶 400-600ml":"Milk 400-600ml","油 5-15g":"Oil 5-15g","盐 <1.5g（尽量不加）":"Salt <1.5g (try not to add)","周一":"Monday","奶香小馒头":"Milky Small Steamed Buns","小米粥":"Millet porridge","蒸蛋羹":"Steamed Egg Custard","软煮苹果丁":"Soft-cooked apple cubes","早餐补蛋白，午餐补铁，晚餐清淡好消化":"Eat protein at breakfast, iron at lunch, and have a light, easy-to-digest dinner.","周二":"Tuesday","山药小馒头":"Yam Mini Steamed Buns","南瓜粥":"Pumpkin porridge","奶酪丁":"Cheese cubes","胡萝卜牛肉焖饭+白灼西兰花+甜玉米粒":"Braised Rice with Carrots and Beef + Blanched Broccoli + Sweet Corn Kernels","虾仁豆腐饼+菠菜汤+蒸南瓜":"Shrimp and Tofu Patties + Spinach Soup + Steamed Pumpkin","牛肉补铁，豆腐补钙，粗细搭配":"Beef supplements iron, tofu supplements calcium, a mix of coarse and fine.","周三":"Wednesday","全麦面包条":"Whole Wheat Bread Sticks","酸奶":"Yogurt", 't sneak away; do what you say and be on time.","回来热情抱抱：「妈妈回来了」":"Come back with a warm hug: 'Mom is back'","发脾气躺地哭闹":"Throw a tantrum and lie on the ground crying and fussing","冷处理但不离开：陪着，等他平静":"Cold treatment but don't leave: stay with him, wait for him to calm down","不妥协也不讲大道理":"Neither compromising nor preaching moral principles","共情命名情绪：「你很生气，因为不能买」":"Empathetic naming of emotions: 'You are angry because you can't buy it'","平静后抱抱，简短说下次怎么做":"Hug after calming down, briefly talk about what to do next time","不肯睡觉":"Refusing to sleep","固定睡前流程：洗澡→绘本→关灯":"Fixed bedtime routine: bath → picture book → turn off the lights","白天保证充足放电":"Ensure sufficient discharge during the day","房间调暗，用安抚物":"Dim the room and use a comfort object","睡前不玩兴奋游戏":"Do not play exciting games before bed","摸插座 / 危险物品":"Touching outlets / Dangerous items","立即移开+简短说「危险」，不说教":"Move away immediately + briefly say 'Danger', without lecturing","做好安全防护：插座保护盖、危险物收纳":"Ensure safety protection: socket covers, storage of dangerous items","给安全替代品转移兴趣":"Transfer interest to safe alternatives","危险场景反复、多次示范":"Repeated dangerous scenarios and multiple demonstrations","不肯穿衣服":"Refuses to wear clothes","给选择：「穿红的还是蓝的？」":"Give a choice: 'Red one or blue one?'","游戏化：「小手钻山洞咯」":"Gamification: 'Little hands dig the cave'","提前预告：「我们穿好就出去玩」":"Advance notice: 'We’ll go out to play once we’re dressed'","早上时间紧时，前一天晚上备好衣服":"When time is tight in the morning, prepare your clothes the night before.","去早教中心 / 亲戚家就哭":"Cry when going to the early education center / relatives' house","提前几天铺垫：「那里有滑梯和好朋友」":"Lay the groundwork a few days in advance: 'There is a slide and good friends there'","到了先陪玩一会儿再离开":"Arrive and play together for a while before leaving","固定再见仪式，果断告别不拖沓":"Set a fixed farewell ritual and say goodbye decisively without dragging it out","不批评「怎么又哭」，回来多肯定":"Don't criticize by saying 'Why are you crying again'; give more affirmation when they come back.","商场里乱跑":"Running around in the mall","出门前立规矩：「牵手约定」":"Set rules be
